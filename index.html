<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>國小三年級期末大考・108課綱全科目全真模擬題庫系統</title>
<style>
  :root {
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --primary-light: #eff6ff;
    --success: #10b981;
    --danger: #ef4444;
    --warning: #f59e0b;
    --text-main: #0f172a;
    --text-sub: #475569;
    --bg-page: #f8fafc;
    --card-bg: #ffffff;
    --border: #cbd5e1;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
    background: var(--bg-page);
    color: var(--text-main);
    margin: 0;
    padding: 12px;
  }
  .app-container {
    max-width: 940px;
    margin: 0 auto;
    background: var(--card-bg);
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.06);
    overflow: hidden;
    border: 1px solid var(--border);
  }
  header {
    background: linear-gradient(135deg, #1e3a8a, #2563eb);
    color: white;
    padding: 22px 20px;
    text-align: center;
  }
  header h1 { margin: 0 0 6px 0; font-size: 22px; font-weight: 800; letter-spacing: 0.5px; }
  header p { margin: 0; font-size: 13.5px; opacity: 0.95; }

  .status-bar {
    background: #0f172a;
    color: #e2e8f0;
    padding: 10px 18px;
    font-size: 13px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  .badge-status {
    background: #059669;
    color: #ecfdf5;
    padding: 4px 10px;
    border-radius: 6px;
    font-weight: 700;
  }

  .subject-nav {
    display: flex;
    background: #e2e8f0;
    padding: 6px;
    gap: 6px;
    overflow-x: auto;
  }
  .sub-btn {
    flex: 1;
    min-width: 95px;
    padding: 12px 6px;
    border: none;
    border-radius: 12px;
    background: transparent;
    color: #475569;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
  }
  .sub-btn.active {
    background: white;
    color: var(--primary-dark);
    box-shadow: 0 4px 10px rgba(37, 99, 235, 0.15);
  }

  .lesson-bar {
    padding: 12px 18px;
    background: var(--primary-light);
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .lesson-bar label { font-size: 14px; font-weight: 700; color: #1e293b; white-space: nowrap; }
  .lesson-select {
    flex: 1;
    min-width: 280px;
    padding: 9px 12px;
    border: 1px solid #94a3b8;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    background: white;
    color: #0f172a;
    outline: none;
  }
  .action-btn {
    padding: 9px 16px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .action-btn:hover { background: var(--primary-dark); }
  .mode-badge {
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12.5px;
    font-weight: 700;
    background: #dbeafe;
    color: #1e40af;
  }

  .main-panel { padding: 22px; min-height: 480px; }
  .status-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    font-size: 14px;
    font-weight: 700;
    color: var(--text-sub);
  }
  .q-badge {
    background: #e2e8f0;
    padding: 5px 12px;
    border-radius: 20px;
    color: #1e293b;
    font-size: 13px;
  }
  .score-badge {
    background: #fef3c7;
    color: #92400e;
    padding: 5px 12px;
    border-radius: 20px;
  }
  .q-box {
    background: #fafbfe;
    border: 2px solid #e2e8f0;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .q-title {
    font-size: 18.5px;
    font-weight: 700;
    line-height: 1.65;
    color: #0f172a;
    margin: 0;
  }

  /* 圖形繪製畫布容器 */
  .diagram-container {
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 16px auto;
    background: #ffffff;
    border: 2px solid #cbd5e1;
    border-radius: 14px;
    padding: 12px;
    max-width: 520px;
    min-height: 200px;
  }
  .diagram-container canvas {
    max-width: 100%;
    height: auto;
  }

  /* 選擇題與是非題按鈕 */
  .choice-list { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
  .choice-btn {
    width: 100%;
    padding: 15px 20px;
    border: 2px solid #cbd5e1;
    border-radius: 12px;
    background: white;
    text-align: left;
    font-size: 16px;
    font-weight: 600;
    line-height: 1.45;
    cursor: pointer;
    color: #1e293b;
    transition: all 0.15s;
  }
  .choice-btn:hover { border-color: var(--primary); background: #eff6ff; }

  /* 數學計算機按鈕機 */
  .math-display-container {
    background: white;
    border: 2px dashed #94a3b8;
    border-radius: 12px;
    padding: 12px;
    min-height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
  }
  .math-display-text {
    font-size: 26px;
    font-weight: 800;
    color: #1e3a8a;
    letter-spacing: 2px;
    min-height: 32px;
  }
  .math-keypad {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    max-width: 520px;
    margin: 0 auto 12px auto;
  }
  .m-key {
    padding: 14px 0;
    font-size: 20px;
    font-weight: 800;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    background: white;
    color: #1e293b;
    cursor: pointer;
    text-align: center;
  }
  .m-key.op { background: #eff6ff; color: #2563eb; border-color: #bfdbfe; }
  .m-key.func { background: #fee2e2; color: #dc2626; border-color: #fca5a5; }
  .m-key.submit { background: #059669; color: white; grid-column: span 2; border: none; }

  /* 英文拼字鍵盤 */
  .spell-display {
    min-height: 52px;
    border: 2px dashed #94a3b8;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 14px;
    background: white;
    padding: 8px;
  }
  .letter-box {
    width: 38px;
    height: 44px;
    border-bottom: 3px solid var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 800;
    color: var(--primary);
    background: #f8fafc;
  }
  .virtual-keyboard {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    margin-bottom: 12px;
  }
  .vk-key {
    padding: 12px 0;
    border: 1px solid #cbd5e1;
    background: white;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 800;
    text-align: center;
    cursor: pointer;
  }
  .spell-actions { display: flex; gap: 10px; }
  .spell-action-btn {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
  }
  .btn-del { background: #fee2e2; color: #b91c1c; }
  .btn-submit { background: var(--primary); color: white; }

  /* 回饋解析卡 */
  .feedback-box {
    margin-top: 18px;
    padding: 16px;
    border-radius: 14px;
    display: none;
  }
  .feedback-box.correct { background: #ecfdf5; border: 2px solid #6ee7b7; color: #065f46; }
  .feedback-box.wrong { background: #fef2f2; border: 2px solid #fca5a5; color: #991b1b; }
  .fb-title { font-size: 16px; font-weight: 800; margin-bottom: 6px; }
  .fb-detail { font-size: 14.5px; line-height: 1.6; }
  .next-btn {
    display: block;
    width: 100%;
    margin-top: 14px;
    padding: 14px;
    background: #0f172a;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 15.5px;
    font-weight: 700;
    cursor: pointer;
  }

  .notebook-view { display: none; padding: 16px; }
  .nb-card {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;
    background: #fff;
  }
</style>
</head>
<body>

<div class="app-container">
  <header>
    <h1>國小三年級期末大考・108課綱全真全科模擬系統</h1>
    <p>📐 數學5~9單元(動態繪圖) ｜ 📖 國語7~12課(120題) ｜ 🌱 自然3~4單元(200題) ｜ 🔤 英文Dino3</p>
  </header>

  <div class="status-bar">
    <span id="syncStatusText">✨ 官方 500+ 真題與幾何動態繪圖引擎全部就緒</span>
    <span id="syncBadge" class="badge-status">全題庫就緒</span>
  </div>

  <div class="subject-nav">
    <button class="sub-btn active" onclick="switchSubject('math')">🔢 數學實驗室</button>
    <button class="sub-btn" onclick="switchSubject('chinese')">📖 國語真題</button>
    <button class="sub-btn" onclick="switchSubject('nature')">🌱 自然科學</button>
    <button class="sub-btn" onclick="switchSubject('english')">🔤 英文闖關</button>
    <button class="sub-btn" onclick="openNotebook()" style="color:#d97706;">📝 錯題筆記</button>
  </div>

  <div class="lesson-bar" id="lessonBar">
    <label for="lessonSelect">選擇測驗單元：</label>
    <select id="lessonSelect" class="lesson-select" onchange="onLessonChange()"></select>
    <button class="action-btn" onclick="loadQuestions()">🎲 換一批全新題目</button>
    <span class="mode-badge" id="poolBadge">載入中...</span>
  </div>

  <div class="main-panel" id="mainPanel">
    <div class="status-row">
      <span class="q-badge" id="typeBadge">選擇題</span>
      <span id="progressText">第 1 題</span>
      <span class="score-badge" id="scoreText">得分：0</span>
    </div>

    <div class="q-box">
      <h2 class="q-title" id="qTitle">題目載入中...</h2>
      <div id="diagramArea"></div>
    </div>

    <div id="optionArea"></div>

    <div class="feedback-box" id="feedbackBox">
      <div class="fb-title" id="fbTitle"></div>
      <div class="fb-detail" id="fbDetail"></div>
      <button class="next-btn" onclick="nextQuestion()">進入下一題 ➔</button>
    </div>
  </div>

  <div class="notebook-view" id="notebookPanel">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
      <h3 style="margin:0; font-size:18px;">📝 錯題收錄筆記本</h3>
      <button onclick="closeNotebook()" style="padding:6px 14px; border-radius:8px; border:1px solid #cbd5e1; font-weight:700; cursor:pointer;">返回練習</button>
    </div>
    <div id="wrongList">目前沒有錯題，表現優異！</div>
  </div>
</div>

<script>
// Google 試算表綁定
const SPREADSHEET_ID = "13lCIn_XK-f-PMHsBGJHiW3Wvv6JEeLJQheN-7-08_fM";
const SHEET_NAME = "題庫資料表";
let CLOUD_QUESTIONS = [];

function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function sample(arr) { return arr[rand(0, arr.length - 1)]; }

// ==========================================
// 繪圖引擎
// ==========================================
const DrawEngine = {
  drawAngleParts: function(canvas) {
    const ctx = canvas.getContext('2d');
    const w = canvas.width = 340, h = canvas.height = 200;
    ctx.clearRect(0, 0, w, h);
    const bx = 60, by = 140, px = 240, py = 140, mx = 180, my = 40;
    ctx.lineWidth = 3; ctx.strokeStyle = "#1e293b";
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(px, py); ctx.stroke();
    DrawEngine.drawArrow(ctx, px, py, 0);
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(mx, my); ctx.stroke();
    const rad = Math.atan2(my - by, mx - bx);
    DrawEngine.drawArrow(ctx, mx, my, rad);
    ctx.lineWidth = 2.5; ctx.strokeStyle = "#2563eb";
    ctx.beginPath(); ctx.arc(bx, by, 40, rad, 0); ctx.stroke();
    ctx.font = "bold 16px sans-serif";
    ctx.fillStyle = "#ef4444"; ctx.beginPath(); ctx.arc(bx, by, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillText("ㄅ (頂點)", bx - 50, by + 5);
    ctx.fillStyle = "#2563eb"; ctx.beginPath(); ctx.arc(px, py, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillText("ㄆ", px + 10, py + 5);
    ctx.beginPath(); ctx.arc(mx, my, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillText("ㄇ", mx + 10, my - 5);
  },
  drawCutCorner: function(canvas, cutType) {
    const ctx = canvas.getContext('2d');
    const w = canvas.width = 340, h = canvas.height = 210;
    ctx.clearRect(0, 0, w, h);
    const rx = 50, ry = 40, rw = 220, rh = 130;
    ctx.lineWidth = 2; ctx.strokeStyle = "#94a3b8"; ctx.setLineDash([5, 5]);
    ctx.strokeRect(rx, ry, rw, rh); ctx.setLineDash([]);
    ctx.lineWidth = 3; ctx.strokeStyle = "#1e293b"; ctx.fillStyle = "#e0f2fe";
    ctx.beginPath();
    if (cutType === 5) {
      ctx.moveTo(rx, ry); ctx.lineTo(rx + rw - 60, ry); ctx.lineTo(rx + rw, ry + 60); ctx.lineTo(rx + rw, ry + rh); ctx.lineTo(rx, ry + rh);
    } else {
      ctx.moveTo(rx, ry); ctx.lineTo(rx + rw, ry + rh); ctx.lineTo(rx, ry + rh);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#ef4444"; ctx.font = "bold 14px sans-serif";
    ctx.fillText("✂️ 剪切線", rx + rw - 70, ry + 25);
  },
  drawRulerTest: function(canvas, type) {
    const ctx = canvas.getContext('2d');
    const w = canvas.width = 340, h = canvas.height = 210;
    ctx.clearRect(0, 0, w, h);
    const ox = 70, oy = 160;
    ctx.lineWidth = 4; ctx.strokeStyle = "#ef4444";
    ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ox + 160, oy); ctx.stroke();
    let deg = (type === 'acute') ? 50 : 125;
    const rad = -deg * Math.PI / 180;
    ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ox + 160 * Math.cos(rad), oy + 160 * Math.sin(rad)); ctx.stroke();
    ctx.lineWidth = 2.5; ctx.strokeStyle = "#059669"; ctx.fillStyle = "rgba(16, 185, 129, 0.25)";
    ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ox + 130, oy); ctx.lineTo(ox, oy - 130); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.lineWidth = 2; ctx.strokeRect(ox, oy - 20, 20, 20);
    ctx.font = "bold 14px sans-serif"; ctx.fillStyle = "#059669"; ctx.fillText("三角板的直角", ox + 15, oy - 60);
    ctx.fillStyle = "#ef4444"; ctx.fillText("紅色：待測角", ox + 140, oy - 120);
  },
  drawPolygon: function(canvas, type) {
    const ctx = canvas.getContext('2d');
    const w = canvas.width = 300, h = canvas.height = 200;
    ctx.clearRect(0, 0, w, h);
    ctx.lineWidth = 3; ctx.strokeStyle = "#1e293b"; ctx.fillStyle = "#e0f2fe";
    ctx.beginPath();
    if (type === 'right_trapezoid') {
      ctx.moveTo(60, 160); ctx.lineTo(240, 160); ctx.lineTo(170, 50); ctx.lineTo(60, 50); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.lineWidth = 2; ctx.strokeStyle = "#ef4444"; ctx.strokeRect(60, 140, 20, 20); ctx.strokeRect(60, 50, 20, 20);
    } else if (type === 'right_triangle') {
      ctx.moveTo(50, 160); ctx.lineTo(250, 160); ctx.lineTo(50, 40); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.lineWidth = 2; ctx.strokeStyle = "#ef4444"; ctx.strokeRect(50, 140, 20, 20);
    } else if (type === 'obtuse_triangle') {
      ctx.moveTo(110, 160); ctx.lineTo(270, 160); ctx.lineTo(40, 60); ctx.closePath(); ctx.fill(); ctx.stroke();
    }
  },
  drawLetterAngle: function(canvas, letter) {
    const ctx = canvas.getContext('2d');
    const w = canvas.width = 240, h = canvas.height = 180;
    ctx.clearRect(0, 0, w, h);
    ctx.lineWidth = 14; ctx.strokeStyle = "#1e3a8a"; ctx.lineCap = "square";
    const ox = 70, oy = 30, sz = 110;
    ctx.beginPath();
    if (letter === 'E') {
      ctx.moveTo(ox + sz - 30, oy); ctx.lineTo(ox, oy); ctx.lineTo(ox, oy + sz); ctx.lineTo(ox + sz - 30, oy + sz);
      ctx.moveTo(ox, oy + sz / 2); ctx.lineTo(ox + sz - 45, oy + sz / 2);
    } else {
      ctx.moveTo(ox, oy); ctx.lineTo(ox, oy + sz); ctx.lineTo(ox + sz - 20, oy + sz);
    }
    ctx.stroke();
  },
  drawClock: function(canvas, hour, min = 0) {
    const ctx = canvas.getContext('2d');
    const size = canvas.width = canvas.height = 220;
    ctx.clearRect(0, 0, size, size);
    const cx = size / 2, cy = size / 2, r = 90;
    ctx.lineWidth = 4; ctx.strokeStyle = "#1e293b"; ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.font = "bold 14px sans-serif"; ctx.fillStyle = "#334155"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    for (let i = 1; i <= 12; i++) {
      const a = (i * 30 - 90) * Math.PI / 180;
      ctx.fillText(i, cx + (r - 18) * Math.cos(a), cy + (r - 18) * Math.sin(a));
    }
    const minAngle = (min * 6 - 90) * Math.PI / 180;
    ctx.lineWidth = 3.5; ctx.strokeStyle = "#2563eb";
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + (r - 28) * Math.cos(minAngle), cy + (r - 28) * Math.sin(minAngle)); ctx.stroke();
    const hourAngle = ((hour % 12 + min / 60) * 30 - 90) * Math.PI / 180;
    ctx.lineWidth = 5; ctx.strokeStyle = "#ef4444";
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + (r - 45) * Math.cos(hourAngle), cy + (r - 45) * Math.sin(hourAngle)); ctx.stroke();
    ctx.fillStyle = "#0f172a"; ctx.beginPath(); ctx.arc(cx, cy, 6, 0, Math.PI * 2); ctx.fill();
  },
  drawTwoAngles: function(canvas, deg1, deg2, len1, len2) {
    const ctx = canvas.getContext('2d');
    const w = canvas.width = 460, h = canvas.height = 200;
    ctx.clearRect(0, 0, w, h);
    DrawEngine.renderSubAngle(ctx, 40, 150, deg1, len1, "甲角", "#2563eb");
    DrawEngine.renderSubAngle(ctx, 260, 150, deg2, len2, "乙角", "#d97706");
  },
  renderSubAngle: function(ctx, ox, oy, deg, len, label, color) {
    const rad = -deg * Math.PI / 180;
    ctx.lineWidth = 3; ctx.strokeStyle = "#1e293b";
    ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ox + len, oy); ctx.stroke();
    DrawEngine.drawArrow(ctx, ox + len, oy, 0);
    const ex = ox + len * Math.cos(rad), ey = oy + len * Math.sin(rad);
    ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ex, ey); ctx.stroke();
    DrawEngine.drawArrow(ctx, ex, ey, rad);
    ctx.lineWidth = 2.5; ctx.strokeStyle = color;
    ctx.beginPath(); ctx.arc(ox, oy, 30, rad, 0); ctx.stroke();
    ctx.font = "bold 15px sans-serif"; ctx.fillStyle = color;
    ctx.fillText(label, ox + 15, oy - 45);
  },
  drawAreaGrid: function(canvas, cols, rows, colored, half) {
    const ctx = canvas.getContext('2d');
    const sz = 32;
    canvas.width = cols * sz + 40; canvas.height = rows * sz + 40;
    const ox = 20, oy = 20;
    ctx.lineWidth = 1; ctx.strokeStyle = "#cbd5e1";
    for (let r = 0; r <= rows; r++) { ctx.beginPath(); ctx.moveTo(ox, oy + r * sz); ctx.lineTo(ox + cols * sz, oy + r * sz); ctx.stroke(); }
    for (let c = 0; c <= cols; c++) { ctx.beginPath(); ctx.moveTo(ox + c * sz, oy); ctx.lineTo(ox + c * sz, oy + rows * sz); ctx.stroke(); }
    ctx.fillStyle = "#86efac"; ctx.strokeStyle = "#15803d"; ctx.lineWidth = 2;
    for (let i = 0; i < colored; i++) {
      const c = i % cols, r = Math.floor(i / cols);
      ctx.fillRect(ox + c * sz, oy + r * sz, sz, sz); ctx.strokeRect(ox + c * sz, oy + r * sz, sz, sz);
    }
    ctx.fillStyle = "#38bdf8"; ctx.strokeStyle = "#0369a1";
    for (let i = 0; i < half; i++) {
      const c = (colored + i) % cols, r = Math.floor((colored + i) / cols);
      ctx.beginPath(); ctx.moveTo(ox + c * sz, oy + r * sz); ctx.lineTo(ox + (c + 1) * sz, oy + (r + 1) * sz); ctx.lineTo(ox + c * sz, oy + (r + 1) * sz); ctx.closePath(); ctx.fill(); ctx.stroke();
    }
  },
  drawDisplacement: function(canvas, beforeMl, afterMl) {
    const ctx = canvas.getContext('2d');
    canvas.width = 380; canvas.height = 220;
    DrawEngine.renderCyl(ctx, 60, 20, beforeMl, "放入前", false);
    DrawEngine.renderCyl(ctx, 220, 20, afterMl, "放入鐵球後", true);
  },
  renderCyl: function(ctx, x, y, ml, label, hasStone) {
    const cw = 70, ch = 160;
    ctx.lineWidth = 3; ctx.strokeStyle = "#334155"; ctx.fillStyle = "#f8fafc";
    ctx.strokeRect(x, y, cw, ch);
    const waterH = (ml / 700) * (ch - 20);
    const wy = y + ch - waterH;
    ctx.fillStyle = "rgba(56, 189, 248, 0.45)";
    ctx.fillRect(x + 2, wy, cw - 4, waterH);
    if (hasStone) {
      ctx.fillStyle = "#475569"; ctx.beginPath(); ctx.arc(x + cw / 2, y + ch - 22, 16, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = "#0f172a"; ctx.stroke();
    }
    ctx.font = "bold 13px sans-serif"; ctx.fillStyle = "#0369a1";
    ctx.fillText(`${ml} mL`, x + cw + 10, wy + 4);
    ctx.fillStyle = "#0f172a"; ctx.font = "bold 14px sans-serif";
    ctx.fillText(label, x + 8, y + ch + 22);
  },
  drawFractionCircle: function(canvas, totalParts, takenParts) {
    const ctx = canvas.getContext('2d');
    const size = canvas.width = canvas.height = 200;
    const cx = size / 2, cy = size / 2, r = 80;
    const sliceRad = (2 * Math.PI) / totalParts;
    ctx.lineWidth = 2.5; ctx.strokeStyle = "#1e293b";
    for (let i = 0; i < totalParts; i++) {
      const sRad = i * sliceRad - Math.PI / 2;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, r, sRad, sRad + sliceRad); ctx.closePath();
      ctx.fillStyle = (i < takenParts) ? "#f59e0b" : "#fef3c7";
      ctx.fill(); ctx.stroke();
    }
  },
  drawArrow: function(ctx, x, y, rad) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rad); ctx.fillStyle = "#1e293b";
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-10, -5); ctx.lineTo(-10, 5); ctx.closePath(); ctx.fill(); ctx.restore();
  }
};

汁自己往上跳", "吸管具有磁力", "地心引力"], "ans": 0}, {"subject": "nature", "lesson": "n_air", "type": "choice", "title": "下列哪種交通工具運行時「不需要」依靠空氣環境？", "explain": "太空中接近真空沒有空氣，衛星靠慣性與引力運行。", "options": ["民航飛機", "直升機", "熱氣球", "太空中運行的人造衛星"], "ans": 3}, {"subject": "nature", "lesson": "n_air", "type": "choice", "title": "給籃球打氣時越打越費力，是因為球內的空氣：", "explain": "球內壓縮空氣的反抗彈力增強。", "options": ["壓力越來越大", "溫度變冰冷", "體積自動變小", "跑出來了"], "ans": 0}, {"subject": "nature", "lesson": "n_air", "type": "choice", "title": "兩個倒立懸掛的紙杯，拿吹風機往中間空隙吹風，兩個紙杯會：", "explain": "中間空氣流速快氣壓降低，外側大氣壓力推擠使其靠攏。", "options": ["向中間靠攏", "向兩側分開", "往下掉落", "向上飛走"], "ans": 0}, {"subject": "nature", "lesson": "n_air", "type": "choice", "title": "吹氣球時，氣球會漸漸鼓起變大，這說明空氣具有什麼特性？", "explain": "氣球膨脹代表空氣進入並佔據了內部空間。", "options": ["會佔據空間", "有特殊的甜味", "會燃燒", "顏色是白色的"], "ans": 0}, {"subject": "nature", "lesson": "n_air", "type": "choice", "title": "將點燃的蠟燭用透明玻璃杯完全蓋住，過一會兒蠟燭熄滅，是因為：", "explain": "燃燒需要空氣中的氧氣，耗盡即熄滅。", "options": ["杯內助燃的氧氣消耗完畢", "風太大吹熄了", "杯子太冷了", "蠟燭融化光了"], "ans": 0}, {"subject": "nature", "lesson": "n_air", "type": "choice", "title": "將注射筒抽滿空氣堵住前端，用力推活塞後再「鬆開手」，活塞會：", "explain": "被壓縮的空氣具有向外彈開的恢復力。", "options": ["自動往後彈回一段", "繼續往前衝", "停在最前面不動", "粉碎破裂"], "ans": 0}, {"subject": "nature", "lesson": "n_air", "type": "choice", "title": "把氣球吹大綁緊，放進裝有冰塊的冰水盆中，氣球會：", "explain": "氣體遇冷體積收縮（熱脹冷縮）。", "options": ["稍微縮小變皺", "變得更膨脹", "立刻爆破", "完全沒有任何改變"], "ans": 0}, {"subject": "nature", "lesson": "n_air", "type": "choice", "title": "夏天在密閉的冷氣房裡，冷氣吹出來的冷空氣通常會：", "explain": "冷空氣比熱空氣重，會向下沉降。", "options": ["向下沉降", "向上飄到天花板", "停在原地不動", "變成白霧消失"], "ans": 0}, {"subject": "nature", "lesson": "n_air", "type": "choice", "title": "水槍能把水噴得又高又遠，通常是利用槍身內部的什麼力量？", "explain": "打氣加壓使內部空氣壓縮，扣板機時壓縮空氣釋放推擠水柱。", "options": ["壓縮空氣產生的推力", "電池的電力", "磁鐵的排斥力", "齒輪轉動"], "ans": 0}, {"subject": "nature", "lesson": "n_air", "type": "choice", "title": "在裝滿水的寶特瓶底戳一個小洞，蓋緊瓶蓋時水不太會流出來，打開瓶蓋水立刻噴出，是因為：", "explain": "開蓋後空氣進入上方產生壓力，水便在重力與氣壓下流出。", "options": ["打開瓶蓋後上方空氣進去產生壓力", "水變重了", "瓶底的洞變大了", "水被嚇到了"], "ans": 0}, {"subject": "nature", "lesson": "n_air", "type": "choice", "title": "在廚房煮開水時，看到壺嘴上方冒出白煙，而且白煙一直往上飄，這是因為：", "explain": "熱水蒸氣上升帶動周遭氣流向上。", "options": ["熱氣流往上升", "冷氣流往下降", "空氣有重量", "空氣被壓縮"], "ans": 0}, {"subject": "nature", "lesson": "n_air", "type": "choice", "title": "下列哪一個物品裡面「沒有」充滿空氣？", "explain": "裝滿開水的地方已經被水佔據，沒有空氣空間。", "options": ["裝滿開水的玻璃杯", "空鉛筆盒", "空書包", "空的餅乾鐵盒"], "ans": 0}, {"subject": "nature", "lesson": "n_air", "type": "choice", "title": "用洗手乳按壓瓶擠出洗手乳時，鬆開壓頭後壓頭會自己彈回來，主要是依靠內部的彈簧和：", "explain": "大氣壓力與機械彈簧協同運作。", "options": ["氣壓平衡與液體回填", "水變輕了", "馬達轉動", "磁力吸引"], "ans": 0}, {"subject": "nature", "lesson": "n_wind", "type": "tf", "title": "大自然中空氣產生流動，就會形成我們感受到的風。", "explain": "空氣流動即為風。", "ans": "O"}, {"subject": "nature", "lesson": "n_wind", "type": "tf", "title": "操場上的風向袋如果完全垂直下垂動也不動，代表目前處於無風狀態。", "explain": "風力極小或無風時風向袋下垂。", "ans": "O"}, {"subject": "nature", "lesson": "n_wind", "type": "tf", "title": "觀測風向與風力時，應該站在高大建築物密集的狹窄走廊測量最客觀準確。", "explain": "應在空曠平坦無障礙處觀測。", "ans": "X"}, {"subject": "nature", "lesson": "n_wind", "type": "tf", "title": "操場上的風向袋正向著北方水平展開，代表此時吹的是北風。", "explain": "飄向北方代表風從南方吹來，吹的是南風。", "ans": "X"}, {"subject": "nature", "lesson": "n_wind", "type": "tf", "title": "蒲福風級表中，數字級數越大代表風力越強烈。", "explain": "0級無風，級數越高風力越強。", "ans": "O"}, {"subject": "nature", "lesson": "n_wind", "type": "tf", "title": "風箏是靠著迎風面受到氣流向上托起的力量而飛上天空的。", "explain": "迎角受相對氣流托起升空。", "ans": "O"}, {"subject": "nature", "lesson": "n_wind", "type": "tf", "title": "氣象預報中的風向指針，指向哪裡就代表風吹往哪裡。", "explain": "氣象上的風向永遠是指「風吹來的方向」。", "ans": "X"}, {"subject": "nature", "lesson": "n_wind", "type": "tf", "title": "夏天海邊白天吹海風（海吹向陸地），晚上吹陸風（陸地吹向海）。", "explain": "陸地吸熱散熱比海水快，產生晝夜溫差氣壓流動。", "ans": "O"}, {"subject": "nature", "lesson": "n_wind", "type": "tf", "title": "風向袋通常漆成鮮豔的橘白相間顏色，是為了讓觀測者在遠處更容易看清風向與風力。", "explain": "高對比警示色便於目視觀察。", "ans": "O"}, {"subject": "nature", "lesson": "n_wind", "type": "tf", "title": "風向計前端箭頭指的方向，就是風吹過來的方向。", "explain": "箭頭迎著風吹來的方向。", "ans": "O"}, {"subject": "nature", "lesson": "n_wind", "type": "tf", "title": "如果今天吹的是「西北風」，代表地面上的落葉會被風吹向東南方。", "explain": "風從西北吹來，將物品推向對面的東南方。", "ans": "O"}, {"subject": "nature", "lesson": "n_wind", "type": "tf", "title": "在室內吹電風扇時，電風扇吹出來的風不是空氣流動產生的。", "explain": "扇葉轉動推動周遭空氣，流動形成人工風。", "ans": "X"}, {"subject": "nature", "lesson": "n_wind", "type": "tf", "title": "風力太強時（如颱風天），戶外活動容易發生路樹倒塌與招牌掉落危險。", "explain": "強風具有巨大的破壞力。", "ans": "O"}, {"subject": "nature", "lesson": "n_wind", "type": "tf", "title": "風向計的後端尾翼面積通常做得比前端箭頭大很多。", "explain": "大尾翼受風推向順風處，箭頭便指出來風方向。", "ans": "O"}, {"subject": "nature", "lesson": "n_wind", "type": "tf", "title": "使用指北針測量方位時，指北針的指針靜止時會指向正北方。", "explain": "受地磁吸引指針指南北方向。", "ans": "O"}, {"subject": "nature", "lesson": "n_wind", "type": "tf", "title": "微風吹動時，池塘水面會泛起層層漣漪波紋。", "explain": "空氣流動帶動水表層波動。", "ans": "O"}, {"subject": "nature", "lesson": "n_wind", "type": "tf", "title": "冬天台灣北部經常吹寒冷的西南季風。", "explain": "冬季台灣盛行東北季風。", "ans": "X"}, {"subject": "nature", "lesson": "n_wind", "type": "tf", "title": "帆船在大海中航行，只要沒有風也能全速向前衝。", "explain": "傳統帆船完全依靠風力推動船帆前進。", "ans": "X"}, {"subject": "nature", "lesson": "n_wind", "type": "tf", "title": "風力發電是利用風力吹動巨大葉片轉動發電機，屬於乾淨的綠色再生能源。", "explain": "風能轉為電能無碳排放。", "ans": "O"}, {"subject": "nature", "lesson": "n_wind", "type": "tf", "title": "拿紙板對著臉用力搧動，臉上感覺涼涼的，是因為搧動產生了氣流。", "explain": "人為帶動空氣流動形成風。", "ans": "O"}, {"subject": "nature", "lesson": "n_wind", "type": "tf", "title": "樹葉輕微搖動時，在蒲福風級中大約屬於 8 級大風。", "explain": "樹葉微動僅為 1~2 級輕風。", "ans": "X"}, {"subject": "nature", "lesson": "n_wind", "type": "tf", "title": "風向袋被風吹得完全水平筆直展開，代表此時風力相當強勁。", "explain": "風力越強，風向袋被托起得越平直。", "ans": "O"}, {"subject": "nature", "lesson": "n_wind", "type": "tf", "title": "氣象站觀測風向時，通常會搭配風速計精確測量每秒風速。", "explain": "風向計定方向，風速測定速度。", "ans": "O"}, {"subject": "nature", "lesson": "n_wind", "type": "tf", "title": "在山谷中露營，白天和夜晚因為山坡冷熱變化，常會吹谷風與山風。", "explain": "地形溫差形成規律局部風。", "ans": "O"}, {"subject": "nature", "lesson": "n_wind", "type": "tf", "title": "放風箏時如果完全沒有任何風，不管怎麼逆風快跑，風箏都絕對不可能飛起來。", "explain": "人快跑時會創造相對氣流，風箏仍可短暫升空。", "ans": "X"}, {"subject": "nature", "lesson": "n_wind", "type": "choice", "title": "操場上的風向袋正向著「西南方」水平飄展，請問此時吹的是什麼風？", "explain": "風向是風吹來的方向！吹向西南代表風從東北來，為東北風。", "options": ["西南風", "東北風", "西北風", "東南風"], "ans": 1}, {"subject": "nature", "lesson": "n_wind", "type": "choice", "title": "風向計前端的「箭頭」正指向正南方，請問此時吹什麼風？", "explain": "風向計箭頭指的方向就是來風的方向，指南方即為南風。", "options": ["南風", "北風", "東風", "西風"], "ans": 0}, {"subject": "nature", "lesson": "n_wind", "type": "choice", "title": "氣象報告說今天吹「北風」，代表風是從哪裡吹向哪裡？", "explain": "北風就是從北方吹向南方的風。", "options": ["從北向南吹", "從南向北吹", "從東向西吹", "從西向東吹"], "ans": 0}, {"subject": "nature", "lesson": "n_wind", "type": "choice", "title": "下列哪種校園現象代表風力最強？", "explain": "大樹劇晃傘翻代表強風。", "options": ["煙囪的煙垂直上升", "樹葉微動", "國旗輕飄", "大樹劇烈搖晃且雨傘被吹翻"], "ans": 3}, {"subject": "nature", "lesson": "n_wind", "type": "choice", "title": "利用指北針配合風向計時，指北針的指針會指向哪個方位？", "explain": "地磁指北針指針指向北方。", "options": ["東方", "南方", "西方", "北方"], "ans": 3}, {"subject": "nature", "lesson": "n_wind", "type": "choice", "title": "走到戶外放風箏，想要風箏順利升空，放風箏的人應該：", "explain": "逆風跑能增加相對風速，使風箏產生上升力。", "options": ["順著風跑", "逆著風（迎風）跑", "站著不動", "轉圈跑"], "ans": 1}, {"subject": "nature", "lesson": "n_wind", "type": "choice", "title": "下列哪項「不是」利用風力的生活實例？", "explain": "電梯靠馬達與鋼索運作，不靠風力。", "options": ["風力發電風車", "帆船在海面航行", "公園放風箏", "電梯上下移動"], "ans": 3}, {"subject": "nature", "lesson": "n_wind", "type": "choice", "title": "風向計尾翼面積比箭頭大，其力學作用是：", "explain": "大尾翼受風推向順風處，箭頭便指出來風方向。", "options": ["受風吹推到後方，使箭頭迎向來風", "美觀好看", "讓風向計轉更快", "增加重量"], "ans": 0}, {"subject": "nature", "lesson": "n_wind", "type": "choice", "title": "在操場自製簡易風向觀測工具，何者最靈敏實用？", "explain": "重量輕且受風面積大的紙條最容易隨風飄動。", "options": ["細長輕薄彩帶紙條", "大石頭", "厚鐵尺", "厚字典"], "ans": 0}, {"subject": "nature", "lesson": "n_wind", "type": "choice", "title": "看見學校國旗飄向「西北方」，此時地面吹的風向是：", "explain": "國旗被吹向西北，代表風是從對面的「東南方」吹來的，為東南風。", "options": ["西北風", "東南風", "東北風", "西南風"], "ans": 1}, {"subject": "nature", "lesson": "n_wind", "type": "choice", "title": "颱風來襲時路樹被連根拔起、招牌吹落，這大約相當於幾級以上的風力？", "explain": "10級以上強風能吹倒樹木、毀壞房屋。", "options": ["2級", "5級", "10級以上", "0級"], "ans": 2}, {"subject": "nature", "lesson": "n_wind", "type": "choice", "title": "冬季台灣各地常感受到的季節風主要是：", "explain": "冬季大陸冷高壓南下，台灣盛行東北季風。", "options": ["東北季風", "西南季風", "東南季風", "正南季風"], "ans": 0}, {"subject": "nature", "lesson": "n_wind", "type": "choice", "title": "如果看見炊煙垂直向上升起，幾乎沒有傾斜，代表當時風力約為：", "explain": "0級無風時煙直上。", "options": ["0級（無風）", "3級（微風）", "6級（強風）", "10級（暴風）"], "ans": 0}, {"subject": "nature", "lesson": "n_wind", "type": "choice", "title": "下列何處「最不適合」設置風力發電廠？", "explain": "都會區大樓阻擋風勢且有噪音干擾。", "options": ["風力強勁的濱海地區", "開闊平坦的沿海空地", "高樓大廈密集的市中心住宅區", "風勢穩定的空曠山脊"], "ans": 2}, {"subject": "nature", "lesson": "n_wind", "type": "choice", "title": "觀測風向時，拿著紙條高舉，發現紙條飄向「東方」，吹的是什麼風？", "explain": "紙條飄向東，風是從西方吹來的，故為西風。", "options": ["東風", "西風", "南風", "北風"], "ans": 1}, {"subject": "nature", "lesson": "n_wind", "type": "choice", "title": "大自然中產生風的主要根本原因是：", "explain": "日照不均產生溫差與氣壓差，引發空氣對流。", "options": ["太陽照射使各地受熱不均，冷熱空氣流動", "地球自轉把水攪動", "植物吐出大量氧氣", "海浪拍打岸邊"], "ans": 0}, {"subject": "nature", "lesson": "n_wind", "type": "choice", "title": "騎腳踏車逆風前進時，會感到：", "explain": "迎面而來的強風會產生空氣阻力。", "options": ["非常輕鬆省力", "阻力很大比較費力", "速度自動變快", "完全沒感覺"], "ans": 1}, {"subject": "nature", "lesson": "n_wind", "type": "choice", "title": "下列哪一種工具是專門用來測量「風吹的速度快慢」的？", "explain": "風速計專門測量風速。", "options": ["風向袋", "風速計", "溫度計", "雨量筒"], "ans": 1}, {"subject": "nature", "lesson": "n_wind", "type": "choice", "title": "風向袋通常設置在機場或港口，主要目的是提供什麼即時資訊？", "explain": "提供飛機起降與船隻進出港時的風向風力參考。", "options": ["氣溫與濕度", "風向與風力強弱", "飛機航班時間", "海浪高度"], "ans": 1}, {"subject": "nature", "lesson": "n_wind", "type": "choice", "title": "夏天在操場運動，突然吹來一陣涼風，感覺舒服，這時風力大約是：", "explain": "吹在臉上微涼舒服為輕微風級。", "options": ["1~2級輕風微風", "7~8級大風", "12級狂風", "0級無風"], "ans": 0}, {"subject": "nature", "lesson": "n_wind", "type": "choice", "title": "下列哪一種現象表示「風力比微風更強」？", "explain": "樹枝搖晃、紙片吹起代表風力達到4級和風等級。", "options": ["炊煙輕微晃動", "樹葉飄落", "樹枝整枝搖晃且灰塵紙片飛揚", "水面平靜如鏡"], "ans": 2}, {"subject": "nature", "lesson": "n_wind", "type": "choice", "title": "如果風向計的箭頭指向「東北方」，此時國旗會飄向哪一方？", "explain": "吹東北風，旗幟順著風吹往相反的西南方。", "options": ["東北方", "西南方", "東南方", "西北方"], "ans": 1}, {"subject": "nature", "lesson": "n_wind", "type": "choice", "title": "古時候鄭和下西洋或是哥倫布航海，主要依靠大洋上的什麼前進？", "explain": "古代航海全憑季風與行星風系揚帆。", "options": ["定期盛行的信風季風", "船底的水流推動", "船長施展法術", "蒸汽機推動"], "ans": 0}, {"subject": "nature", "lesson": "n_wind", "type": "choice", "title": "下列關於「風」的敘述何者正確？", "explain": "風向是指風吹來的出發方向。", "options": ["眼睛可以直接看見風的顏色", "風是完全靜止不動的空氣", "風的流動方向就是風向定義的起點", "風不會受到建築物阻擋"], "ans": 2}, {"subject": "nature", "lesson": "n_wind", "type": "choice", "title": "在校園操場做風向實驗，全班測量結果最可能一致的前提是：", "explain": "同時間空曠地點能確保數據客觀準確。", "options": ["在同一時間、同一個空曠開闊地點觀測", "每個人躲在不同教室走廊", "閉上眼睛用手摸泥土", "看教室黑板"], "ans": 0}, {"subject": "nature", "lesson": "n_powder", "type": "tf", "title": "在科學實驗室中，絕對不可以隨意用舌頭舔嚐未知的白色粉末。", "explain": "實驗室安全第一守則：嚴禁以口嚐藥品。", "ans": "O"}, {"subject": "nature", "lesson": "n_powder", "type": "tf", "title": "太白粉加進冷水攪拌均勻後，會形成完全清澈透明的溶液且永不沉澱。", "explain": "太白粉不溶於冷水，呈白濁狀，靜置會沉澱。", "ans": "X"}, {"subject": "nature", "lesson": "n_powder", "type": "tf", "title": "食鹽加入白醋中，會像小蘇打粉一樣劇烈冒出大量二氧化碳氣泡。", "explain": "食鹽與醋不會劇烈產生氣體。", "ans": "X"}, {"subject": "nature", "lesson": "n_powder", "type": "tf", "title": "棕褐色的碘液遇到太白粉時，會立刻產生深藍紫色的顏色變化。", "explain": "澱粉遇碘產生深藍紫色特徵反應。", "ans": "O"}, {"subject": "nature", "lesson": "n_powder", "type": "tf", "title": "白糖加入水裡完全攪拌後，整杯水會維持清澈透明無色。", "explain": "糖完全溶解於水形成真溶液。", "ans": "O"}, {"subject": "nature", "lesson": "n_powder", "type": "tf", "title": "手指摸摸看粗鹽結晶，摸起來有明顯硬硬粗粗的顆粒感。", "explain": "粗鹽為顆粒結晶體。", "ans": "O"}, {"subject": "nature", "lesson": "n_powder", "type": "tf", "title": "做鬆餅蛋糕時加入小蘇打粉，加熱後會產生二氧化碳使糕點蓬鬆柔軟。", "explain": "小蘇打遇熱分解產生二氧化碳氣孔。", "ans": "O"}, {"subject": "nature", "lesson": "n_powder", "type": "tf", "title": "太白粉通常是從馬鈴薯或樹薯等植物中提煉出來的澱粉。", "explain": "太白粉屬於食用澱粉類。", "ans": "O"}, {"subject": "nature", "lesson": "n_powder", "type": "tf", "title": "用手直接大把抓取化學藥品是標準且安全的實驗操作動作。", "explain": "應使用藥匙或量匙取用藥品，避免腐蝕或污染。", "ans": "X"}, {"subject": "nature", "lesson": "n_powder", "type": "tf", "title": "觀察粉末氣味時，應該把鼻子湊近瓶口用力深吸一口氣。", "explain": "應使用搧氣入鼻法輕輕聞。", "ans": "X"}, {"subject": "nature", "lesson": "n_powder", "type": "tf", "title": "食鹽水溶液是弱酸性，滴在舌頭上感覺酸酸的。", "explain": "食鹽水為中性，味道是鹹的。", "ans": "X"}, {"subject": "nature", "lesson": "n_powder", "type": "tf", "title": "麵粉也是一種含有豐富澱粉的粉末，滴上碘液也會變成深藍紫色。", "explain": "麵粉含豐富澱粉遇碘變深藍紫。", "ans": "O"}, {"subject": "nature", "lesson": "n_powder", "type": "tf", "title": "白糖與食鹽外觀非常相似，放在放大鏡下觀察，食鹽結晶多呈現立方體形狀。", "explain": "食鹽（氯化鈉）晶體為標準立方晶系。", "ans": "O"}, {"subject": "nature", "lesson": "n_powder", "type": "tf", "title": "小蘇打粉加水後，可以用來清洗廚房抽油煙機上的油垢，具有清潔效果。", "explain": "弱鹼性小蘇打能乳化油脂助清潔。", "ans": "O"}, {"subject": "nature", "lesson": "n_powder", "type": "tf", "title": "所有的白色調味粉末加進水裡，攪拌後都一定能完全溶解消失。", "explain": "太白粉、麵粉、滑石粉等皆不溶於水。", "ans": "X"}, {"subject": "nature", "lesson": "n_powder", "type": "tf", "title": "碘液原本的顏色是深綠色的液體。", "explain": "碘液為棕褐色或黃褐色。", "ans": "X"}, {"subject": "nature", "lesson": "n_powder", "type": "tf", "title": "白糖滴入碘液之後，也會變成深藍紫色。", "explain": "糖類不是澱粉，遇碘液不變藍紫色。", "ans": "X"}, {"subject": "nature", "lesson": "n_powder", "type": "tf", "title": "小蘇打粉遇到酸性液體（如檸檬汁、白醋）會產生劇烈氣泡反應。", "explain": "酸鹼中和產生碳酸釋放二氧化碳氣體。", "ans": "O"}, {"subject": "nature", "lesson": "n_powder", "type": "tf", "title": "用手摸太白粉時，會感覺非常滑順細膩，像摸滑石粉一樣。", "explain": "太白粉粉末顆粒極細滑。", "ans": "O"}, {"subject": "nature", "lesson": "n_powder", "type": "tf", "title": "把食鹽加熱炒過之後，食鹽會融化變成甜甜的麥芽糖。", "explain": "食鹽熔點高達800℃以上，乾炒不變糖。", "ans": "X"}, {"subject": "nature", "lesson": "n_powder", "type": "tf", "title": "在廚房裡，如果白糖罐與食鹽罐標籤掉了，在安全衛生的廚房可以透過嚐味道來分辨。", "explain": "廚房確定為食品級調味料可嚐，實驗室則嚴禁。", "ans": "O"}, {"subject": "nature", "lesson": "n_powder", "type": "tf", "title": "太白粉加水勾芡煮湯時，加熱後會變黏稠透明，這叫澱粉糊化現象。", "explain": "澱粉加熱吸水膨脹糊化變稠。", "ans": "O"}, {"subject": "nature", "lesson": "n_powder", "type": "tf", "title": "食鹽在常溫下完全燃燒會散發濃烈爆米花香味。", "explain": "食鹽不可燃。", "ans": "X"}, {"subject": "nature", "lesson": "n_powder", "type": "tf", "title": "小蘇打粉加白醋冒出的氣體是氧氣，把點燃的線香放進去會燃燒得更劇烈。", "explain": "產生的是二氧化碳，二氧化碳不助燃，會使線香熄滅。", "ans": "X"}, {"subject": "nature", "lesson": "n_powder", "type": "tf", "title": "利用碘液反應可以檢驗食物中是否含有澱粉成分。", "explain": "碘液檢驗法是生物化學標準澱粉鑑定法。", "ans": "O"}, {"subject": "nature", "lesson": "n_powder", "type": "choice", "title": "廚房四種白色粉末：白糖、食鹽、太白粉、小蘇打。滴入棕褐色碘液後，哪種會變深藍紫色？", "explain": "太白粉含澱粉，遇碘呈藍紫色反應。", "options": ["食鹽", "白糖", "太白粉", "小蘇打"], "ans": 2}, {"subject": "nature", "lesson": "n_powder", "type": "choice", "title": "小蘇打粉加入白醋後會劇烈冒泡，冒出的氣體是：", "explain": "酸鹼反應釋放二氧化碳氣體。", "options": ["氧氣", "二氧化碳", "水蒸氣", "氫氣"], "ans": 1}, {"subject": "nature", "lesson": "n_powder", "type": "choice", "title": "手指觸摸下列白色粉末，何者顆粒感最明顯、最粗硬？", "explain": "粗鹽為顆粒結晶，觸感粗糙硬實。", "options": ["粗鹽結晶", "太白粉", "麵粉", "奶粉"], "ans": 0}, {"subject": "nature", "lesson": "n_powder", "type": "choice", "title": "想辨別杯中白色粉末是小蘇打還是太白粉，滴入哪種液體最適合快速判別？", "explain": "太白粉遇碘變藍紫，小蘇打遇醋劇烈冒泡。", "options": ["白醋或碘液", "沙拉油", "純酒精", "醬油"], "ans": 0}, {"subject": "nature", "lesson": "n_powder", "type": "choice", "title": "實驗室中聞未知氣味的正確安全操作方式是：", "explain": "搧氣入鼻法是標準安全操作。", "options": ["鼻子湊近深吸", "用手在容器上方輕輕搧聞", "大口吸氣", "用吸管吸入"], "ans": 1}, {"subject": "nature", "lesson": "n_powder", "type": "choice", "title": "做鬆餅蛋糕加入小蘇打粉的主要目的是：", "explain": "受熱產生二氧化碳氣孔讓口感鬆軟。", "options": ["產生二氧化碳使糕點蓬鬆柔軟", "增加甜味", "防發霉", "染成雪白"], "ans": 0}, {"subject": "nature", "lesson": "n_powder", "type": "choice", "title": "下列哪一種粉末摸起來最滑膩細柔？", "explain": "太白粉為極細澱粉顆粒，觸感極滑。", "options": ["粗鹽", "太白粉", "冰糖粒", "晶冰糖"], "ans": 1}, {"subject": "nature", "lesson": "n_powder", "type": "choice", "title": "白糖加水完全溶解後，整杯水呈現：", "explain": "糖完全溶解形成透明水溶液。", "options": ["混濁白色", "透明無色清澈", "淡藍色", "結凍硬化"], "ans": 1}, {"subject": "nature", "lesson": "n_powder", "type": "choice", "title": "下列哪一種調味粉末加白醋「會」產生大量冒泡反應？", "explain": "小蘇打遇酸反應產生二氧化碳。", "options": ["食鹽", "白糖", "小蘇打粉", "麵粉"], "ans": 2}, {"subject": "nature", "lesson": "n_powder", "type": "choice", "title": "在熟米飯、白吐司上滴加棕褐色碘液，顏色會：", "explain": "米飯吐司皆富含澱粉，遇碘呈藍紫色。", "options": ["變深藍紫色", "變亮黃色", "完全沒變色", "變綠色"], "ans": 0}, {"subject": "nature", "lesson": "n_powder", "type": "choice", "title": "太白粉倒入冷水中攪拌後靜置十分鐘，杯底會出現：", "explain": "太白粉不溶於冷水，靜置會沉澱於底。", "options": ["白色沉澱物", "氣泡全部浮出", "金黃色結晶", "冰塊"], "ans": 0}, {"subject": "nature", "lesson": "n_powder", "type": "choice", "title": "將小蘇打加醋產生的氣體導入澄清石灰水中，澄清石灰水會：", "explain": "二氧化碳與石灰水反應生成碳酸鈣白色沉澱。", "options": ["變成白濁色", "變成鮮紅色", "完全透明不變", "結成冰塊"], "ans": 0}, {"subject": "nature", "lesson": "n_powder", "type": "choice", "title": "下列哪一種食材滴入碘液「不會」變成深藍紫色？", "explain": "肥肉主要成分是油脂，不含澱粉。", "options": ["白蘿蔔片", "馬鈴薯片", "肥豬肉片", "煮熟的麵條"], "ans": 2}, {"subject": "nature", "lesson": "n_powder", "type": "choice", "title": "利用放大鏡觀察食鹽，會發現它的顆粒形狀大多是：", "explain": "食鹽為立方體結晶。", "options": ["細長針狀", "扁平圓形", "立方體結晶", "五角星形"], "ans": 2}, {"subject": "nature", "lesson": "n_powder", "type": "choice", "title": "料理煮酸辣湯時想讓湯汁變得濃稠滑順，通常會加入哪種粉調水勾芡？", "explain": "太白粉水加熱糊化具有增稠勾芡效果。", "options": ["太白粉水", "食鹽水", "小蘇打水", "砂糖水"], "ans": 0}, {"subject": "nature", "lesson": "n_powder", "type": "choice", "title": "烘焙麵包時，為了讓麵糰發酵膨脹，除了小蘇打有時還會加入：", "explain": "酵母菌發酵產生二氧化碳使麵糰膨起。", "options": ["酵母菌", "粗鹽", "醬油", "太白粉"], "ans": 0}, {"subject": "nature", "lesson": "n_powder", "type": "choice", "title": "小蘇打加白醋產生的氣體，拿燃燒的線香靠近檢驗，線香會：", "explain": "二氧化碳不助燃亦不可燃，使火焰熄滅。", "options": ["燃燒得更旺盛", "立刻熄滅", "發出藍色火花", "爆炸"], "ans": 1}, {"subject": "nature", "lesson": "n_powder", "type": "choice", "title": "下列何者是食鹽在生活中的主要用途？", "explain": "食鹽是重要調味料且能高滲透壓抑菌防腐。", "options": ["調味增鮮與醃製防腐", "當作洗髮精", "製造氣球", "當水泥蓋房子"], "ans": 0}, {"subject": "nature", "lesson": "n_powder", "type": "choice", "title": "取用粉末藥品時，下列何種工具最適當？", "explain": "乾淨乾燥藥匙避免污染或受潮。", "options": ["乾淨乾燥的小藥匙", "剛洗過濕漉漉的雙手", "鉛筆筆尖", "橡皮擦"], "ans": 0}, {"subject": "nature", "lesson": "n_powder", "type": "choice", "title": "小蘇打水溶液用紅色石蕊試紙測試，試紙會變成：", "explain": "小蘇打呈弱鹼性，使紅試紙變藍。", "options": ["藍色（弱鹼性）", "紅色（強酸性）", "綠色", "黑色"], "ans": 0}, {"subject": "nature", "lesson": "n_powder", "type": "choice", "title": "白糖加水溶解後，如果喝一小口，味道是：", "explain": "白糖溶解後具蔗糖特有甜味。", "options": ["甜甜的", "鹹鹹的", "酸酸的", "苦澀的"], "ans": 0}, {"subject": "nature", "lesson": "n_powder", "type": "choice", "title": "如果不小心把大量食鹽灑到地板上，最衛生的處理方法是：", "explain": "掉地上受污染食品應丟棄不可再食用。", "options": ["用掃把掃起丟進垃圾桶", "抓起來放回鹽罐煮湯", "用水沖進客廳地毯", "用吹風機吹跑"], "ans": 0}, {"subject": "nature", "lesson": "n_powder", "type": "choice", "title": "下列哪一種調味料在高溫加熱乾燒時，最容易燒焦發黑並發出焦糖香？", "explain": "糖受熱脫水焦糖化變黑。", "options": ["砂糖", "食鹽", "小蘇打", "太白粉"], "ans": 0}, {"subject": "nature", "lesson": "n_powder", "type": "choice", "title": "為了防止廚房裡的調味粉受潮結塊，保存時應該放在：", "explain": "密封防潮保持乾燥是最佳保存法。", "options": ["陰涼乾燥密封處", "水龍頭正下方", "大太陽下曝曬", "冰箱冷凍庫敞開"], "ans": 0}, {"subject": "nature", "lesson": "n_powder", "type": "choice", "title": "在「粉末溶解與辨識」實驗結束後，桌面上的殘留藥品與廢液應該：", "explain": "妥善清理與廢液分類是良好實驗習慣。", "options": ["依老師指示分類倒入廢液桶，並清洗乾淨收拾", "全部抹在隔壁同學衣服上", "偷偷倒在書包裡", "不用管它直接下課"], "ans": 0}, {"subject": "nature", "lesson": "n_dissolve", "type": "tf", "title": "固定量的水中，食鹽可以無限量地完全溶化不見。", "explain": "固定水量的溶解量有上限，達飽和即不再溶解。", "ans": "X"}, {"subject": "nature", "lesson": "n_dissolve", "type": "tf", "title": "把冰糖敲碎能加快溶解速度，是因為顆粒變小，與水接觸的表面積變大了。", "explain": "接觸面積越大，溶解擴散速度越快。", "ans": "O"}, {"subject": "nature", "lesson": "n_dissolve", "type": "tf", "title": "飽和食鹽水放在平盤上曬乾，水分蒸發後，原本溶在水裡的食鹽結晶會重新出現。", "explain": "水分蒸發後溶質結晶析出。", "ans": "O"}, {"subject": "nature", "lesson": "n_dissolve", "type": "tf", "title": "把沙子倒進水裡用力攪拌，靜置後沙子沉在杯底，這算是沙子溶解在水中。", "explain": "混濁沉澱非溶解，溶解需均勻透明且不沉澱。", "ans": "X"}, {"subject": "nature", "lesson": "n_dissolve", "type": "tf", "title": "大部分固體溶質在水溫升高時，能溶解的總量通常會增加。", "explain": "多數固體在熱水中的溶解度大於冷水。", "ans": "O"}, {"subject": "nature", "lesson": "n_dissolve", "type": "tf", "title": "完全溶解的食鹽水，如果放在密閉瓶中放三天，食鹽會自己慢慢沉澱回瓶底。", "explain": "真溶液在密閉或水未蒸發時極為穩定，不會自行沉澱。", "ans": "X"}, {"subject": "nature", "lesson": "n_dissolve", "type": "tf", "title": "「溶解」是指溶質顆粒均勻分散在溶劑中，肉眼看不到顆粒且清澈透明。", "explain": "此為科學上溶解之標準定義。", "ans": "O"}, {"subject": "nature", "lesson": "n_dissolve", "type": "tf", "title": "將 5g 食鹽溶於 100g 水中，食鹽水總重量剛好是 105g，符合質量守恆。", "explain": "溶質重 + 溶劑重 = 溶液總重。", "ans": "O"}, {"subject": "nature", "lesson": "n_dissolve", "type": "tf", "title": "在進行溶解快慢對比實驗時，只能有一個條件不一樣，其餘條件必須完全相同。", "explain": "控制變因科學方法的核心原則。", "ans": "O"}, {"subject": "nature", "lesson": "n_dissolve", "type": "tf", "title": "用熱水泡奶粉通常比用冰水泡奶粉溶解得更快且更不易結塊。", "explain": "溫度高分子運動劇烈加速溶解。", "ans": "O"}, {"subject": "nature", "lesson": "n_dissolve", "type": "tf", "title": "杯底已經出現沉澱鹽粒的飽和食鹽水，只要再加水攪拌，沉澱的鹽就可以繼續溶解。", "explain": "增加溶劑量能提高可容納溶質量。", "ans": "O"}, {"subject": "nature", "lesson": "n_dissolve", "type": "tf", "title": "攪拌只能加快溶解速度，不能改變該溫度下這杯水能溶解的最大總量。", "explain": "攪拌只改變速率，不改變飽和溶解度。", "ans": "O"}, {"subject": "nature", "lesson": "n_dissolve", "type": "tf", "title": "把糖倒入水中不攪拌，糖就永遠絕對不可能在水中溶解。", "explain": "分子自然擴散仍會慢慢溶解，只是速度極慢。", "ans": "X"}, {"subject": "nature", "lesson": "n_dissolve", "type": "tf", "title": "在比較不同水溫溶解量的實驗中，水量的多寡屬於必須嚴格相同的「控制變因」。", "explain": "水量必須維持一致才能公平比較。", "ans": "O"}, {"subject": "nature", "lesson": "n_dissolve", "type": "tf", "title": "飽和食鹽水喝起來的鹹度，已經達到該水溫下的最鹹極限濃度。", "explain": "達到最大飽和濃度。", "ans": "O"}, {"subject": "nature", "lesson": "n_dissolve", "type": "tf", "title": "不管加多少水，一顆大冰糖都絕對不可能在水中完全溶化。", "explain": "只要水量足夠，大冰糖也能完全溶解。", "ans": "X"}, {"subject": "nature", "lesson": "n_dissolve", "type": "tf", "title": "用量匙取鹽做比較實驗時，每匙都必須用刮板刮平（平匙），確保每次加入量相同。", "explain": "維持添加份量一致的標準操作。", "ans": "O"}, {"subject": "nature", "lesson": "n_dissolve", "type": "tf", "title": "喝熱咖啡加方糖，拿湯匙攪拌可以讓方糖更快溶化消失。", "explain": "攪拌帶動液體對流加速溶解。", "ans": "O"}, {"subject": "nature", "lesson": "n_dissolve", "type": "tf", "title": "海水之所以鹹鹹的，是因為海水中溶解了大量的食鹽等礦物質鹽類。", "explain": "天然海水為多種鹽類之水溶液。", "ans": "O"}, {"subject": "nature", "lesson": "n_dissolve", "type": "tf", "title": "把飽和糖水放進冰箱冷卻，原本溶在裡面的糖可能會因為 , "ans": 0}, {"subject": "chinese", "lesson": "c_l8", "type": "choice", "title": "「寄居蟹在粗糙的沙石上『艱難』前進。」句中「艱難」的意思是：", "explain": "「艱難」指處境困苦、克服阻礙十分費力。", "options": ["困難費力", "輕鬆簡單", "速度飛快", "滑稽搞笑"], "ans": 0}, {"subject": "chinese", "lesson": "c_l8", "type": "choice", "title": "「蟹」字的下半部分是哪一個部首？", "explain": "「蟹」字為虫部，解＋虫。", "options": ["虫部", "魚部", "角部", "刀部"], "ans": 0}, {"subject": "chinese", "lesson": "c_l8", "type": "choice", "title": "寄居蟹長大之後身體變大，為什麼必須定期換殼？", "explain": "寄居蟹的螺殼不是自己長出來的，長大後腹部空間不足必須更換更大的螺殼。", "options": ["因為牠原本的外殼不會跟著長大，需要更大的殼保護柔軟腹部", "因為牠喜歡換新衣服炫耀", "因為舊殼顏色變淡了", "為了躲避寒冬冬眠"], "ans": 0}, {"subject": "chinese", "lesson": "c_l8", "type": "choice", "title": "到海邊旅遊時，哪一種行為符合生態保育的原則？", "explain": "守護生態核心守則：留下足跡，帶走垃圾，將貝殼留給寄居蟹。", "options": ["把撿到的貝殼留在沙灘上，不隨便帶走", "把活寄居蟹裝進塑膠桶帶回家養", "把吃完的飲料杯丟在沙灘上", "把沙灘上的石頭全部扔進海裡"], "ans": 0}, {"subject": "chinese", "lesson": "c_l8", "type": "choice", "title": "「媽媽細心『挑選』新鮮的蔬菜。」句中「挑選」的意思是：", "explain": "「挑選」指根據標準從群體中挑出最合適的。", "options": ["從眾多物品中挑出合適的", "把東西全部扔掉", "閉上眼睛隨便拿", "把菜葉切碎"], "ans": 0}, {"subject": "chinese", "lesson": "c_l8", "type": "choice", "title": "請找出句子中的錯別字：「這隻小螃蟹在海邊『尋找倒』了一個好藏身處。」", "explain": "達到尋找目的應用「到」，而非跌倒之「倒」。", "options": ["「倒」應改為「到」", "「蟹」應改為「謝」", "「海」應改為「每」", "「處」應改為「外」"], "ans": 0}, {"subject": "chinese", "lesson": "c_l8", "type": "choice", "title": "「這座岩石的質地非常『堅硬』。」「堅硬」的相反詞是：", "explain": "堅硬（質地硬實）與柔軟相反。", "options": ["柔軟", "結實", "粗壯", "光滑"], "ans": 0}, {"subject": "chinese", "lesson": "c_l8", "type": "choice", "title": "下列何者的字音與「宿(ㄙㄨˋ)舍」之「宿」相同？", "explain": "借宿、住宿讀作ㄙㄨˋ。", "options": ["借宿(ㄙㄨˋ)", "星宿(ㄒㄧㄡˋ)", "住一宿(ㄒㄧㄡˇ)", "宿(ㄒㄧㄡˇ)夜"], "ans": 0}, {"subject": "chinese", "lesson": "c_l8", "type": "tf", "title": "課文《寄居蟹找新家》提醒我們重視海洋環境教育，不亂丟垃圾並珍惜自然資源。", "explain": "文章富含深刻的生態同理心與環境保育省思。", "ans": "O"}, {"subject": "chinese", "lesson": "c_l8", "type": "tf", "title": "寄居蟹身上的殼是自己身體分泌鈣質慢慢長大的，跟外面的蝸牛殼一模一樣。", "explain": "寄居蟹本身不會長出外硬螺殼，牠是寄居在海螺死後留下的空殼裡。", "ans": "X"}, {"subject": "chinese", "lesson": "c_l8", "type": "tf", "ti n": "連續垂直對折兩次所形成的夾角是標準的直角。", "options": ["直角", "銳角", "鈍角", "平角"], "ans": 0}, {"subject": "math", "lesson": "m_angle", "type": "choice", "title": "剪刀在慢慢合攏（關起來）的過程中，兩片刀刃所夾的角度會：", "explain": "合攏代表兩邊距離變窄，角度隨之縮小。", "options": ["越來越小", "越來越大", "保持不變", "突然變成鈍角"], "ans": 0}, {"subject": "math", "lesson": "m_angle", "type": "choice", "title": "剪刀在慢慢張開（打開）的過程中，兩片刀刃所夾的角度會：", "explain": "張開幅度變寬，角度隨之變大。", "options": ["越來越大", "越來越小", "保持不變", "消失不見"], "ans": 0}, {"subject": "math", "lesson": "m_angle", "type": "choice", "title": "下列哪一個大寫英文字母中，含有標準的「直角」？", "explain": "字母 L 的轉折處是標準的垂直 90 度直角。", "options": ["L", "V", "O", "C"], "ans": 0}, {"subject": "math", "lesson": "m_angle", "type": "choice", "title": "下列哪一個大寫英文字母中，轉角處夾的是「銳角」？", "explain": "字母 V 兩斜線夾角小於 90 度，為銳角。", "options": ["V", "L", "H", "E"], "ans": 0}, {"subject": "math", "lesson": "m_angle", "type": "tf", "title": "拿放大鏡看一個 45 度的角，透過放大鏡看，這個角會變成 90 度的直角。", "explain": "放大鏡只放大圖案線條粗細與長度，兩邊張開的角度大小絕對不會改變！", "ans": "X"}, {"subject": "math", "lesson": "m_angle", "type": "tf", "title": "三角形的三個角裡面，最多只能有 1 個直角。", "explain": "三角形內角和固定，如果有 2 個直角線條將平行無法封閉形成三角形。", "ans": "O"}, {"subject": "math", "lesson": "m_angle", "type": "tf", "title": "正方形的四個角都是直角，長方形的四個角也都是直角。", "explain": "長方形與正方形的定義即為四個角皆為直角的四邊形。", "ans": "O"}, {"subject": "math", "lesson": "m_angle", "type": "tf", "title": "鈍角比直角大，銳角比直角小。", "explain": "銳角 < 直角(90度) < 鈍角。", "ans": "O"}, {"subject": "math", "lesson": "m_angle", "type": "tf", "title": "時針在 6 點整時，時針與分針形成一條直線，這稱為平角（不是直角）。", "explain": "6 點整兩針成一直線（180度），不是 90 度直角。", "ans": "O"}, {"subject": "math", "lesson": "m_area", "type": "choice", "title": "邊長 1 公分（cm）的正方形，它的面積是多少？", "explain": "面積基本標準定義：邊長 1 cm 的正方形面積為 1 平方公分（1 cm²）。", "options": ["1 平方公分（cm²）", "1 公分（cm）", "4 平方公分", "2 平方公分"], "ans": 0}, {"subject": "math", "lesson": "m_area", "type": "choice", "title": "一個圖形是由 12 個邊長 1 公分的小正方形方格鋪滿拼成的，它的面積是多少？", "explain": "每個方格是 1 cm²，12 個方格就是 12 cm²。注意單位是平方公分！", "options": ["12 平方公分", "6 平方公分", "24 平方公分", "12 公分"], "ans": 0}, {"subject": "math", "lesson": "m_area", "type": "choice", "title": "甲圖形用了 15 個 1 平方公分方格鋪滿，乙圖形用了 18 個 1 平方公分方格鋪滿，哪一個圖形面積較大？", "explain": "18 平方公分 > 15 平方公分，乙圖形面積大。", "options": ["乙圖形比較大", "甲圖形比較大", "兩個一樣大", "無法比較"], "ans": 0}, {"subject": "math", "lesson": "m_area", "type": "choice", "title": "一個長方形長邊排了 5 個 1 平方公分方格，寬邊排了 4 個，一共排滿幾格？面積是多少？", "explain": "5 × 4 = 20 格，每格 1 平方公分，總面積為 20 平方公分。", "options": ["共 20 格，面積是 20 平方公分", "共 9 格，面積是 9 平方公分", "共 18 格，面積是 18 平方公分", "共 20 格，面積是 20 公分"], "ans": 0}, {"subject": "math", "lesson": "m_area", "type": "choice", "title": "將一張面積 24 平方公分的色紙剪成三塊碎紙片，再重新拼成一艘小船，拼成的小船面積是多少？", "explain": "面積守恆定律：平面圖形經切割重組，只要沒有重疊或丟棄，總面積保持不變。", "options": ["24 平方公分（面積守恆不變）", "12 平方公分", "48 平方公分", "變小了"], "ans": 0}, {"subject": "math", "lesson": "m_area", "type": "choice", "title": "測量「數學課本封面」或「悠遊卡表面」的大小，最適當的單位是：", "explain": "測量物體表面面積使用面積單位「平方公分」。", "options": ["平方公分（cm²）", "毫米（mm）", "公升（L）", "公克（g）"], "ans": 0}, {"subject": "math", "lesson": "m_area", "type": "choice", "title": "下列關於「周長」與「面積」的區別，何者敘述完全正確？", "explain": "周長是長度概念（cm），面積是平面覆蓋大小概念（cm²）。", "options": ["周長是外圍一圈的長度（公分），面積是平面鋪滿的大小（平方公分）", "周長和面積完全是一樣的概念", "周長用平方公分表示，面積用公分表示", "面積越大，周長一定越長"], "ans": 0}, {"subject": "math", "lesson": "m_area", "type": "choice", "title": "邊長 2 公分正方形內部，剛好可以平整切成幾個邊長 1 公分的小正方形？面積是多少？", "explain": "2 × 2 = 4 個 1 平方公分正方形，總面積為 4 平方公分。", "options": ["切成 4 個，面積是 4 平方公分", "切成 2 個，面積是 2 平方公分", "切成 8 個，面積是 8 平方公分", "切成 1 個，面積是 1 平方公分"], "ans": 0}, {"subject": "math", "lesson": "m_area", "type": "choice", "title": "兩個形狀長得完全不一樣的圖形，它們的面積有沒有可能一樣大？", "explain": "例如一個是 2×6=12 格，另一個是 3×4=12 格，形狀不同但面積相同。", "options": ["有可能，只要鋪滿的小正方形格子數量相同即可", "不可能，形狀不同面積絕對不可能一樣", "只有正方形才能算面積", "只有長方形才能算面積"], "ans": 0}, {"subject": "math", "lesson": "m_area", "type": "choice", "title": "把兩個 4 平方公分的三角形拼合在一起，拼成的新多邊形面積是多少？", "explain": "4 + 4 = 8 平方公分。", "options": ["8 平方公分", "4 平方公分", "16 平方公分", "2 平方公分"], "ans": 0}, {"subject": "math", "lesson": "m_area", "type": "choice", "title": "在方格紙上，一個圖形包含 8 個完整的 1 平方公分方格，和 4 個半格（半格為 0.5 平方公分），這個圖形總面積是多少？", "explain": "8 個整格 = 8 cm²；4 個半格 = 2 cm²；8 + 2 = 10 平方公分。", "options": ["10 平方公分", "8 平方公分", "12 平方公分", "9 平方公分"], "ans": 0}, {"subject": "math", "lesson": "m_area", "type": "choice", "title": "長方形 A 面積是 16 平方公分，正方形 B 面積也是 16 平方公分，兩者的面積相比：", "explain": "兩者數值都是 16 cm²，面積完全一樣大。", "options": ["一樣大", "長方形 A 比較大", "正方形 B 比較大", "無法比較"], "ans": 0}, {"subject": "math", "lesson": "m_area", "type": "choice", "title": "用 1 平方公分的小方塊排長方形，長排 6 塊，寬排 3 塊，面積是多少？", "explain": "6 × 3 = 18 平方公分。", "options": ["18 平方公分", "9 平方公分", "12 平方公分", "36 平方公分"], "ans": 0}, {"subject": "math", "lesson": "m_area", "type": "choice", "title": "下列何者的面積最小？", "explain": "3 平方公分是選項中最小的數值。", "options": ["3 個 1 平方公分的方格", "7 個 1 平方公分的方格", "10 個 1 平方公分的方格", "5 個 1 平方公分的方格"], "ans": 0}, {"subject": "math", "lesson": "m_area", "type": "choice", "title": "將一張長方形色紙沿對角線剪成兩個完全一樣的三角形，每個三角形的面積是原本長方形的：", "explain": "沿對角線剪開剛好將長方形平分成兩個面積相等的三角形。", "options": ["一半（二分之一）", "一倍", "四分之一", "兩倍"], "ans": 0}, {"subject": "math", "lesson": "m_area", "type": "tf", "title": "「平方公分」在英文國際單位記作「cm²」。", "explain": "平方公分縮寫記作 cm²。", "ans": "O"}, {"subject": "math", "lesson": "m_area", "type": "tf", "title": "一個正方形的邊長是 1 公分，它的周長是 4 公分，面積是 1 平方公分。", "explain": "周長 1×4=4 cm，面積 1×1=1 cm²。", "ans": "O"}, {"subject": "math", "lesson": "m_area", "type": "tf", "title": "只要兩個圖形的周長一樣長，它們的面積就保證一定一樣大。", "explain": "周長相同但長寬比例不同時，面積會不相同（例如周長16的長方形可以是長5寬3面積15，或長4寬4面積16）。", "ans": "X"}, {"subject": "math", "lesson": "m_area", "type": "tf", "title": "將圖形移到不同位置旋轉，圖形的面積不會改變。", "explain": "位置與旋轉不影響圖形的表面大小。", "ans": "O"}, {"subject": "math", "lesson": "m_area", "type": "tf", "title": "計算黑板表面或大操場的大小，使用「平方公分」當單位太小了，需要更大的單位。", "explain": "大面積適合使用平方公尺（m²）等更大單位。", "ans": "O"}, {"subject": "math", "lesson": "m_area", "type": "choice", "title": "小華用黏土做了一塊 15 平方公分的長方形餅乾，弟弟不小心把它壓扁變形了，但沒有黏土掉落，餅乾的面積：", "explain": "黏土形狀改變但總量與鋪平面積守恆不變。", "options": ["依然保持 15 平方公分", "變成了 30 平方公分", "縮小成 5 平方公分", "變成 0 平方公分"], "ans": 0}, {"subject": "math", "lesson": "m_area", "type": "choice", "title": "長方形長 7 格、寬 2 格，正方形每邊 4 格，誰的面積較大？", "explain": "長方形 7×2=14 cm²，正方形 4×4=16 cm²，正方形較大。", "options": ["正方形較大（16 > 14）", "長方形較大", "兩者一樣大", "無法計算"], "ans": 0}, {"subject": "math", "lesson": "m_area", "type": "choice", "title": "方格紙上每一小格是 1 cm²，某圖形佔了 25 格，面積是：", "explain": "25 格對應 25 平方公分。", "options": ["25 平方公分", "25 公分", "50 平方公分", "5 平方公分"], "ans": 0}, {"subject": "math", "lesson": "m_area", "type": "choice", "title": "一張郵票的表面大小大約是多少？", "explain": "郵票小巧，約數平方公分大小。", "options": ["約 6 平方公分", "約 600 平方公分", "約 6000 平方公分", "約 1 毫米"], "ans": 0}, {"subject": "math", "lesson": "m_area", "type": "choice", "title": "把 3 個 2 平方公分的小長方形拼在一起，總面積是多少？", "explain": "3 × 2 = 6 平方公分。", "options": ["6 平方公分", "3 平方公分", "5 平方公分", "12 平方公分"], "ans": 0}, {"subject": "math", "lesson": "m_div", "type": "choice", "title": "全班有 35 位同學去湖邊划船，每艘小船最多只能載 4 個人。請問全班至少需要租幾艘船才夠所有人坐？", "explain": "35 ÷ 4 = 8 餘 3。剩下的 3 個人也必須有船坐，要用進一法：8 + 1 = 9 艘！", "options": ["9 艘", "8 艘", "10 艘", "7 艘"], "ans": 0}, {"subject": "math", "lesson": "m_div", "type": "choice", "title": "學校舉辦童軍露營，有 46 位學生參加，每頂帳篷最多住 6 人。請問至少需要搭幾頂帳篷？", "explain": "46 ÷ 6 = 7 餘 4。剩下的 4 人也要有帳篷住，進一法：7 + 1 = 8 頂！", "options": ["8 頂", "7 頂", "9 頂", "6 頂"], "ans": 0}, {"subject": "math", "lesson": "m_div", "type": "choice", "title": "小華身上帶了 50 元，文具店每本筆記本特價賣 8 元。請問小華身上的錢「最多」可以買幾本筆記本？", "explain": "50 ÷ 8 = 6 餘 2。剩下的 2 元不夠再買一本，必須使用捨去法，最多只能買 6 本！", "options": ["6 本", "7 本", "5 本", "8 本"], "ans": 0}, {"subject": "math", "lesson": "m_div", "type": "choice", "title": "阿姨買了 45 朵玫瑰花，每 7 朵包成一束花束，最多可以包成幾束花束？還剩下幾朵花？", "explain": "45 ÷ 7 = 6 餘 3。最多包滿 6 束，還剩下 3 朵花。", "options": ["包成 6 束，剩下 3 朵", "包成 7 束，剩下 3 朵", "包成 6 束，剩下 0 朵", "包成 5 束，剩下 10 朵"], "ans": 0}, {"subject": "math", "lesson": "m_div", "type": "choice", "title": "老師把 53 顆果汁糖，每 6 顆裝成一袋，全部裝完後，除法算式中商和餘數的單位分別是什麼？", "explain": "直式除法算出的商 8 單位是分裝後的「袋」，未分完的餘數 5 單位是原本的「顆」！單位千萬別搞混！", "options": ["裝成 8 袋，剩下 5 顆", "裝成 8 袋，剩下 5 袋", "裝成 8 顆，剩下 5 袋", "裝成 8 顆， function fetchCloudSheet() {
  const syncText = document.getElementById('syncStatusText');
  const syncBadge = document.getElementById('syncBadge');

  window.googleDocCallback = function(data) {
    try {
      const rows = data.table.rows;
      const parsed = [];
      rows.forEach(r => {
        const c = r.c;
        if (!c || !c[1] || !c[4]) return;
        const subject = c[1] && c[1].v ? String(c[1].v).trim() : "";
        const lesson = c[2] && c[2].v ? String(c[2].v).trim() : "";
        const qType = c[3] && c[3].v ? String(c[3].v).trim() : "單選題";
        const title = c[4] && c[4].v ? String(c[4].v).trim() : "";
        const optA = c[5] && c[5].v ? String(c[5].v).trim() : "";
        const optB = c[6] && c[6].v ? String(c[6].v).trim() : "";
        const optC = c[7] && c[7].v ? String(c[7].v).trim() : "";
        const optD = c[8] && c[8].v ? String(c[8].v).trim() : "";
        const ans = c[9] && c[9].v ? String(c[9].v).trim().toUpperCase() : "A";
        const explain = c[10] && c[10].v ? String(c[10].v).trim() : "";

        if (title === "題目" && optA.includes("文字選項")) return;
        if (!title) return;

        parsed.push({ subject, lesson, qType, title, options: [optA, optB, optC, optD].filter(Boolean), ans, explain });
      });

      if (parsed.length > 0) {
        CLOUD_QUESTIONS = parsed;
        syncText.innerText = `✅ 雲端試算表同步成功！已連線載入 ${CLOUD_QUESTIONS.length} 題外部題庫`;
        syncBadge.className = "badge-status";
        syncBadge.innerText = "雲端即時連線";
      } else {
        syncText.innerText = `💡 試算表連線成功（目前使用內建全科真題題庫）`;
      }
    } catch (e) {
      console.warn("解析試算表錯誤：", e);
    }
  };

  const script = document.createElement('script');
  script.src = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=responseHandler:googleDocCallback&sheet=${encodeURIComponent(SHEET_NAME)}&tq=${encodeURIComponent('select *')}`;
  document.body.appendChild(script);
}

  switchSubject('math');

function switchSubject(sub) {
  currentSubject = sub;
  closeNotebook();
  document.querySelectorAll('.sub-btn').forEach(btn => btn.classList.remove('active'));
  const map = { math:0, chinese:1, nature:2, english:3 };
  if (document.querySelectorAll('.sub-btn')[map[sub]]) {
    document.querySelectorAll('.sub-btn')[map[sub]].classList.add('active');
  }

  const select = document.getElementById('lessonSelect');
  select.innerHTML = "";
  LESSON_CATALOG[sub].forEach(l => {
    const opt = document.createElement('option');
    opt.value = l.id;
    opt.innerText = l.name;
    select.appendChild(opt);
  });
  currentLesson = LESSON_CATALOG[sub][0].id;
  select.value = currentLesson;

  loadQuestions();
}

function onLessonChange() {
  currentLesson = document.getElementById('lessonSelect').value;
  loadQuestions();
}

      document.getElementById('poolBadge').innerText = "面積單元：方格即時繪圖出題";
    } else if (currentLesson === 'm_capacity') {
      for (let i = 0; i < TOTAL_COUNT; i++) currentQuestions.push(OtherMathGenerators.m_capacity_displace());
      document.getElementById('poolBadge').innerText = "容量單元：量筒排水法動態實驗圖";
    } else if (currentLesson === 'm_fraction') {
      for (let i = 0; i < TOTAL_COUNT; i++) currentQuestions.push(OtherMathGenerators.m_fraction_visual());
      document.getElementById('poolBadge').innerText = "分數單元：圓餅披薩切塊動態繪圖";
    }
  } else if (currentSubject === 'chinese') {
    let pool = STATIC_DATABASE.filter(q => q.subject === 'chinese');
    if (CLOUD_QUESTIONS.length > 0) {
      const cloudP = CLOUD_QUESTIONS.filter(q => q.subject.includes("國語"));
      if (cloudP.length > 0) pool = cloudP;
    }
    if (currentLesson !== 'all') {
      pool = pool.filter(q => q.lesson === currentLesson);
    }
    const shuffled = [...pool].sort(() => Math.random() - 0.5);
    currentQuestions = shuffled.slice(0, Math.min(shuffled.length, TOTAL_COUNT));
    document.getElementById('poolBadge').innerText = `可用真題：${pool.length} 題 (每次隨機抽10題)`;
  } else if (currentSubject === 'nature') {
    let pool = STATIC_DATABASE.filter(q => q.subject === 'nature');
    if (CLOUD_QUESTIONS.length > 0) {
      const cloudP = CLOUD_QUESTIONS.filter(q => q.subject.includes("自然"));
      if (cloudP.length > 0) pool = cloudP;
    }
    if (currentLesson !== 'all') {
      pool = pool.filter(q => q.lesson === currentLesson);
    }
    const shuffled = [...pool].sort(() => Math.random() - 0.5);
    currentQuestions = shuffled.slice(0, Math.min(shuffled.length, TOTAL_COUNT));
    document.getElementById('poolBadge').innerText = `可用真題：${pool.length} 題 (每次隨機抽10題)`;
  } else if (currentSubject === 'english') {
    if (currentLesson === 'e_spell') {
      const spellPool = STATIC_DATABASE.filter(q => q.type === 'spell');
      const shuffled = [...spellPool].sort(() => Math.random() - 0.5);
      currentQuestions = shuffled.slice(0, Math.min(shuffled.length, TOTAL_COUNT));
    } else {
      let pool = STATIC_DATABASE.filter(q => q.subject === 'english' && q.type !== 'spell');
      if (currentLesson !== 'all') {
        pool = pool.filter(q => q.lesson === currentLesson);
      }
      const shuffled = [...pool].sort(() => Math.random() - 0.5);
      currentQuestions = shuffled.slice(0, Math.min(shuffled.length, TOTAL_COUNT));
    }
    document.getElementById('poolBadge').innerText = `可用題目：${currentQuestions.length} 題`;
  }

  currentIndex = 0;
  score = 0;
  renderQuestion();
}

function renderQuestion() {
  const fb = document.getElementById('feedbackBox');
  fb.style.display = 'none';

  if (currentIndex >= currentQuestions.length) {
    document.getElementById('qTitle').innerText = `🎉 恭喜完成本組挑戰！總得分：${score} / ${currentQuestions.length * 10} 分`;
    document.getElementById('diagramArea').innerHTML = "";
    document.getElementById('optionArea').innerHTML = `
      <div style="text-align:center; padding:20px;">
        <button class="next-btn" onclick="loadQuestions()">🎲 換一套全新考題繼續練習</button>
      </div>
    `;
    document.getElementById('typeBadge').innerText = "結算";
    return;
  }

  const q = currentQuestions[currentIndex];
  document.getElementById('progressText').innerText = `第 ${currentIndex + 1} / ${currentQuestions.length} 題`;
  document.getElementById('scoreText').innerText = `得分：${score}`;
  document.getElementById('qTitle').innerText = q.title;

  const diagArea = document.getElementById('diagramArea');
  diagArea.innerHTML = "";
  if (q.draw && typeof q.draw === 'function') {
    const container = document.createElement('div');
    container.className = 'diagram-container';
    const canvas = document.createElement('canvas');
    container.appendChild(canvas);
    diagArea.appendChild(container);
    q.draw(canvas);
  }

  const optArea = document.getElementById('optionArea');
  optArea.innerHTML = "";

  if (q.type === 'formula') {
    document.getElementById('typeBadge').innerText = "🔢 算式按鈕機";
    userEquation = "";
    renderFormulaKeypad();
  } else if (q.type === 'spell') {
    document.getElementById('typeBadge').innerText = "🔤 字母拼字機";
    userSpelling = "";
    renderSpellBoard(q);
  } else if (q.type === 'tf' || q.ans === 'O' || q.ans === 'X') {
    document.getElementById('typeBadge').innerText = "是非題";
    optArea.innerHTML = `<div class="choice-list" style="display:flex; flex-direction:row; gap:16px;">
      <button class="choice-btn" style="text-align:center; font-size:24px; font-weight:800; color:#059669;" onclick="checkTF('O')">⭕ 正確</button>
      <button class="choice-btn" style="text-align:center; font-size:24px; font-weight:800; color:#dc2626;" onclick="checkTF('X')">❌ 錯誤</button>
    </div>`;
  } else {
    document.getElementById('typeBadge').innerText = "選擇題";
    const correctIdx = q.ans !== undefined ? (typeof q.ans === 'number' ? q.ans : (q.ans.charCodeAt(0) - 65)) : 0;
    const correctText = q.options[correctIdx] || q.options[0];
    const shuffled = q.options.map((opt, i) => ({ text: opt, isCorrect: i === correctIdx }));
    shuffled.sort(() => Math.random() - 0.5);

    let html = '<div class="choice-list">';
    const labels = ['A', 'B', 'C', 'D'];
    shuffled.forEach((item, idx) => {
      const safeText = encodeURIComponent(item.text);
      const safeCorrect = encodeURIComponent(correctText);
      html += `<button class="choice-btn" onclick="checkChoice('${labels[idx]}', decodeURIComponent('${safeText}'), decodeURIComponent('${safeCorrect}'))">${labels[idx]}. ${item.text}</button>`;
    });
    html += '</div>';
    optArea.innerHTML = html;
  }
}

function checkTF(userChoice) {
  const q = currentQuestions[currentIndex];
  const isCorrect = (userChoice === q.ans);
  const fb = document.getElementById('feedbackBox');
  const fbTitle = document.getElementById('fbTitle');
  const fbDetail = document.getElementById('fbDetail');

  if (isCorrect) {
    score += 10;
    fb.className = "feedback-box correct";
    fbTitle.innerText = "🎯 回答完全正確！";
  } else {
    fb.className = "feedback-box wrong";
    fbTitle.innerText = `💡 差一點點！正確答案是【${q.ans}】`;
    recordWrong(q, userChoice);
  }
  fbDetail.innerText = q.explain;
  fb.style.display = 'block';
  document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);
}

function checkChoice(selectedLabel, userChosenText, correctText) {
  const q = currentQuestions[currentIndex];
  const isCorrect = (userChosenText === correctText);

  const fb = document.getElementById('feedbackBox');
  const fbTitle = document.getElementById('fbTitle');
  const fbDetail = document.getElementById('fbDetail');

  if (isCorrect) {
    score += 10;
    fb.className = "feedback-box correct";
    fbTitle.innerText = `🎯 太棒了！選擇【${selectedLabel}. ${userChosenText}】完全正確！`;
  } else {
    fb.className = "feedback-box wrong";
    fbTitle.innerText = `💡 差一點點！正確答案是：【${correctText}】`;
    recordWrong(q, userChosenText);
  }

  fbDetail.innerText = q.explain;
  fb.style.display = 'block';
  document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);
}

function renderFormulaKeypad() {
  const optArea = document.getElementById('optionArea');
  optArea.innerHTML = `
    <div class="math-display-container">
      <div class="math-display-text" id="mDisplay">${userEquation || "（請點選下方按鈕輸入算式）"}</div>
    </div>
    <div class="math-keypad">
      <button class="m-key" onclick="pressMathKey('7')">7</button>
      <button class="m-key" onclick="pressMathKey('8')">8</button>
      <button class="m-key" onclick="pressMathKey('9')">9</button>
      <button class="m-key op" onclick="pressMathKey('÷')">÷</button>
      <button class="m-key func" onclick="deleteMathKey()">⌫</button>

      <button class="m-key" onclick="pressMathKey('4')">4</button>
      <button class="m-key" onclick="pressMathKey('5')">5</button>
      <button class="m-key" onclick="pressMathKey('6')">6</button>
      <button class="m-key op" onclick="pressMathKey('×')">×</button>
      <button class="m-key func" onclick="clearMathKey()">C</button>

      <button class="m-key" onclick="pressMathKey('1')">1</button>
      <button class="m-key" onclick="pressMathKey('2')">2</button>
      <button class="m-key" onclick="pressMathKey('3')">3</button>
      <button class="m-key op" onclick="pressMathKey('＝')">＝</button>
      <button class="m-key op" onclick="pressMathKey('⋯')">⋯(餘)</button>

      <button class="m-key" onclick="pressMathKey('0')">0</button>
      <button class="m-key op" onclick="pressMathKey('＋')">＋</button>
      <button class="m-key op" onclick="pressMathKey('－')">－</button>
      <button class="m-key submit" onclick="submitFormula()">送出算式 ✔</button>
    </div>
  `;
}

function pressMathKey(char) {
  userEquation += char;
  const disp = document.getElementById('mDisplay');
  if (disp) disp.innerText = userEquation;
}

function deleteMathKey() {
  if (userEquation.length > 0) {
    userEquation = userEquation.slice(0, -1);
    const disp = document.getElementById('mDisplay');
    if (disp) disp.innerText = userEquation || "（請點選下方按鈕輸入算式）";
  }
}

function clearMathKey() {
  userEquation = "";
  const disp = document.getElementById('mDisplay');
  if (disp) disp.innerText = "（請點選下方按鈕輸入算式）";
}

function submitFormula() {
  const q = currentQuestions[currentIndex];
  let cleaned = userEquation.replace(/=/g, '＝').replace(/\//g, '÷').replace(/\.\.\./g, '⋯').replace(/\s+/g, '');
  let targetCleaned = (q.targetPattern || "").replace(/=/g, '＝').replace(/\//g, '÷').replace(/\.\.\./g, '⋯').replace(/\s+/g, '');

  let isCorrect = (cleaned === targetCleaned);

  const fb = document.getElementById('feedbackBox');
  const fbTitle = document.getElementById('fbTitle');
  const fbDetail = document.getElementById('fbDetail');

  if (isCorrect) {
    score += 10;
    fb.className = "feedback-box correct";
    fbTitle.innerText = "🎯 太厲害了！列出的除法算式完全正確！";
  } else {
    fb.className = "feedback-box wrong";
    fbTitle.innerText = `💡 算式差一點點喔！正確算式為【${q.targetPattern}】`;
    recordWrong(q, userEquation);
  }

  fbDetail.innerText = q.explain;
  fb.style.display = 'block';
  document.querySelectorAll('.m-key').forEach(b => b.disabled = true);
}

function renderSpellBoard(q) {
  const optArea = document.getElementById('optionArea');
  let boxes = "";
  for(let i = 0; i < (q.target || "").length; i++) {
    const ch = userSpelling[i] || "";
    boxes += `<div class="letter-box">${ch}</div>`;
  }

  const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
  let keys = "";
  alphabet.forEach(letter => {
    keys += `<button class="vk-key" onclick="pressKey('${letter}')">${letter}</button>`;
  });

  optArea.innerHTML = `
    <div class="spell-display">${boxes}</div>
    <div class="virtual-keyboard">${keys}</div>
    <div class="spell-actions">
      <button class="spell-action-btn btn-del" onclick="deleteKey()">⌫ 刪除</button>
      <button class="spell-action-btn btn-submit" onclick="submitSpell()">送出答案 ✔</button>
    </div>
  `;
}

function pressKey(letter) {
  const q = currentQuestions[currentIndex];
  if(userSpelling.length < (q.target || "").length) {
    userSpelling += letter;
    renderSpellBoard(q);
  }
}

function deleteKey() {
  if(userSpelling.length > 0) {
    userSpelling = userSpelling.slice(0, -1);
    renderSpellBoard(currentQuestions[currentIndex]);
  }
}

function submitSpell() {
  const q = currentQuestions[currentIndex];
  const isCorrect = (userSpelling.toUpperCase() === q.target.toUpperCase());

  const fb = document.getElementById('feedbackBox');
  const fbTitle = document.getElementById('fbTitle');
  const fbDetail = document.getElementById('fbDetail');

  if (isCorrect) {
    score += 10;
    fb.className = "feedback-box correct";
    fbTitle.innerText = `🎯 太棒了！拼寫完全正確：【${q.target}】！`;
  } else {
    fb.className = "feedback-box wrong";
    fbTitle.innerText = `💡 差一點點！你拼的是【${userSpelling || "空白"}】，正確拼法是【${q.target}】`;
    recordWrong(q, userSpelling);
  }

  fbDetail.innerText = q.explain;
  fb.style.display = 'block';
  document.querySelectorAll('.vk-key, .spell-action-btn').forEach(b => b.disabled = true);
}

function recordWrong(q, userChoice) {
  if (!wrongQuestions.some(item => item.title === q.title)) {
    wrongQuestions.push({
      subject: (LESSON_CATALOG[currentSubject] ? currentSubject : "綜合"),
      title: q.title,
      explain: q.explain
    });
  }
}

function nextQuestion() {
  currentIndex++;
  renderQuestion();
}

function openNotebook() {
  document.getElementById('mainPanel').style.display = 'none';
  document.getElementById('lessonBar').style.display = 'none';
  document.getElementById('notebookPanel').style.display = 'block';

  const container = document.getElementById('wrongList');
  if (wrongQuestions.length === 0) {
    container.innerHTML = "<p style='color:#059669; font-weight:bold; padding:20px 0;'>太厲害了！目前沒有任何錯題喔！</p>";
    return;
  }

  let html = "";
  wrongQuestions.forEach((item, idx) => {
    html += `
      <div class="nb-card">
        <div style="font-size:12px; color:#2563eb; font-weight:bold;">錯題 ${idx+1}</div>
        <div style="font-weight:700; margin:6px 0;">${item.title}</div>
        <div style="font-size:13px; color:#dc2626; background:#fef2f2; padding:8px; border-radius:8px;">
          📌 核心考點解析：${item.explain}
        </div>
      </div>
    `;
  });
  container.innerHTML = html;
}

function closeNotebook() {
  document.getElementById('notebookPanel').style.display = 'none';
  document.getElementById('mainPanel').style.display = 'block';
  document.getElementById('lessonBar').style.display = 'flex';
}

window.onload = init;
</script>
</body>
</html>
