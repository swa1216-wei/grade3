<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小學三年級英文・星際大冒險</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body {
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }
        #game-container {
            width: 100%;
            max-width: 600px;
            background: #1e293b;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 2px solid #334155;
        }
        .header-bar {
            background: #0f172a;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #334155;
            font-size: 15px;
            font-weight: bold;
        }
        .battle-stage {
            position: relative;
            height: 240px;
            background: url('assets/map_bg.jfif') center/cover no-repeat;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 2px solid #334155;
        }
        .battle-stage::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.4);
            z-index: 1;
        }
        .fighter-group, .enemy-group {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .avatar-box {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            border: 3px solid #38bdf8;
            background: #fff;
            overflow: hidden;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.4);
        }
        .avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .pet-badge {
            font-size: 12px;
            background: rgba(15, 23, 42, 0.8);
            padding: 4px 8px;
            border-radius: 12px;
            border: 1px solid #38bdf8;
        }
        .enemy-box {
            width: 105px;
            height: 105px;
            border-radius: 16px;
            border: 3px solid #f43f5e;
            background: #fff;
            overflow: hidden;
            box-shadow: 0 4px 12px rgba(244, 63, 94, 0.4);
        }
        .enemy-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .hp-bar-container {
            width: 100px;
            background: #334155;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid #64748b;
        }
        .hp-fill {
            height: 100%;
            background: #22c55e;
            width: 100%;
            transition: width 0.3s ease;
        }
        .quiz-panel {
            padding: 16px;
            background: #1e293b;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-grow: 1;
        }
        .question-box {
            font-size: 17px;
            font-weight: bold;
            line-height: 1.4;
            background: #0f172a;
            padding: 14px;
            border-radius: 10px;
            border-left: 4px solid #38bdf8;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .option-btn {
            background: #334155;
            color: #f8fafc;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            border: 1px solid #475569;
        }
        .option-btn:hover {
            background: #475569;
            border-color: #38bdf8;
        }
        .option-btn.correct { background: #166534 !important; border-color: #22c55e !important; }
        .option-btn.wrong { background: #991b1b !important; border-color: #ef4444 !important; }
        .hud-footer {
            background: #0f172a;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 2px solid #334155;
            font-size: 14px;
        }
        .btn-action {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-action:hover { background: #2563eb; }
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 20px;
        }
        .modal-content {
            background: #1e293b;
            padding: 24px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 2px solid #334155;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- 頂部狀態列 -->
        <div class="header-bar">
            <span id="stage-info">關卡：Stage 1 (基礎單字)</span>
            <span>⭐ 星幣: <span id="coins">0</span></span>
        </div>

        <!-- 戰鬥畫面舞台 -->
        <div class="battle-stage">
            <!-- 我方角色與寵物 -->
            <div class="fighter-group">
                <div class="avatar-box" id="hero-avatar-box">
                    <img id="hero-img" src="assets/hero_warrior.jfif" alt="Hero">
                </div>
                <div class="pet-badge" id="pet-badge-text">🐕 柴犬 (星幣+20%)</div>
                <div style="font-size: 13px;" id="hearts-display">❤️❤️❤️</div>
            </div>

            <!-- 敵方怪獸 -->
            <div class="enemy-group">
                <div class="enemy-box">
                    <img id="enemy-img" src="assets/boss_slime.jfif" alt="Enemy">
                </div>
                <div class="hp-bar-container">
                    <div class="hp-fill" id="enemy-hp-fill"></div>
                </div>
                <span style="font-size: 12px;" id="enemy-name">果凍史萊姆</span>
            </div>
        </div>

        <!-- 答題操作面板 -->
        <div class="quiz-panel">
            <div class="question-box" id="question-text">載入中...</div>
            <div class="options-grid" id="options-container">
                <!-- 動態生成 4 個選項 -->
            </div>
        </div>

        <!-- 底部功能列 -->
        <div class="hud-footer">
            <span>裝備等級: Lv.<span id="gear-lvl">1</span></span>
            <button class="btn-action" onclick="openShop()">🛒 商店 / 角色</button>
        </div>
    </div>

    <!-- 商店與角色切換 Modal -->
    <div id="shop-modal" class="modal hidden">
        <div class="modal-content">
            <h2>星際補給站</h2>
            <div style="text-align: left; display: flex; flex-direction: column; gap: 8px; font-size: 14px;">
                <p><b>選擇職業：</b></p>
                <div style="display: flex; gap: 6px;">
                    <button class="btn-action" onclick="setHero('warrior')">劍士</button>
                    <button class="btn-action" onclick="setHero('mage')">法師</button>
                    <button class="btn-action" onclick="setHero('healer')">治療</button>
                </div>
                <p style="margin-top: 8px;"><b>選擇寵物：</b></p>
                <div style="display: flex; flex-wrap: wrap; gap: 6px;">
                    <button class="btn-action" onclick="setPet('dog', '🐕 柴犬')">柴犬</button>
                    <button class="btn-action" onclick="setPet('cat', '🐈 橘貓')">橘貓</button>
                    <button class="btn-action" onclick="setPet('otter', '🦦 水獺')">水獺</button>
                    <button class="btn-action" onclick="setPet('rabbit', '🐇 白兔')">白兔</button>
                    <button class="btn-action" onclick="setPet('penguin', '🐧 企鵝')">企鵝</button>
                    <button class="btn-action" onclick="setPet('bot', '🤖 機械')">機械</button>
                </div>
                <hr style="border-color: #334155; margin: 6px 0;">
                <button class="btn-action" onclick="upgradeGear()" style="background: #16a34a;">升級裝備 (消耗 50 星幣)</button>
            </div>
            <button class="btn-action" onclick="closeShop()" style="background: #475569; margin-top: 10px;">返回戰鬥</button>
        </div>
    </div>

    <script>
        // 40 題三年級純英文核心題庫
        const questions = [
            { q: "What letter comes after \"G\"?", options: ["E", "F", "H", "I"], answer: 2 },
            { q: "Which word has a short \"a\" sound?", options: ["cake", "cat", "make", "kite"], answer: 1 },
            { q: "How do you spell the number \"10\"?", options: ["seven", "eight", "nine", "ten"], answer: 3 },
            { q: "Which one is a fruit?", options: ["Apple", "Dog", "Pencil", "Desk"], answer: 0 },
            { q: "What color is the sky on a clear day?", options: ["Red", "Blue", "Green", "Yellow"], answer: 1 },
            { q: "Which animal says \"Meow\"?", options: ["Dog", "Cat", "Cow", "Duck"], answer: 1 },
            { q: "How many days are in a week?", options: ["5", "6", "7", "10"], answer: 2 },
            { q: "Which school item do you use to erase pencil marks?", options: ["Ruler", "Eraser", "Book", "Pen"], answer: 1 },
            { q: "What is the first month of the year?", options: ["May", "January", "December", "October"], answer: 1 },
            { q: "Which word means \"太陽\"?", options: ["Moon", "Star", "Sun", "Cloud"], answer: 2 },
            { q: "A: \"Good morning, teacher!\" B: \"________, Tom.\"", options: ["Good night", "Good morning", "Goodbye", "See you"], answer: 1 },
            { q: "A: \"How are you?\" B: \"________, thank you.\"", options: ["I am seven", "I'm fine", "My name is Amy", "It is a book"], answer: 1 },
            { q: \"A: \"What's your name?\" B: \"________\"\", options: ["I am fine", "My name is Leo", "It is blue", "Nice to meet you"], answer: 1 },
            { q: \"A: \"How old are you?\" B: \"________\"\", options: ["I am fine", "I am eight years old", "It is a pen", "Thank you"], answer: 1 },
            { q: \"A: \"Nice to meet you.\" B: \"________\"\", options: ["Goodbye", "Nice to meet you, too", "You are welcome", "Good night"], answer: 1 },
            { q: "When you leave school in the afternoon, you say:", options: ["Good morning", "Goodbye", "Good night", "Hello"], answer: 1 },
            { q: \"A: \"Thank you very much.\" B: \"________\"\", options: ["You're welcome", "I'm sorry", "Hello", "Good job"], answer: 0 },
            { q: \"A: \"May I go to the restroom, please?\" B: \"________\"\", options: ["Yes, you may", "No, it isn't", "Thank you", "It's a pencil"], answer: 0 },
            { q: \"A: \"What time is it?\" B: \"________\"\", options: ["It's an apple", "It's three o'clock", "I am happy", "It's blue"], answer: 1 },
            { q: \"A: \"Do you like apples?\" B: \"________, I do.\"", options: ["No", "Yes", "Not", "Are"], answer: 1 },
            { q: \"Look! ________ is an elephant.\", options: ["This", "These", "Those", "They"], answer: 0 },
            { q: \"I ________ a student. You ________ a teacher.\", options: ["am; are", "is; am", "are; is", "am; is"], answer: 0 },
            { q: \"Is this a pencil? Yes, ________.\", options: ["this is", "it is", "it isn't", "that is"], answer: 1 },
            { q: \"How many books ________ there?\", options: ["is", "am", "are", "be"], answer: 2 },
            { q: \"She ________ a cute dog.\", options: ["have", "has", "having", "is have"], answer: 1 },
            { q: \"What ________ you doing? I am reading a book.\", options: ["am", "is", "are", "be"], answer: 2 },
            { q: \"He can ________, but he cannot swim.\", options: ["run", "runs", "running", "ran"], answer: 0 },
            { q: \"My mother ________ cooking in the kitchen.\", options: ["am", "are", "is", "be"], answer: 2 },
            { q: \"The cats ________ sleeping under the tree.\", options: ["am", "is", "are", "be"], answer: 2 },
            { q: \"We go to school ________ Monday ________ Friday.\", options: ["from; to", "on; in", "at; on", "in; to"], answer: 0 },
            { q: \"What is the girl's name? (Amy, 9 yrs old)\", options: ["Mary", "Amy", "Linda", "Grace"], answer: 1 },
            { q: \"How old is Amy?\", options: ["7", "8", "9", "10"], answer: 2 },
            { q: \"What does Amy's father do? (Doctor)\", options: ["Teacher", "Doctor", "Student", "Driver"], answer: 1 },
            { q: \"What does Amy's mother do? (Teacher)\", options: ["Teacher", "Doctor", "Nurse", "Cook"], answer: 0 },
            { q: \"Who is Tom? (Little brother)\", options: ["Father", "Friend", "Little brother", "Uncle"], answer: 2 },
            { q: \"What day is it today? (Sunday)\", options: ["Saturday", "Sunday", "Monday", "Friday"], answer: 1 },
            { q: \"How is the weather today? (Sunny and warm)\", options: ["Rainy and cold", "Sunny and warm", "Snowy and windy", "Cloudy"], answer: 1 },
            { q: \"Where are John and his friends? (Park)\", options: ["School", "Park", "Home", "Zoo"], answer: 1 },
            { q: \"What is John doing with Mike? (Playing basketball)\", options: ["Playing basketball", "Flying a kite", "Reading a book", "Swimming"], answer: 0 },
            { q: \"What is Sarah doing? (Flying a kite)\", options: ["Playing baseball", "Flying a kite", "Eating an apple", "Running"], answer: 1 }
        ];

        const enemies = [
            { name: "果凍史萊姆", img: "assets/boss_slime.jfif", maxHp: 30 },
            { name: "機械飛行蝠", img: "assets/boss_bat.jfif", maxHp: 40 },
            { name: "調皮南瓜怪", img: "assets/boss_pumpkin.jfif", maxHp: 50 },
            { name: "裝甲巨石怪", img: "assets/boss_golem.jfif", maxHp: 65 },
            { name: "星際霸王魔龍", img: "assets/boss_dragon.jfif", maxHp: 90 }
        ];

        let currentQIndex = 0;
        let coins = 0;
        let gearLevel = 1;
        let hearts = 3;
        let currentEnemyIdx = 0;
        let enemyHp = enemies[0].maxHp;
        let currentPet = { id: 'dog', name: '🐕 柴犬' };

        function loadQuestion() {
            if (currentQIndex >= questions.length) currentQIndex = 0;
            let q = questions[currentQIndex];
            document.getElementById("question-text").innerText = `Q${currentQIndex + 1}: ${q.q}`;
            
            let optContainer = document.getElementById("options-container");
            optContainer.innerHTML = "";
            q.options.forEach((opt, idx) => {
                let btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = `${String.fromCharCode(65 + idx)}. ${opt}`;
                btn.onclick = () => checkAnswer(idx, btn);
                optContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedIdx, btnElement) {
            let q = questions[currentQIndex];
            let allBtns = document.querySelectorAll(".option-btn");
            
            // 停用所有按鈕防止連點
            allBtns.forEach(b => b.disabled = true);

            if (selectedIdx === q.answer) {
                btnElement.classList.add("correct");
                let damage = 15 + (gearLevel * 5);
                enemyHp -= damage;
                
                let earnedCoins = currentPet.id === 'dog' ? 12 : 10;
                coins += earnedCoins;
                document.getElementById("coins").innerText = coins;

                updateEnemyHpUI();

                setTimeout(() => {
                    if (enemyHp <= 0) {
                        alert(`🎉 恭喜擊敗 ${enemies[currentEnemyIdx].name}！進入下一關！`);
                        currentEnemyIdx = (currentEnemyIdx + 1) % enemies.length;
                        enemyHp = enemies[currentEnemyIdx].maxHp;
                        document.getElementById("enemy-img").src = enemies[currentEnemyIdx].img;
                        document.getElementById("enemy-name").innerText = enemies[currentEnemyIdx].name;
                        document.getElementById("stage-info").innerText = `關卡：Stage ${currentEnemyIdx + 1} (${enemies[currentEnemyIdx].name})`;
                    }
                    currentQIndex++;
                    loadQuestion();
                }, 800);
            } else {
                btnElement.classList.add("wrong");
                allBtns[q.answer].classList.add("correct");

                // 水獺護盾判斷
                if (currentPet.id === 'otter') {
                    alert("🦦 呆萌水獺發動護盾，幫你擋下了一次失誤！");
                } else {
                    hearts--;
                    updateHeartsUI();
                    if (hearts <= 0) {
                        alert("💔 哎呀！愛心耗盡了，再試一次加油！");
                        hearts = 3;
                        updateHeartsUI();
                    }
                }

                setTimeout(() => {
                    currentQIndex++;
                    loadQuestion();
                }, 1200);
            }
        }

        function updateEnemyHpUI() {
            let maxHp = enemies[currentEnemyIdx].maxHp;
            let percent = Math.max(0, (enemyHp / maxHp) * 100);
            document.getElementById("enemy-hp-fill").style.width = percent + "%";
        }

        function updateHeartsUI() {
            document.getElementById("hearts-display").innerText = "❤️".repeat(hearts) + "🖤".repeat(3 - hearts);
        }

        function setHero(type) {
            let map = { warrior: 'assets/hero_warrior.jfif', mage: 'assets/hero_mage.jfif', healer: 'assets/hero_healer.jfif' };
            document.getElementById("hero-img").src = map[type];
            closeShop();
        }

        function setPet(id, nameText) {
            currentPet = { id, name: nameText };
            document.getElementById("pet-badge-text").innerText = nameText;
            closeShop();
        }

        function upgradeGear() {
            if (coins >= 50) {
                coins -= 50;
                gearLevel++;
                document.getElementById("coins").innerText = coins;
                document.getElementById("gear-lvl").innerText = gearLevel;
                alert(`✨ 裝備升級成功！目前等級 Lv.${gearLevel}`);
            } else {
                alert("❌ 星幣不足 50 點！多答對幾題來賺取星幣吧！");
            }
        }

        function openShop() { document.getElementById("shop-modal").classList.remove("hidden"); }
        function closeShop() { document.getElementById("shop-modal").classList.add("hidden"); }

        // 初始化遊戲
        updateEnemyHpUI();
        loadQuestion();
    </script>
</body>
</html>
