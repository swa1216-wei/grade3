<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>國小三年級期末大考・108課綱全真模擬與國語島系統</title>
<style>
  :root {
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --primary-light: #eff6ff;
    --success: #10b981;
    --danger: #ef4444;
    --text-main: #0f172a;
    --text-sub: #475569;
    --bg-page: #f8fafc;
    --card-bg: #ffffff;
    --border: #cbd5e1;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
    background: var(--bg-page);
    color: var(--text-main);
    margin: 0;
    padding: 12px;
  }
  .app-container {
    max-width: 960px;
    margin: 0 auto;
    background: var(--card-bg);
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.06);
    overflow: hidden;
    border: 1px solid var(--border);
  }
  header {
    background: linear-gradient(135deg, #1e3a8a, #2563eb);
    color: white;
    padding: 22px 20px;
    text-align: center;
  }
  header h1 { margin: 0 0 6px 0; font-size: 22px; font-weight: 800; }
  header p { margin: 0; font-size: 13.5px; opacity: 0.95; }

  .status-bar {
    background: #0f172a;
    color: #e2e8f0;
    padding: 10px 18px;
    font-size: 13px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  .badge-status {
    background: #059669;
    color: #ecfdf5;
    padding: 4px 10px;
    border-radius: 6px;
    font-weight: 700;
  }

  .subject-nav {
    display: flex;
    background: #e2e8f0;
    padding: 6px;
    gap: 6px;
    overflow-x: auto;
  }
  .sub-btn {
    flex: 1;
    min-width: 95px;
    padding: 12px 6px;
    border: none;
    border-radius: 12px;
    background: transparent;
    color: #475569;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
  }
  .sub-btn.active {
    background: white;
    color: var(--primary-dark);
    box-shadow: 0 4px 10px rgba(37, 99, 235, 0.15);
  }

  .lesson-bar {
    padding: 12px 18px;
    background: var(--primary-light);
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .lesson-bar label { font-size: 14px; font-weight: 700; color: #1e293b; white-space: nowrap; }
  .lesson-select {
    flex: 1;
    min-width: 280px;
    padding: 9px 12px;
    border: 1px solid #94a3b8;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    background: white;
    color: #0f172a;
    outline: none;
  }
  .action-btn {
    padding: 9px 16px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .action-btn:hover { background: var(--primary-dark); }
  .mode-badge {
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12.5px;
    font-weight: 700;
    background: #dbeafe;
    color: #1e40af;
  }

  /* 國語島專屬子模式導航列 */
  .chinese-sub-bar {
    display: flex;
    background: #fdfbf7;
    border-bottom: 2px solid #fed7aa;
    padding: 8px 18px;
    gap: 10px;
    overflow-x: auto;
  }
  .c-sub-btn {
    padding: 8px 14px;
    border: 2px solid #fed7aa;
    border-radius: 10px;
    background: white;
    font-size: 13.5px;
    font-weight: 700;
    color: #9a3412;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .c-sub-btn.active {
    background: #f97316;
    color: white;
    border-color: #ea580c;
  }

  .main-panel { padding: 22px; min-height: 480px; }
  .status-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    font-size: 14px;
    font-weight: 700;
    color: var(--text-sub);
  }
  .q-badge {
    background: #e2e8f0;
    padding: 5px 12px;
    border-radius: 20px;
    color: #1e293b;
    font-size: 13px;
  }
  .score-badge {
    background: #fef3c7;
    color: #92400e;
    padding: 5px 12px;
    border-radius: 20px;
  }
  .q-box {
    background: #fafbfe;
    border: 2px solid #e2e8f0;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .q-title {
    font-size: 18.5px;
    font-weight: 700;
    line-height: 1.65;
    color: #0f172a;
    margin: 0;
  }

  /* 選擇題選項卡 */
  .choice-list { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
  .choice-btn {
    width: 100%;
    padding: 15px 20px;
    border: 2px solid #cbd5e1;
    border-radius: 12px;
    background: white;
    text-align: left;
    font-size: 16px;
    font-weight: 600;
    line-height: 1.45;
    cursor: pointer;
    color: #1e293b;
    transition: all 0.15s;
  }
  .choice-btn:hover { border-color: var(--primary); background: #eff6ff; }

  /* 國語島：成語大卡片 (橘色大按鈕，精確對標截圖) */
  .idiom-choice-list {
    display: flex;
    gap: 16px;
    justify-content: center;
    margin-top: 20px;
    flex-wrap: wrap;
  }
  .idiom-btn {
    flex: 1;
    min-width: 160px;
    max-width: 240px;
    padding: 18px 12px;
    border: 2px solid #d97706;
    border-radius: 14px;
    background: #f59e0b;
    color: white;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 2px;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(217, 119, 6, 0.25);
    transition: transform 0.1s, background 0.2s;
  }
  .idiom-btn:active { transform: scale(0.97); }
  .idiom-btn:hover { background: #d97706; }

  /* 國語島：句子重組積木機 (精確對標截圖) */
  .unscramble-target-box {
    min-height: 75px;
    border: 2px dashed #94a3b8;
    border-radius: 14px;
    background: #f8fafc;
    padding: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    margin: 16px 0;
  }
  .unscramble-source-box {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    margin: 18px 0;
  }
  .word-block {
    padding: 12px 18px;
    border: 2px solid #b45309;
    border-radius: 12px;
    background: #fef3c7;
    color: #78350f;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 3px 6px rgba(180, 83, 9, 0.15);
    transition: transform 0.1s, background 0.15s;
    user-select: none;
  }
  .word-block:active { transform: scale(0.95); }
  .word-block.used { opacity: 0.35; pointer-events: none; }
  .unscramble-actions {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-top: 14px;
  }
  .unscramble-btn {
    padding: 10px 22px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    border: 1px solid #cbd5e1;
  }
  .btn-reset-blocks { background: #f1f5f9; color: #475569; }
  .btn-submit-blocks { background: #059669; color: white; border: none; }

  /* 國語島：生字字典寶箱卡 (精確對標截圖) */
  .char-chest-display {
    background: white;
    border: 2px solid #cbd5e1;
    border-radius: 16px;
    padding: 20px;
    display: flex;
    gap: 24px;
    align-items: center;
    margin-bottom: 20px;
  }
  .char-big-font {
    font-size: 68px;
    font-weight: 900;
    color: #1e293b;
    border: 2px solid #cbd5e1;
    border-radius: 12px;
    padding: 6px 18px;
    background: #f8fafc;
  }
  .char-meta-info {
    font-size: 16px;
    line-height: 1.8;
    color: #334155;
  }
  .char-meta-info b { color: #0f172a; }
  .char-tiles-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(75px, 1fr));
    gap: 10px;
    margin-top: 14px;
  }
  .char-tile-btn {
    padding: 12px 6px;
    border: 2px solid #cbd5e1;
    border-radius: 12px;
    background: white;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
  }
  .char-tile-btn.active {
    border-color: #2563eb;
    background: #eff6ff;
    box-shadow: 0 4px 10px rgba(37, 99, 235, 0.15);
  }
  .char-tile-btn .c-main { font-size: 24px; font-weight: 800; color: #0f172a; }
  .char-tile-btn .c-zy { font-size: 12px; color: #64748b; margin-top: 2px; }

  .feedback-box {
    margin-top: 18px;
    padding: 16px;
    border-radius: 14px;
    display: none;
  }
  .feedback-box.correct { background: #ecfdf5; border: 2px solid #6ee7b7; color: #065f46; }
  .feedback-box.wrong { background: #fef2f2; border: 2px solid #fca5a5; color: #991b1b; }
  .fb-title { font-size: 16px; font-weight: 800; margin-bottom: 6px; }
  .fb-detail { font-size: 14.5px; line-height: 1.6; }
  .next-btn {
    display: block;
    width: 100%;
    margin-top: 14px;
    padding: 14px;
    background: #0f172a;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 15.5px;
    font-weight: 700;
    cursor: pointer;
  }

  .notebook-view { display: none; padding: 16px; }
  .nb-card {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;
    background: #fff;
  }
</style>
</head>
<body>

<div class="app-container">
  <header>
    <h1>國小三年級期末大考・108課綱全真全科模擬系統</h1>
    <p>📖 國語島(生字寶箱・句子重組・成語填空) ｜ 📐 數學實驗室 ｜ 🌱 自然科學 ｜ 🔤 英文闖關</p>
  </header>

  <div class="status-bar">
    <span id="syncStatusText">✨ 國語島全能架構＋全科題庫已就緒</span>
    <span id="syncBadge" class="badge-status">全題庫就緒</span>
  </div>

  <div class="subject-nav">
    <button class="sub-btn active" onclick="switchSubject('chinese')">📖 國語島冒險</button>
    <button class="sub-btn" onclick="switchSubject('math')">🔢 數學實驗室</button>
    <button class="sub-btn" onclick="switchSubject('nature')">🌱 自然科學</button>
    <button class="sub-btn" onclick="openNotebook()" style="color:#d97706;">📝 錯題筆記</button>
  </div>

  <div class="lesson-bar" id="lessonBar">
    <label for="lessonSelect">選擇單元課別：</label>
    <select id="lessonSelect" class="lesson-select" onchange="onLessonChange()"></select>
    <button class="action-btn" onclick="loadQuestions()">🎲 換一批全新題目</button>
    <span class="mode-badge" id="poolBadge">載入中...</span>
  </div>

  <!-- 國語島四大闖關子導航列 -->
  <div class="chinese-sub-bar" id="chineseSubBar">
    <button class="c-sub-btn active" onclick="switchChineseMode('chest')">🗃️ 生字學習寶箱</button>
    <button class="c-sub-btn" onclick="switchChineseMode('unscramble')">🧩 句子重組積木機</button>
    <button class="c-sub-btn" onclick="switchChineseMode('idiom')">🎯 成語情境填空</button>
    <button class="c-sub-btn" onclick="switchChineseMode('quiz')">📝 課文生字綜合測驗</button>
  </div>

  <div class="main-panel" id="mainPanel">
    <div class="status-row" id="statusRow">
      <span class="q-badge" id="typeBadge">選擇題</span>
      <span id="progressText">第 1 題</span>
      <span class="score-badge" id="scoreText">得分：0</span>
    </div>

    <div class="q-box" id="qBox">
      <h2 class="q-title" id="qTitle">題目載入中...</h2>
      <div id="diagramArea"></div>
    </div>

    <div id="optionArea"></div>

    <div class="feedback-box" id="feedbackBox">
      <div class="fb-title" id="fbTitle"></div>
      <div class="fb-detail" id="fbDetail"></div>
      <button class="next-btn" id="nextBtn" onclick="nextQuestion()">進入下一題 ➔</button>
    </div>
  </div>

  <div class="notebook-view" id="notebookPanel">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
      <h3 style="margin:0; font-size:18px;">📝 錯題收錄筆記本</h3>
      <button onclick="closeNotebook()" style="padding:6px 14px; border-radius:8px; border:1px solid #cbd5e1; font-weight:700; cursor:pointer;">返回練習</button>
    </div>
    <div id="wrongList">目前沒有錯題，表現優異！</div>
  </div>
</div>

let currentSubject = 'chinese';
let currentLesson = 'c_l7';
let currentChineseMode = 'chest'; // 'chest', 'unscramble', 'idiom', 'quiz'

let currentIndex = 0;
let score = 0;

let unscrambleCurrent = null;
let unscrambleUserBlocks = [];
let unscrambleAvailableBlocks = [];
let wrongQuestions = [];

function init() {
  switchSubject('chinese');
}

function switchSubject(sub) {
  currentSubject = sub;
  closeNotebook();
  document.querySelectorAll('.sub-btn').forEach(btn => btn.classList.remove('active'));
  const map = { chinese:0, math:1, nature:2 };
  if (document.querySelectorAll('.sub-btn')[map[sub]]) {
    document.querySelectorAll('.sub-btn')[map[sub]].classList.add('active');
  }

  const cSubBar = document.getElementById('chineseSubBar');
  cSubBar.style.display = (sub === 'chinese') ? 'flex' : 'none';

  const select = document.getElementById('lessonSelect');
  select.innerHTML = "";
  LESSON_CATALOG[sub].forEach(l => {
    const opt = document.createElement('option');
    opt.value = l.id;
    opt.innerText = l.name;
    select.appendChild(opt);
  });
  currentLesson = LESSON_CATALOG[sub][0].id;
  select.value = currentLesson;

  loadQuestions();
}

function onLessonChange() {
  currentLesson = document.getElementById('lessonSelect').value;
  loadQuestions();
}

function switchChineseMode(mode) {
  currentChineseMode = mode;
  document.querySelectorAll('.c-sub-btn').forEach(b => b.classList.remove('active'));
  const modes = ['chest', 'unscramble', 'idiom', 'quiz'];
  const idx = modes.indexOf(mode);
  if (idx !== -1 && document.querySelectorAll('.c-sub-btn')[idx]) {
    document.querySelectorAll('.c-sub-btn')[idx].classList.add('active');
  }
  loadQuestions();
}

function loadQuestions() {
  const fb = document.getElementById('feedbackBox');
  fb.style.display = 'none';
  currentIndex = 0;
  score = 0;
  currentQuestions = [];

  const lKey = currentLesson === 'all' ? 'c_l7' : currentLesson;

  if (currentSubject === 'chinese') {
    if (currentChineseMode === 'chest') {
      document.getElementById('statusRow').style.display = 'none';
      document.getElementById('poolBadge').innerText = "生字學習寶箱";
      currentChestCharIndex = 0;
      renderChineseChest(lKey);
    } else if (currentChineseMode === 'unscramble') {
      document.getElementById('statusRow').style.display = 'flex';
      document.getElementById('typeBadge').innerText = "句子重組積木";
      const sList = CHINESE_SENTENCES[lKey] || CHINESE_SENTENCES['c_l7'];
      currentQuestions = [...sList].sort(() => Math.random() - 0.5);
      document.getElementById('poolBadge').innerText = `句子重組：共 ${currentQuestions.length} 關`;
      renderUnscrambleQuestion();
    } else if (currentChineseMode === 'idiom') {
      document.getElementById('statusRow').style.display = 'flex';
      document.getElementById('typeBadge').innerText = "成語情境運用";
      const iList = CHINESE_IDIOMS[lKey] || CHINESE_IDIOMS['c_l7'];
      currentQuestions = [...iList].sort(() => Math.random() - 0.5);
      document.getElementById('poolBadge').innerText = `成語闖關：共 ${currentQuestions.length} 關`;
      renderIdiomQuestion();
    } else if (currentChineseMode === 'quiz') {
      document.getElementById('statusRow').style.display = 'flex';
      document.getElementById('typeBadge').innerText = "綜合測驗";
      document.getElementById('poolBadge').innerText = "課文與生字測驗";
      document.getElementById('qTitle').innerText = "課文生字理解：請依據課文回答正確選項。";
      document.getElementById('optionArea').innerHTML = `
        <div class="choice-list">
          <button class="choice-btn" onclick="checkStandardChoice(true)">A. 課文生字字形與讀音完全正確</button>
          <button class="choice-btn" onclick="checkStandardChoice(false)">B. 選項含有錯別字</button>
        </div>
      `;
    }
  }
}

// 1. 生字寶箱渲染
function renderChineseChest(lKey) {
  const charList = CHINESE_CHARACTERS[lKey] || CHINESE_CHARACTERS['c_l7'];
  const cur = charList[currentChestCharIndex] || charList[0];

  document.getElementById('qTitle').innerText = "📦 打開寶箱・認識本課生字與常用語詞";

  let html = `
    <div style="background:#fdf6ec; border:2px solid #fed7aa; border-radius:14px; padding:12px 18px; margin-bottom:16px; display:flex; align-items:center; gap:12px;">
      <span style="font-size:32px;">🤠</span>
      <span style="font-size:16px; font-weight:800; color:#9a3412;">點選下方任一個字卡，就能打開該生字的注音、部首與造詞！</span>
    </div>

    <div class="char-chest-display">
      <div class="char-big-font">${cur.char}</div>
      <div class="char-meta-info">
        <div><b>注音：</b><span style="color:#d97706; font-weight:800; font-size:18px;">${cur.zhuyin}</span></div>
        <div><b>部首：</b><span style="color:#2563eb; font-weight:800;">${cur.radical} 部</span></div>
        <div><b>筆畫：</b>${cur.strokes} 畫</div>
        <div><b>常用語詞：</b><span style="background:#eff6ff; color:#1e40af; padding:3px 8px; border-radius:6px; font-weight:700;">${cur.words}</span></div>
      </div>
    </div>

    <div class="char-tiles-grid">
  `;

  charList.forEach((it, idx) => {
    const isActive = (idx === currentChestCharIndex) ? "active" : "";
    html += `
      <div class="char-tile-btn ${isActive}" onclick="selectChestChar(${idx})">
        <div class="c-main">${it.char}</div>
        <div class="c-zy">${it.zhuyin}</div>
      </div>
    `;
  });

  html += `
    </div>
    <div style="text-align:center; margin-top:24px;">
      <button class="action-btn" style="background:#ea580c; font-size:16px; padding:12px 28px; border-radius:12px;" onclick="switchChineseMode('unscramble')">全部打開了，出發闖關挑戰！ ➔</button>
    </div>
  `;

  document.getElementById('optionArea').innerHTML = html;
}

function selectChestChar(idx) {
  currentChestCharIndex = idx;
  const lKey = currentLesson === 'all' ? 'c_l7' : currentLesson;
  renderChineseChest(lKey);
}

// 2. 句子重組積木機渲染
function renderUnscrambleQuestion() {
  const fb = document.getElementById('feedbackBox');
  fb.style.display = 'none';

  if (currentIndex >= currentQuestions.length) {
    document.getElementById('qTitle').innerText = `🎉 太棒了！你完成了本課所有句子重組積木挑戰！總得分：${score} 分`;
    document.getElementById('optionArea').innerHTML = `
      <div style="text-align:center; padding:20px;">
        <button class="next-btn" onclick="switchChineseMode('idiom')">進入下一個成語填空挑戰 ➔</button>
      </div>
    `;
    return;
  }

  unscrambleCurrent = currentQuestions[currentIndex];
  document.getElementById('progressText').innerText = `第 ${currentIndex + 1} / ${currentQuestions.length} 關`;
  document.getElementById('scoreText').innerText = `得分：${score}`;
  document.getElementById('qTitle').innerText = "把積木排成通順的句子！";

  unscrambleUserBlocks = [];
  unscrambleAvailableBlocks = [...unscrambleCurrent.blocks].sort(() => Math.random() - 0.5);

  renderUnscrambleDOM();
}

function renderUnscrambleDOM() {
  let targetHTML = `<div class="unscramble-target-box">`;
  if (unscrambleUserBlocks.length === 0) {
    targetHTML += `<span style="color:#94a3b8; font-weight:700; font-size:15px; margin:auto;">點下方的積木放到這裡</span>`;
  } else {
    unscrambleUserBlocks.forEach((text, idx) => {
      targetHTML += `<div class="word-block" onclick="removeUnscrambleBlock(${idx})">${text}</div>`;
    });
  }
  targetHTML += `</div>`;

  let sourceHTML = `<div class="unscramble-source-box">`;
  unscrambleAvailableBlocks.forEach((text) => {
    const isUsed = unscrambleUserBlocks.includes(text) ? "used" : "";
    sourceHTML += `<div class="word-block ${isUsed}" onclick="addUnscrambleBlock('${text}')">${text}</div>`;
  });
  sourceHTML += `</div>`;

  let actionsHTML = `
    <div class="unscramble-actions">
      <button class="unscramble-btn btn-reset-blocks" onclick="resetUnscrambleBlocks()">全部退回 ↺</button>
      <button class="unscramble-btn btn-submit-blocks" onclick="submitUnscramble()">送出檢查 ✔</button>
    </div>
  `;

  document.getElementById('optionArea').innerHTML = targetHTML + sourceHTML + actionsHTML;
}

function addUnscrambleBlock(text) {
  if (!unscrambleUserBlocks.includes(text)) {
    unscrambleUserBlocks.push(text);
    renderUnscrambleDOM();
  }
}

function removeUnscrambleBlock(idx) {
  unscrambleUserBlocks.splice(idx, 1);
  renderUnscrambleDOM();
}

function resetUnscrambleBlocks() {
  unscrambleUserBlocks = [];
  renderUnscrambleDOM();
}

function submitUnscramble() {
  const userSentence = unscrambleUserBlocks.join("");
  const target = unscrambleCurrent.target.replace(/\s+/g, '');
  const isCorrect = (userSentence === target);

  const fb = document.getElementById('feedbackBox');
  const fbTitle = document.getElementById('fbTitle');
  const fbDetail = document.getElementById('fbDetail');

  if (isCorrect) {
    score += 10;
    fb.className = "feedback-box correct";
    fbTitle.innerText = "🎯 太厲害了！句子完全通順正確！";
    fbDetail.innerText = `完整句子：${unscrambleCurrent.target}`;
  } else {
    fb.className = "feedback-box wrong";
    fbTitle.innerText = "💡 讀起來好像不太通順喔！再試一次看看：";
    fbDetail.innerText = `正確通順句子應該是：【${unscrambleCurrent.target}】`;
    recordWrong({ title: "句子重組：" + unscrambleCurrent.target, explain: unscrambleCurrent.target });
  }

  fb.style.display = 'block';
  document.querySelectorAll('.word-block, .unscramble-btn').forEach(b => b.style.pointerEvents = 'none');
}

// 3. 成語情境填空大卡片渲染
function renderIdiomQuestion() {
  const fb = document.getElementById('feedbackBox');
  fb.style.display = 'none';

  if (currentIndex >= currentQuestions.length) {
    document.getElementById('qTitle').innerText = `🎉 恭喜完成本組所有成語闖關！總得分：${score} 分`;
    document.getElementById('optionArea').innerHTML = `
      <div style="text-align:center; padding:20px;">
        <button class="next-btn" onclick="switchChineseMode('quiz')">進入課文綜合測驗 ➔</button>
      </div>
    `;
    return;
  }

  const q = currentQuestions[currentIndex];
  document.getElementById('progressText').innerText = `成語挑戰 ${currentIndex + 1} / ${currentQuestions.length}`;
  document.getElementById('scoreText').innerText = `得分：${score}`;

  const styledQ = q.q.replace(/_\?_/g, '<span style="color:#ef4444; border-bottom:3px solid #ef4444; font-weight:800; padding:0 4px;">？</span>');
  document.getElementById('qTitle').innerHTML = `
    <div style="font-size:14px; color:#d97706; font-weight:800; margin-bottom:8px;">哪一個成語放進句子最恰當？</div>
    <div style="font-size:20px; line-height:1.7;">${styledQ}</div>
  `;

  const correctText = q.options[q.ans];
  const shuffled = [...q.options].sort(() => Math.random() - 0.5);

  let html = `<div class="idiom-choice-list">`;
  shuffled.forEach(optText => {
    const safeText = encodeURIComponent(optText);
    const safeCorrect = encodeURIComponent(correctText);
    html += `<button class="idiom-btn" onclick="checkIdiom(decodeURIComponent('${safeText}'), decodeURIComponent('${safeCorrect}'))">${optText}</button>`;
  });
  html += `</div>`;

  document.getElementById('optionArea').innerHTML = html;
}

function checkIdiom(userChoice, correctText) {
  const q = currentQuestions[currentIndex];
  const isCorrect = (userChoice === correctText);

  const fb = document.getElementById('feedbackBox');
  const fbTitle = document.getElementById('fbTitle');
  const fbDetail = document.getElementById('fbDetail');

  if (isCorrect) {
    score += 10;
    fb.className = "feedback-box correct";
    fbTitle.innerText = `🎯 太棒了！選擇【${userChoice}】完全正確！`;
  } else {
    fb.className = "feedback-box wrong";
    fbTitle.innerText = `💡 差一點點！正確成語是【${correctText}】`;
    recordWrong({ title: q.q, explain: q.exp });
  }

  fbDetail.innerText = q.exp;
  fb.style.display = 'block';
  document.querySelectorAll('.idiom-btn').forEach(b => b.disabled = true);
}

function checkStandardChoice(isCorrect) {
  const fb = document.getElementById('feedbackBox');
  fb.className = isCorrect ? "feedback-box correct" : "feedback-box wrong";
  document.getElementById('fbTitle').innerText = isCorrect ? "🎯 回答正確！" : "💡 觀念需要再加強喔！";
  document.getElementById('fbDetail').innerText = "平時多閱讀課文生字注音與常用造詞，就能在大考拿滿分！";
  fb.style.display = 'block';
}

function recordWrong(q) {
  if (!wrongQuestions.some(item => item.title === q.title)) {
    wrongQuestions.push(q);
  }
}

function nextQuestion() {
  currentIndex++;
  if (currentChineseMode === 'unscramble') renderUnscrambleQuestion();
  else if (currentChineseMode === 'idiom') renderIdiomQuestion();
}

function openNotebook() {
  document.getElementById('mainPanel').style.display = 'none';
  document.getElementById('lessonBar').style.display = 'none';
  document.getElementById('chineseSubBar').style.display = 'none';
  document.getElementById('notebookPanel').style.display = 'block';

  const container = document.getElementById('wrongList');
  if (wrongQuestions.length === 0) {
    container.innerHTML = "<p style='color:#059669; font-weight:bold; padding:20px 0;'>太厲害了！目前沒有任何錯題喔！</p>";
    return;
  }

  let html = "";
  wrongQuestions.forEach((item, idx) => {
    html += `
      <div class="nb-card">
        <div style="font-size:12px; color:#2563eb; font-weight:bold;">錯題 ${idx+1}</div>
        <div style="font-weight:700; margin:6px 0;">${item.title}</div>
        <div style="font-size:13px; color:#dc2626; background:#fef2f2; padding:8px; border-radius:8px;">
          📌 解析：${item.explain}
        </div>
      </div>
    `;
  });
  container.innerHTML = html;
}

function closeNotebook() {
  document.getElementById('notebookPanel').style.display = 'none';
  document.getElementById('mainPanel').style.display = 'block';
  document.getElementById('lessonBar').style.display = 'flex';
  if (currentSubject === 'chinese') document.getElementById('chineseSubBar').style.display = 'flex';
}

window.onload = init;
</script>
