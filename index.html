<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaxy English 星際英語特訓</title>
<style>
  :root {
    --bg: #0b0f19;
    --card: #131b2e;
    --primary: #38bdf8;
    --success: #10b981;
    --danger: #ef4444;
    --text: #f8fafc;
    --sub: #94a3b8;
    --border: #243049;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 50% 10%, #172554 0%, var(--bg) 60%);
    color: var(--text);
    margin: 0; padding: 12px;
  }
  .container {
    max-width: 860px; margin: 0 auto;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 20px; overflow: hidden; padding: 20px;
  }
  header { text-align: center; margin-bottom: 20px; }
  header h1 { margin: 0 0 6px 0; font-size: 24px; color: var(--primary); }
  header p { margin: 0; font-size: 14px; color: var(--sub); }
  
  .nav-bar {
    display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto;
  }
  .nav-btn {
    flex: 1; min-width: 110px; padding: 10px; border-radius: 10px;
    border: 1px solid var(--border); background: #1e293b; color: var(--sub);
    font-size: 14px; font-weight: bold; cursor: pointer; text-align: center;
  }
  .nav-btn.active { background: #2563eb; color: #fff; border-color: var(--primary); }

  .ctrl-bar {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 20px;
  }
  select, .btn-action {
    padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: #1e293b; color: var(--text); font-size: 14px; font-weight: bold;
    cursor: pointer;
  }
  .btn-action { color: var(--primary); }

  .status-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 14px; font-weight: bold; }
  .q-card {
    background: #0f172a; border: 1px solid var(--border); border-radius: 14px;
    padding: 18px; margin-bottom: 16px; position: relative;
  }
  .q-title { font-size: 18px; font-weight: bold; margin: 0; line-height: 1.5; }
  .btn-audio {
    position: absolute; right: 14px; top: 14px; background: none; border: 1px solid var(--border);
    border-radius: 50%; color: var(--primary); width: 36px; height: 36px; cursor: pointer;
  }

  .choice-list { display: flex; flex-direction: column; gap: 10px; }
  .choice-btn {
    padding: 14px 18px; border: 1px solid var(--border); border-radius: 12px;
    background: #1e293b; color: var(--text); text-align: left; font-size: 16px;
    font-weight: bold; cursor: pointer;
  }
  .choice-btn.correct { background: rgba(16, 185, 129, 0.2) !important; border-color: var(--success) !important; color: #34d399 !important; }
  .choice-btn.wrong { background: rgba(239, 68, 68, 0.2) !important; border-color: var(--danger) !important; color: #f87171 !important; }

  .feedback {
    display: none; margin-top: 16px; padding: 14px; border-radius: 12px; font-size: 14px; line-height: 1.6;
  }
  .feedback.correct { background: rgba(16, 185, 129, 0.15); border: 1px solid var(--success); }
  .feedback.wrong { background: rgba(239, 68, 68, 0.15); border: 1px solid var(--danger); }
  .btn-next {
    display: block; width: 100%; margin-top: 12px; padding: 12px; border: none;
    border-radius: 10px; background: #2563eb; color: #fff; font-size: 15px; font-weight: bold; cursor: pointer;
  }

  /* 拼字面板 */
  .spell-box { display: none; text-align: center; }
  .spell-slots { display: flex; justify-content: center; gap: 6px; margin: 16px 0; }
  .slot {
    width: 40px; height: 48px; border: 2px solid var(--border); border-radius: 8px;
    background: #0f172a; color: var(--primary); font-size: 22px; font-weight: bold;
    display: flex; align-items: center; justify-content: center;
  }
  .keyboard { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; max-width: 480px; margin: 0 auto 14px auto; }
  .key { padding: 12px 0; background: #1e293b; border: 1px solid var(--border); border-radius: 8px; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; }
  .spell-actions { display: flex; gap: 10px; max-width: 480px; margin: 0 auto; }
  .btn-del { flex: 1; padding: 10px; background: #dc2626; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
  .btn-sub { flex: 1; padding: 10px; background: #16a34a; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>🚀 GALAXY ENGLISH 星際美語特訓</h1>
    <p>國小三年級專屬・全真試題與拼字系統</p>
  </header>

  <div class="nav-bar">
    <button class="nav-btn active" onclick="setMode('quiz')">🪐 單元特訓</button>
    <button class="nav-btn" onclick="setMode('spell')">⌨️ 星際拼字機</button>
    <button class="nav-btn" onclick="setMode('traps')">⚠️ 易錯陷阱題</button>
  </div>

  <div class="ctrl-bar" id="ctrlBar">
    <label for="unitSelect" style="color:var(--sub); font-size:13px;">單元：</label>
    <select id="unitSelect" onchange="onUnitChange()">
      <option value="all">🔥 全範圍大考綜合</option>
      <option value="u1">Unit 1: How Old Are You? (年齡與數字)</option>
      <option value="u2">Unit 2: What's This? (文具與冠詞 a/an)</option>
      <option value="u3">Unit 3: What Color Is It? (顏色問答)</option>
      <option value="u4">Unit 4: Halloween (萬聖節與綜合)</option>
    </select>
    <button class="btn-action" onclick="loadQuiz()">🎲 換一批題目</button>
    <span id="poolBadge" style="margin-left:auto; font-size:12px; color:var(--sub);"></span>
  </div>

  <!-- 答題卡面板 -->
  <div id="quizPanel">
    <div class="status-row">
      <span id="progressText" style="color:var(--sub);">第 1 / 10 題</span>
      <span id="scoreText" style="color:var(--success);">得分：0</span>
    </div>
    <div class="q-card">
      <button class="btn-audio" onclick="speakCurrent()">🔊</button>
      <p class="q-title" id="qTitle">題目載入中...</p>
    </div>
    <div class="choice-list" id="choiceList"></div>
    <div class="feedback" id="feedback">
      <div id="fbTitle" style="font-weight:bold; margin-bottom:4px;"></div>
      <div id="fbDetail"></div>
      <button class="btn-next" onclick="nextQuestion()">下一題 ➔</button>
    </div>
  </div>

  <!-- 拼字面板 -->
  <div class="spell-box" id="spellPanel">
    <div class="status-row">
      <span id="spellProgress" style="color:var(--sub);">第 1 / 10 關</span>
      <span id="spellScore" style="color:var(--success);">得分：0</span>
    </div>
    <div class="q-card">
      <button class="btn-audio" onclick="speakSpellWord()">🔊</button>
      <p class="q-title" id="spellHint">請拼出單字</p>
    </div>
    <div class="spell-slots" id="spellSlots"></div>
    <div class="keyboard" id="keyboard"></div>
    <div class="spell-actions">
      <button class="btn-del" onclick="deleteSpellLetter()">⌫ 刪除</button>
      <button class="btn-sub" onclick="submitSpell()">✔ 送出檢查</button>
    </div>
    <div class="feedback" id="spellFeedback">
      <div id="spellFbTitle" style="font-weight:bold; margin-bottom:4px;"></div>
      <div id="spellFbDetail"></div>
      <button class="btn-next" onclick="nextSpell()">下一字 ➔</button>
    </div>
  </div>
</div>

<script>
const QUESTIONS = [
  // Unit 1
  { u: "u1", title: "A: ________ are you?  B: I'm ten years old.", opts: ["How old", "What", "How", "Who"], ans: 0, exp: "詢問年齡使用 How old are you?；How are you 是問候你好嗎。" },
  { u: "u1", title: "A: How old are you?  B: I am ________.", opts: ["eight", "an eraser", "red", "book"], ans: 0, exp: "詢問年齡應回答數字（eight）。" },
  { u: "u1", title: "數字『8』的正確英文拼寫為何？", opts: ["eight", "eigt", "eiht", "eaight"], ans: 0, exp: "8 的正確拼法是 eight，gh 不發音。" },
  { u: "u1", title: "數字『9』的正確英文拼寫為何？", opts: ["nine", "nin", "nein", "nien"], ans: 0, exp: "9 的正確拼法是 nine，末尾有不發音的 e。" },
  { u: "u1", title: "A: Thank you!  B: ________", opts: ["You're welcome.", "I'm ten.", "Good job!", "It's red."], ans: 0, exp: "道謝回答禮貌用語為 You're welcome (不客氣)。" },
  { u: "u1", title: "『How are you?』是用來詢問對方的年齡有幾歲。", opts: ["❌ 錯誤", "⭕ 正確"], ans: 0, exp: "How are you 是『你好嗎』，問年齡需使用 How old are you。" },

  // Unit 2
  { u: "u2", title: "A: What's this?  B: It's ________ eraser.", opts: ["an", "a", "two", "the one"], ans: 0, exp: "eraser 為母音開頭發音，單數冠詞使用 an。" },
  { u: "u2", title: "A: What's that?  B: It's ________ ruler.", opts: ["a", "an", "two", "some"], ans: 0, exp: "ruler 為子音開頭發音，單數冠詞使用 a。" },
  { u: "u2", title: "單字『p-e-n-c-i-l』是指哪一種文具？", opts: ["鉛筆", "原子筆", "橡皮擦", "直尺"], ans: 0, exp: "pencil 是鉛筆，pen 是原子筆。" },
  { u: "u2", title: "橡皮擦的英文是『a eraser』。", opts: ["❌ 錯誤", "⭕ 正確"], ans: 0, exp: "母音開頭單字單數冠詞必須使用 an (an eraser)。" },
  { u: "u2", title: "想稱讚同學『做得好！』可以說：", opts: ["Good job!", "I'm sorry.", "What's this?", "How are you?"], ans: 0, exp: "稱讚表現使用 Good job!" },

  // Unit 3
  { u: "u3", title: "A: What ________ is it?  B: It's blue.", opts: ["color", "old", "name", "this"], ans: 0, exp: "詢問顏色使用句型 What color is it?" },
  { u: "u3", title: "A: What color is the book?  B: It's ________.", opts: ["red", "a red", "an red", "two red"], ans: 0, exp: "顏色為形容詞，直接說 It's red，不可加冠詞 a/an。" },
  { u: "u3", title: "黃色 (Yellow) 加上藍色 (Blue) 會混合成什麼顏色？", opts: ["green (綠色)", "red (紅色)", "black (黑色)", "white (白色)"], ans: 0, exp: "黃色加藍色混合為綠色 (Green)。" },
  { u: "u3", title: "『這顆蘋果是紅色的』可以說成『The apple is a red.』", opts: ["❌ 錯誤", "⭕ 正確"], ans: 0, exp: "形容詞前不能加冠詞 a，應為 The apple is red。" },

  // Unit 4
  { u: "u4", title: "萬聖節討糖時說的『不給糖就搗蛋』英文是：", opts: ["Trick or treat!", "Happy Birthday!", "Good job!", "Thank you!"], ans: 0, exp: "Trick or treat! 為萬聖節經典用語。" },
  { u: "u4", title: "萬聖節的『南瓜』英文單字是：", opts: ["a pumpkin", "a ghost", "a bat", "a witch"], ans: 0, exp: "pumpkin 是南瓜，ghost 是鬼魂，bat 是蝙蝠，witch 是女巫。" },
  { u: "u4", title: "騎掃帚的『女巫』英文是：", opts: ["a witch", "a vampire", "a spider", "a ghost"], ans: 0, exp: "witch 是女巫。" },
  { u: "u4", title: "在夜空中飛行的『蝙蝠』英文是：", opts: ["a bat", "a cat", "a rat", "a hat"], ans: 0, exp: "bat 是蝙蝠。" }
];

const SPELL_DATA = [
  { w: "RULER", h: "直尺" },
  { w: "ERASER", h: "橡皮擦" },
  { w: "PENCIL", h: "鉛筆" },
  { w: "BOOK", h: "書本" },
  { w: "EIGHT", h: "數字 8" },
  { w: "NINE", h: "數字 9" },
  { w: "BLUE", h: "藍色" },
  { w: "GREEN", h: "綠色" },
  { w: "PUMPKIN", h: "南瓜" },
  { w: "WITCH", h: "女巫" }
];

let curMode = 'quiz';
let curList = [];
let curIdx = 0;
let curScore = 0;

let curSpellTarget = "";
let curSpellInput = "";
let spellIdx = 0;
let spellScoreVal = 0;

function init() {
  renderKeyboard();
  loadQuiz();
}

function setMode(m) {
  curMode = m;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  const btn = document.querySelector(`.nav-btn[onclick*="${m}"]`);
  if (btn) btn.classList.add('active');

  document.getElementById('ctrlBar').style.display = (m === 'spell') ? 'none' : 'flex';
  document.getElementById('quizPanel').style.display = (m === 'spell') ? 'none' : 'block';
  document.getElementById('spellPanel').style.display = (m === 'spell') ? 'block' : 'none';

  if (m === 'spell') {
    startSpell();
  } else {
    loadQuiz();
  }
}

function onUnitChange() { loadQuiz(); }

function loadQuiz() {
  const u = document.getElementById('unitSelect').value;
  let pool = (u === 'all') ? [...QUESTIONS] : QUESTIONS.filter(q => q.u === u);
  if (curMode === 'traps') {
    pool = pool.filter(q => q.exp.includes('不可') || q.exp.includes('需使用') || q.title.includes('錯誤'));
  }
  pool.sort(() => Math.random() - 0.5);
  curList = pool.slice(0, 10);
  curIdx = 0;
  curScore = 0;

  document.getElementById('poolBadge').innerText = `題庫量：${pool.length} 題`;
  renderQuestion();
}

function renderQuestion() {
  document.getElementById('feedback').style.display = 'none';
  if (curIdx >= curList.length) {
    document.getElementById('qTitle').innerText = `🎉 練習完成！總分：${curScore} 分`;
    document.getElementById('choiceList').innerHTML = `<button class="choice-btn" onclick="loadQuiz()">🎲 換一套新題目繼續練習</button>`;
    return;
  }
  const q = curList[curIdx];
  document.getElementById('progressText').innerText = `第 ${curIdx + 1} / ${curList.length} 題`;
  document.getElementById('scoreText').innerText = `得分：${curScore}`;
  document.getElementById('qTitle').innerText = q.title;

  let html = '';
  q.opts.forEach((opt, i) => {
    html += `<button class="choice-btn" id="opt_${i}" onclick="checkAns(${i})">${opt}</button>`;
  });
  document.getElementById('choiceList').innerHTML = html;
}

function checkAns(choice) {
  const q = curList[curIdx];
  const isCorrect = (choice === q.ans);
  document.querySelectorAll('.choice-btn').forEach((b, i) => {
    b.disabled = true;
    if (i === q.ans) b.classList.add('correct');
    else if (i === choice && !isCorrect) b.classList.add('wrong');
  });

  if (isCorrect) curScore += 10;
  document.getElementById('scoreText').innerText = `得分：${curScore}`;

  const fb = document.getElementById('feedback');
  fb.className = `feedback ${isCorrect ? 'correct' : 'wrong'}`;
  document.getElementById('fbTitle').innerText = isCorrect ? '🎉 回答完全正確！(+10分)' : `❌ 答錯了！正確答案是：${q.opts[q.ans]}`;
  document.getElementById('fbDetail').innerText = q.exp;
  fb.style.display = 'block';
}

function nextQuestion() {
  curIdx++;
  renderQuestion();
}

function speakCurrent() {
  if (curList[curIdx]) speak(curList[curIdx].title);
}

// 拼字邏輯
function startSpell() {
  spellIdx = 0;
  spellScoreVal = 0;
  renderSpell();
}

function renderSpell() {
  document.getElementById('spellFeedback').style.display = 'none';
  if (spellIdx >= SPELL_DATA.length) {
    document.getElementById('spellHint').innerText = `🏆 拼字完成！得分：${spellScoreVal} 分`;
    document.getElementById('spellSlots').innerHTML = '';
    return;
  }
  const item = SPELL_DATA[spellIdx];
  curSpellTarget = item.w;
  curSpellInput = '';
  document.getElementById('spellProgress').innerText = `第 ${spellIdx + 1} / ${SPELL_DATA.length} 關`;
  document.getElementById('spellScore').innerText = `得分：${spellScoreVal}`;
  document.getElementById('spellHint').innerText = `請拼出單字：【${item.h}】`;

  updateSlots();
  document.querySelectorAll('.key, .btn-del, .btn-sub').forEach(b => b.disabled = false);
}

function updateSlots() {
  let html = '';
  for (let i = 0; i < curSpellTarget.length; i++) {
    html += `<div class="slot">${curSpellInput[i] || ''}</div>`;
  }
  document.getElementById('spellSlots').innerHTML = html;
}

function renderKeyboard() {
  const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split('');
  let html = '';
  letters.forEach(l => {
    html += `<button class="key" onclick="pressLetter('${l}')">${l}</button>`;
  });
  document.getElementById('keyboard').innerHTML = html;
}

function pressLetter(l) {
  if (curSpellInput.length < curSpellTarget.length) {
    curSpellInput += l;
    updateSlots();
  }
}

function deleteSpellLetter() {
  if (curSpellInput.length > 0) {
    curSpellInput = curSpellInput.slice(0, -1);
    updateSlots();
  }
}

function submitSpell() {
  if (curSpellInput.length < curSpellTarget.length) return;
  const isCorrect = (curSpellInput === curSpellTarget);
  if (isCorrect) {
    spellScoreVal += 10;
    speak(curSpellTarget);
  }
  document.getElementById('spellScore').innerText = `得分：${spellScoreVal}`;
  const fb = document.getElementById('spellFeedback');
  fb.className = `feedback ${isCorrect ? 'correct' : 'wrong'}`;
  document.getElementById('spellFbTitle').innerText = isCorrect ? '🎉 拼寫正確！' : `❌ 拼錯了！正確拼法為：${curSpellTarget}`;
  document.getElementById('spellFbDetail').innerText = `單字中文：${SPELL_DATA[spellIdx].h}`;
  fb.style.display = 'block';
  document.querySelectorAll('.key, .btn-del, .btn-sub').forEach(b => b.disabled = true);
}

function nextSpell() {
  spellIdx++;
  renderSpell();
}

function speakSpellWord() { speak(curSpellTarget); }

function speak(txt) {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const clean = txt.replace(/[_]/g, ' ').replace(/[\u4e00-\u9fa5]/g, '').trim();
    const u = new SpeechSynthesisUtterance(clean || txt);
    u.lang = 'en-US';
    u.rate = 0.9;
    window.speechSynthesis.speak(u);
  }
}

window.onload = init;
</script>
</body>
</html>
