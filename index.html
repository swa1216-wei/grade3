<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Galaxy Mario Odyssey・星際冒險英語學習系統 (國小三年級專屬)</title>
<style>
  :root {
    --bg-dark: #070a14;
    --card-bg: rgba(15, 23, 42, 0.94);
    --primary: #38bdf8;
    --primary-glow: rgba(56, 189, 248, 0.35);
    --accent-gold: #fbbf24;
    --accent-purple: #a855f7;
    --accent-red: #f43f5e;
    --accent-green: #10b981;
    --text-main: #f8fafc;
    --text-sub: #94a3b8;
    --border: #22304a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
    font-weight: 400;
    line-height: 1.6;
    letter-spacing: 0.5px;
    background: radial-gradient(circle at 50% 12%, #1e1b4b 0%, #0f172a 45%, var(--bg-dark) 85%);
    color: var(--text-main);
    margin: 0;
    padding: 8px;
    min-height: 100vh;
    overflow-x: hidden;
  }
  .game-container {
    max-width: 1040px;
    margin: 0 auto;
    background: var(--card-bg);
    border: 1.5px solid rgba(56, 189, 248, 0.28);
    border-radius: 24px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 35px var(--primary-glow);
    overflow: hidden;
    backdrop-filter: blur(16px);
    position: relative;
  }

  /* 頂部 HUD (Heads-Up Display) */
  .game-header {
    background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
    padding: 10px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1.5px solid var(--border);
    flex-wrap: wrap;
    gap: 8px;
  }
  .hud-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .hud-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 13.5px;
    font-weight: 500;
    padding: 3px 10px;
    border-radius: 14px;
    background: rgba(30, 41, 59, 0.8);
    border: 1px solid var(--border);
  }
  .hud-hearts { color: #f43f5e; letter-spacing: 2px; font-size: 15px; }
  .hud-coins { color: var(--accent-gold); border-color: rgba(251, 191, 36, 0.35); }
  .hud-score { color: var(--primary); border-color: rgba(56, 189, 248, 0.35); }
  .btn-hud {
    padding: 6px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #1e293b;
    color: var(--text-main);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .btn-hud:hover { background: #334155; transform: translateY(-1px); }

  /* 🌌 瑪利歐風格星空大地圖 (Canvas + SVG S-Trail) */
  .map-wrapper {
    position: relative;
    width: 100%;
    min-height: 640px;
    background-color: #030712;
    background-image: url('assets/map_bg.jfif'), url('assets/map_bg.png'), url('assets/map_bg.jpg');
    background-size: cover;
    background-position: center;
    overflow: hidden;
    padding: 20px 10px;
  }
  .map-svg-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 1;
  }
  .map-node-container {
    position: relative;
    width: 100%;
    height: 600px;
    z-index: 2;
  }
  .stage-pin {
    position: absolute;
    width: 72px;
    height: 72px;
    transform: translate(-50%, -50%);
    cursor: pointer;
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 5;
  }
  .stage-pin:hover { transform: translate(-50%, -50%) scale(1.15); }
  .pin-orb {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #38bdf8, #1e3a8a);
    border: 2.5px solid #fff;
    box-shadow: 0 0 18px rgba(56, 189, 248, 0.8), inset 0 -3px 6px rgba(0, 0, 0, 0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    position: relative;
  }
  .pin-label {
    margin-top: 4px;
    background: rgba(15, 23, 42, 0.85);
    border: 1px solid var(--border);
    padding: 2px 7px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
    color: #fff;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
  }
  .pin-stars {
    font-size: 10px;
    color: var(--accent-gold);
    letter-spacing: 1px;
  }

  /* 👾 瑪利歐走步主角圖標 (Animated Walking Pin) */
  .hero-walker {
    position: absolute;
    width: 56px;
    height: 56px;
    transform: translate(-50%, -85%);
    pointer-events: none;
    z-index: 10;
    transition: left 0.6s cubic-bezier(0.25, 1, 0.5, 1), top 0.6s cubic-bezier(0.25, 1, 0.5, 1);
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.8));
    animation: walkerBob 0.6s infinite alternate ease-in-out;
  }
  .hero-walker img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
    border: 2px solid #fff;
  }
  @keyframes walkerBob {
    from { transform: translate(-50%, -85%); }
    to { transform: translate(-50%, -95%); }
  }

  /* 🚀 戰鬥與關卡任務大廳 (Battle Stage View) */
  .stage-view {
    display: none;
    padding: 18px;
    animation: fadeIn 0.2s ease-in;
  }
  .stage-nav-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .layer-tabs {
    display: flex;
    gap: 6px;
    background: #0f172a;
    padding: 4px;
    border-radius: 12px;
    border: 1px solid var(--border);
    overflow-x: auto;
  }
  .layer-btn {
    padding: 7px 13px;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: var(--text-sub);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .layer-btn.active {
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    color: white;
    font-weight: 600;
    box-shadow: 0 2px 8px rgba(59, 130, 246, 0.4);
  }

  /* 👾 戰鬥舞台 (Battle Arena) */
  .battle-arena {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: radial-gradient(circle at 50% 50%, #1e293b, #0f172a);
    border: 1.5px solid var(--border);
    border-radius: 18px;
    padding: 16px 20px;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }
  .hero-trio-box {
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .hero-slot {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }
  .hero-avatar-circle {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: 2px solid #38bdf8;
    overflow: hidden;
    background: #0f172a;
    box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
    position: relative;
    transition: transform 0.15s;
  }
  .hero-avatar-circle img { width: 100%; height: 100%; object-fit: cover; }
  .hero-slot.active .hero-avatar-circle {
    transform: scale(1.12);
    border-color: var(--accent-gold);
    box-shadow: 0 0 16px rgba(251, 191, 36, 0.6);
  }
  .hero-role-tag {
    font-size: 11px;
    font-weight: 600;
    margin-top: 3px;
    padding: 1px 6px;
    border-radius: 6px;
    background: #1e293b;
    border: 1px solid var(--border);
  }
  .pet-companion-box {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(30, 41, 59, 0.6);
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 12px;
  }
  .pet-thumb { width: 34px; height: 34px; border-radius: 50%; overflow: hidden; border: 1.5px solid #10b981; }
  .pet-thumb img { width: 100%; height: 100%; object-fit: cover; }

  /* 怪獸展示區 */
  .monster-stage-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }
  .monster-sprite {
    width: 100px;
    height: 100px;
    position: relative;
    transition: transform 0.15s;
  }
  .monster-sprite img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 0 12px rgba(244, 63, 94, 0.4));
  }
  .monster-sprite.hit { animation: monsterShake 0.3s ease-in-out; }
  @keyframes monsterShake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px); filter: brightness(1.5) drop-shadow(0 0 20px #f43f5e); }
    75% { transform: translateX(8px); }
  }
  .monster-hp-shell {
    width: 130px;
    height: 10px;
    background: #1e293b;
    border: 1px solid #475569;
    border-radius: 5px;
    overflow: hidden;
    margin-top: 6px;
  }
  .monster-hp-bar {
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, #10b981, #f59e0b, #ef4444);
    transition: width 0.3s ease-out;
  }
  .damage-popup {
    position: absolute;
    top: -15px;
    font-size: 24px;
    font-weight: 800;
    color: #fbbf24;
    text-shadow: 0 0 8px rgba(0,0,0,0.9);
    pointer-events: none;
    animation: floatUp 0.8s forwards ease-out;
  }
  @keyframes floatUp {
    0% { opacity: 0; transform: translateY(10px) scale(0.8); }
    30% { opacity: 1; transform: translateY(-10px) scale(1.2); }
    100% { opacity: 0; transform: translateY(-35px) scale(1); }
  }

  /* 題型卡片容器 */
  .q-card-box {
    background: #131b2e;
    border: 1.5px solid var(--border);
    border-radius: 18px;
    padding: 18px 20px;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.3);
    position: relative;
  }
  .q-title-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
  }
  .q-title-text {
    font-size: 18px;
    font-weight: 600;
    line-height: 1.6;
    margin: 0;
    color: #ffffff;
    white-space: pre-line;
  }
  .btn-audio {
    width: 38px;
    height: 38px;
    min-width: 38px;
    border-radius: 50%;
    border: 1px solid rgba(56, 189, 248, 0.4);
    background: rgba(56, 189, 248, 0.15);
    color: var(--primary);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    margin-left: 10px;
  }
  .btn-audio:hover { background: var(--primary); color: #0f172a; transform: scale(1.08); }

  /* 題型 1: 三張橫向大圓角卡片 */
  .choice3-stack { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
  .choice3-btn {
    padding: 14px 18px;
    border: 1.5px solid var(--border);
    border-radius: 14px;
    background: #1e293b;
    color: var(--text-main);
    text-align: left;
    font-size: 17px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }
  .choice3-btn:hover { background: #334155; border-color: var(--primary); transform: translateX(3px); }
  .choice3-btn.c {
    border-color: var(--accent-green) !important;
    background: rgba(16, 185, 129, 0.22) !important;
    color: #6ee7b7 !important;
    font-weight: 600 !important;
  }
  .choice3-btn.w {
    border-color: var(--accent-red) !important;
    background: rgba(244, 63, 94, 0.22) !important;
    color: #fca5a5 !important;
    font-weight: 600 !important;
  }

  /* 題型 2: 是非題雙圓鍵 (⭕ / ❌) */
  .tf-duo-box { display: flex; gap: 14px; margin-top: 14px; }
  .tf-duo-btn {
    flex: 1;
    padding: 15px;
    border-radius: 14px;
    border: 1.5px solid var(--border);
    background: #1e293b;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
  }
  .tf-duo-btn.o { color: #34d399; }
  .tf-duo-btn.x { color: #f87171; }
  .tf-duo-btn:hover { background: #334155; transform: translateY(-2px); }
  .tf-duo-btn.c { border-color: var(--accent-green) !important; background: rgba(16, 185, 129, 0.22) !important; }
  .tf-duo-btn.w { border-color: var(--accent-red) !important; background: rgba(244, 63, 94, 0.22) !important; }

  /* 題型 3: 句子積木架橋 (雙向點擊) */
  .bridge-deck {
    background: #0f172a;
    border: 2px dashed rgba(56, 189, 248, 0.35);
    border-radius: 14px;
    padding: 14px;
    margin: 14px 0;
    min-height: 64px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    justify-content: center;
  }
  .word-token {
    padding: 8px 14px;
    border-radius: 10px;
    border: 1.5px solid #38bdf8;
    background: linear-gradient(135deg, #1e293b, #334155);
    color: #ffffff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
    transition: all 0.15s;
  }
  .word-token:hover { transform: scale(1.04); border-color: var(--accent-gold); }
  .word-token.used { opacity: 0.2; pointer-events: none; border-color: #64748b; }
  .token-rack {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin: 12px 0;
  }

  /* 題型 4: 26 鍵星際拼字機 (小寫預設 + ⇧ Shift) */
  .spell-deck {
    background: #0f172a;
    border: 1.5px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    text-align: center;
  }
  .spell-slots-row {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin: 12px 0;
    min-height: 46px;
    flex-wrap: wrap;
  }
  .spell-slot {
    width: 38px;
    height: 46px;
    border: 1.5px solid rgba(56, 189, 248, 0.45);
    border-radius: 8px;
    background: #1e293b;
    color: var(--primary);
    font-size: 22px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .spell-slot.filled { border-color: #38bdf8; background: #0f172a; color: #fff; }
  .keypad-grid-26 {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
    max-width: 500px;
    margin: 0 auto 10px auto;
  }
  .key-pad-btn {
    padding: 10px 0;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #1e293b;
    color: #ffffff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.1s;
  }
  .key-pad-btn:active { transform: scale(0.92); }
  .key-pad-btn.shift-on {
    background: #2563eb;
    border-color: #60a5fa;
    color: #fff;
    box-shadow: 0 0 8px rgba(37, 99, 235, 0.5);
  }

  /* 題型 5: 3×4 數字小鍵盤 (售票亭/借書證) */
  .numpad-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    max-width: 260px;
    margin: 12px auto;
  }
  .num-btn {
    padding: 12px 0;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    background: #1e293b;
    color: #fff;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
  }
  .num-btn:hover { background: #334155; border-color: var(--primary); }

  /* 詳解回饋橫幅 */
  .feedback-box {
    margin-top: 14px;
    padding: 14px 18px;
    border-radius: 12px;
    display: none;
    animation: fadeIn 0.2s ease-in;
  }
  .feedback-box.c { background: rgba(16, 185, 129, 0.16); border: 1.5px solid var(--accent-green); color: #ecfdf5; }
  .feedback-box.w { background: rgba(244, 63, 94, 0.16); border: 1.5px solid var(--accent-red); color: #fef2f2; }
  .fb-title { font-size: 16.5px; font-weight: 700; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
  .fb-body { font-size: 14px; line-height: 1.6; color: #e2e8f0; }
  .fb-trap-tag {
    display: inline-block;
    background: rgba(251, 191, 36, 0.18);
    color: var(--accent-gold);
    border: 1px solid rgba(251, 191, 36, 0.35);
    padding: 2px 7px;
    border-radius: 5px;
    font-weight: 600;
    margin-top: 4px;
    font-size: 12.5px;
  }

  /* 🌙 月球秘密基地彈窗 */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.88);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 14px;
    backdrop-filter: blur(8px);
  }
  .modal-card {
    background: #0f172a;
    border: 2px solid #38bdf8;
    border-radius: 20px;
    max-width: 660px;
    width: 100%;
    max-height: 88vh;
    overflow-y: auto;
    padding: 20px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9), 0 0 35px var(--primary-glow);
    position: relative;
  }
  .modal-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
    flex-wrap: wrap;
  }
  .mtab-btn {
    padding: 6px 12px;
    border-radius: 8px;
    border: none;
    background: #1e293b;
    color: var(--text-sub);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
  }
  .mtab-btn.active { background: #2563eb; color: #fff; font-weight: 600; }

  /* 👾 掉落塔防 */
  .defense-board {
    background: #020617;
    border: 2px solid #334155;
    border-radius: 14px;
    height: 360px;
    position: relative;
    overflow: hidden;
    margin-bottom: 10px;
  }
  .defense-block {
    position: absolute;
    padding: 5px 12px;
    background: linear-gradient(135deg, #1e293b, #334155);
    border: 1.5px solid #38bdf8;
    border-radius: 6px;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    box-shadow: 0 0 8px rgba(56, 189, 248, 0.35);
  }
  .defense-ceiling-line {
    position: absolute;
    top: 55px;
    left: 0; right: 0;
    border-top: 2px dashed #f43f5e;
    pointer-events: none;
  }
  .defense-ceiling-label {
    position: absolute;
    top: 38px;
    right: 10px;
    color: #f43f5e;
    font-size: 11px;
    font-weight: 700;
  }

  /* 🎰 星際扭蛋機 */
  .gacha-box {
    text-align: center;
    padding: 16px 0;
  }
  .gacha-pod {
    width: 110px;
    height: 110px;
    margin: 0 auto 12px auto;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fbbf24, #d97706);
    border: 3px solid #fff;
    box-shadow: 0 0 25px rgba(251, 191, 36, 0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 46px;
    transition: transform 0.2s;
  }
  .gacha-pod.spinning {
    animation: gachaSpin 0.6s infinite ease-in-out;
  }
  @keyframes gachaSpin {
    0% { transform: rotate(0deg) scale(1); }
    50% { transform: rotate(180deg) scale(1.15); }
    100% { transform: rotate(360deg) scale(1); }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="game-container">
  <!-- 頂部 HUD (Heads-Up Display) -->
  <div class="game-header">
    <div class="hud-group">
      <div class="hud-badge"><span class="hud-hearts" id="hudHearts">❤️❤️❤️</span></div>
      <div class="hud-badge hud-coins"><span>🪙</span> <span id="hudCoins">0</span></div>
      <div class="hud-badge hud-score"><span>⭐</span> <span id="hudScore">0</span></div>
      <div class="hud-badge" style="color:#a855f7;"><span>Lv.</span><span id="hudLevel">1</span> <span id="hudTitle">見習者</span></div>
    </div>
    <div class="hud-group">

// 1. 純 Web Audio API 8-Bit 遊戲音效引擎
// ==============================================================
const AudioEngine = {
  ctx: null,
  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
  },
  playTone(freq, type, duration) {
    try {
      this.init();
      if (!this.ctx) return;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
      gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + duration);
    } catch (e) {}
  },
  playJump() {
    try {
      this.init();
      if (!this.ctx) return;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(160, this.ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(460, this.ctx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.15);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.15);
    } catch (e) {}
  },
  playAttack() {
    this.playTone(420, 'sawtooth', 0.08);
    setTimeout(() => this.playTone(280, 'sawtooth', 0.12), 60);
  },
  playCoin() {
    this.playTone(987.77, 'sine', 0.08);
    setTimeout(() => this.playTone(1318.51, 'sine', 0.16), 80);
  },
  playCorrect() {
    this.playTone(523.25, 'triangle', 0.1);
    setTimeout(() => this.playTone(659.25, 'triangle', 0.1), 85);
    setTimeout(() => this.playTone(783.99, 'triangle', 0.2), 170);
  },
  playWrong() {
    this.playTone(180, 'sawtooth', 0.12);
    setTimeout(() => this.playTone(130, 'sawtooth', 0.22), 100);
  },
  playFanfare() {
    [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
      setTimeout(() => this.playTone(freq, 'triangle', 0.18), idx * 100);
    });
  }
};

// 4. 初始化與大地圖渲染 (Mario Overworld Map)
// ==============================================================
function init() {
  renderHUD();
  renderMarioMap();
}

function renderHUD() {
  let hearts = '';
  for (let i = 0; i < 3; i++) hearts += (i < gameState.lives) ? '❤️' : '🖤';
  document.getElementById('hudHearts').innerText = hearts;
  document.getElementById('hudCoins').innerText = gameState.coins;
  document.getElementById('hudScore').innerText = gameState.score;
  document.getElementById('hudLevel').innerText = gameState.level;

  let title = '見習者';
  if (gameState.level >= 10) title = '銀河守護神';
  else if (gameState.level >= 5) title = '星際勇者';
  document.getElementById('hudTitle').innerText = title;
}

function renderMarioMap() {
  const container = document.getElementById('mapNodes');
  let html = '';

  STAGES_DATA.forEach((stg, idx) => {
    html += `
      <div class="stage-pin" style="left:${stg.x}%; top:${stg.y}%;" onclick="walkHeroToStage(${idx})">
        <div class="pin-orb" style="border-color:${idx === gameState.currentStageIndex ? '#fbbf24' : '#fff'};">
          ${stg.stage === 99 ? '🌙' : (stg.stage === 6 ? '👑' : '⭐')}
        </div>
        <div class="pin-label">${stg.name.split('·')[0]}</div>
        <div class="pin-stars">⭐⭐⭐</div>
      </div>
    `;
  });

  container.innerHTML = html;
  updateWalkerPosition(gameState.currentStageIndex);
}

function updateWalkerPosition(stageIdx) {
  const walker = document.getElementById('heroWalker');
  const target = STAGES_DATA[stageIdx];
  if (walker && target) {
    walker.style.left = target.x + '%';
    walker.style.top = target.y + '%';
  }
}

function walkHeroToStage(stageIdx) {
  AudioEngine.playJump();
  gameState.currentStageIndex = stageIdx;
  updateWalkerPosition(stageIdx);

  setTimeout(() => {
    enterStage(stageIdx);
  }, 450);
}

function enterStage(stageIdx) {
  document.getElementById('mapView').style.display = 'none';
  document.getElementById('stageView').style.display = 'block';
  document.getElementById('btnBackToMap').style.display = 'inline-flex';

  const stg = STAGES_DATA[stageIdx];
  document.getElementById('stgPlanetTag').innerText = stg.planet;
  document.getElementById('stgTitleText').innerText = stg.name;

  // 設定怪物血量
  gameState.monsterMaxHp = stg.bossHp;
  gameState.monsterCurHp = stg.bossHp;
  updateMonsterHp();

  const mImg = document.getElementById('monsterImg');
  if (mImg) mImg.src = stg.boss;
  document.getElementById('monsterNameTxt').innerText = stg.bossName;

  switchStageLayer('handsOn');
}

function returnToMap() {
  AudioEngine.playJump();
  document.getElementById('stageView').style.display = 'none';
  document.getElementById('mapView').style.display = 'block';
  document.getElementById('btnBackToMap').style.display = 'none';
}

// ==============================================================
// 5. 學習層次切換與題型控制器
// ==============================================================
function switchStageLayer(layer) {
  AudioEngine.playTone(400, 'sine', 0.04);
  gameState.currentLayer = layer;
  gameState.currentQuestionIndex = 0;

  document.querySelectorAll('.layer-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById(`lbtn_${layer}`);
  if (btn) btn.classList.add('active');

  renderCurrentQuestion();
}

function renderCurrentQuestion() {
  const stg = STAGES_DATA[gameState.currentStageIndex];
  const list = stg.layers[gameState.currentLayer] || [];
  const container = document.getElementById('qCardContainer');

  if (gameState.currentQuestionIndex >= list.length) {
    AudioEngine.playFanfare();
    container.innerHTML = `
      <div style="text-align:center; padding:24px;">
        <h3 style="color:#34d399; font-size:20px; margin:0 0 6px 0;">🎉 本層次挑戰完成！</h3>
        <p style="color:var(--text-sub); font-size:13.5px; margin:0 0 16px 0;">太棒了！已獲得通關星幣，現在可以自由前往下一層次或返回地圖！</p>
        <button class="btn-hud" style="background:#2563eb; color:#fff;" onclick="returnToMap()">返回星際地圖 ➔</button>
      </div>
    `;
    return;
  }

  const q = list[gameState.currentQuestionIndex];
  highlightHeroRole(q.role || 'warrior');

  let bodyHTML = '';

  if (q.type === 'choice3') {
    bodyHTML = '<div class="choice3-stack">';
    q.options.forEach((opt, idx) => {
      bodyHTML += `<button class="choice3-btn" id="c3_opt_${idx}" onclick="checkChoice3(${idx})"><b>${['A','B','C'][idx]}.</b> ${opt}</button>`;
    });
    bodyHTML += '</div>';
  } else if (q.type === 'tf') {
    bodyHTML = `
      <div class="tf-duo-box">
        <button class="tf-duo-btn o" id="tf_btn_0" onclick="checkTF(0)">⭕ 正確 (True)</button>
        <button class="tf-duo-btn x" id="tf_btn_1" onclick="checkTF(1)">❌ 錯誤 (False)</button>
      </div>
    `;
  } else if (q.type === 'unscramble') {
    gameState.unscrambleChosen = [];
    const pool = [...q.blocks, ...(q.distractors || [])].sort(() => Math.random() - 0.5);
    let rack = '';
    pool.forEach((word, idx) => {
      rack += `<button class="word-token" id="utoken_${idx}" onclick="pickWordToken('${word.replace(/'/g, "\'")}', ${idx})">${word}</button>`;
    });

    bodyHTML = `
      <div style="font-size:13px; color:var(--text-sub); text-align:center;">點選下方積木放到橋樑上（點選橋上積木可退回）：</div>
      <div class="bridge-deck" id="bridgeDisplay"><span style="color:#64748b; font-size:13.5px;">在此排列句子...</span></div>
      <div class="token-rack" id="tokenRack">${rack}</div>
      <div style="display:flex; justify-content:center; gap:8px; margin-top:10px;">
        <button class="btn-hud" onclick="resetUnscramble()">🔄 全部重排</button>
        <button class="btn-hud" style="background:#10b981; color:#fff;" onclick="checkUnscramble()">✔ 驗證架橋</button>
      </div>
    `;
  } else if (q.type === 'spelling') {
    gameState.spellingInput = '';
    let slots = '';
    for (let i = 0; i < q.word.length; i++) slots += `<div class="spell-slot" id="sslot_${i}"></div>`;

    bodyHTML = `
      <div class="spell-deck">
        <div style="font-size:19px; font-weight:700; color:#fff;">請拼出單字：【${q.hint}】</div>
        <div style="font-size:12px; color:var(--text-sub); margin-top:2px;">預設小寫輸入，可點選 ⇧ Shift 切換大寫：</div>
        <div class="spell-slots-row" id="slotsRow">${slots}</div>
        <div class="keypad-grid-26" id="keypad26">${renderKeypad26()}</div>
        <div style="display:flex; justify-content:center; gap:8px;">
          <button class="btn-hud" id="shiftBtn" onclick="toggleShiftKey()">⇧ Shift</button>
          <button class="btn-hud" style="background:#dc2626; color:#fff;" onclick="deleteSpellLetter()">⌫ 刪除</button>
          <button class="btn-hud" style="background:#16a34a; color:#fff;" onclick="submitSpellWord()">✔ 送出檢查</button>
        </div>
      </div>
    `;
  } else if (q.type === 'numpad') {
    gameState.numpadInput = '';
    bodyHTML = `
      <div style="text-align:center;">
        <div style="font-size:24px; font-weight:700; color:#38bdf8; min-height:36px;" id="numpadDisplay">___</div>
        <div class="numpad-grid">
          ${[1,2,3,4,5,6,7,8,9,0].map(n => `<button class="num-btn" onclick="pressNum('${n}')">${n}</button>`).join('')}
          <button class="num-btn" style="background:#dc2626;" onclick="clearNum()">C</button>
          <button class="num-btn" style="background:#16a34a;" onclick="submitNum()">OK</button>
        </div>
      </div>
    `;
  }

  container.innerHTML = `
    <div class="q-title-row">
      <h3 class="q-title-text">${q.title || q.hint}</h3>
      <button class="btn-audio" onclick="speakText('${(q.title || q.word || '').replace(/'/g, "\'")}')" title="聆聽發音">🔊</button>
    </div>
    ${bodyHTML}
    <div class="feedback-box" id="feedbackBox">
      <div class="fb-title" id="fbTitle"></div>
      <div class="fb-body" id="fbBody"></div>
      <button class="btn-hud" style="width:100%; justify-content:center; margin-top:10px; background:#2563eb; color:#fff;" onclick="nextQuestion()">下一題 ➔</button>
    </div>
  `;
}

function highlightHeroRole(role) {
  document.querySelectorAll('.hero-slot').forEach(s => s.classList.remove('active'));
  const slot = document.getElementById(`slot_${role}`);
  if (slot) slot.classList.add('active');
}

// 題型 1 驗證
function checkChoice3(idx) {
  const stg = STAGES_DATA[gameState.currentStageIndex];
  const q = stg.layers[gameState.currentLayer][gameState.currentQuestionIndex];
  const isC = (idx === q.ans);

  q.options.forEach((opt, i) => {
    const b = document.getElementById(`c3_opt_${i}`);
    if (b) {
      b.disabled = true;
      if (i === q.ans) b.classList.add('c');
      else if (i === idx && !isC) b.classList.add('w');
    }
  });

  handleAnswerOutcome(isC, q);
}

// 題型 2 驗證
function checkTF(ans) {
  const stg = STAGES_DATA[gameState.currentStageIndex];
  const q = stg.layers[gameState.currentLayer][gameState.currentQuestionIndex];
  const isC = (ans === q.ans);

  [0, 1].forEach(i => {
    const b = document.getElementById(`tf_btn_${i}`);
    if (b) {
      b.disabled = true;
      if (i === q.ans) b.classList.add('c');
      else if (i === ans && !isC) b.classList.add('w');
    }
  });

  handleAnswerOutcome(isC, q);
}

// 題型 3 句子積木
function pickWordToken(word, idx) {
  AudioEngine.playTone(600, 'square', 0.04);
  const btn = document.getElementById(`utoken_${idx}`);
  if (btn) btn.classList.add('used');
  gameState.unscrambleChosen.push({ word, idx });
  updateBridgeDOM();
}

function removeBridgeToken(pos) {
  AudioEngine.playTone(400, 'sine', 0.04);
  const item = gameState.unscrambleChosen[pos];
  const btn = document.getElementById(`utoken_${item.idx}`);
  if (btn) btn.classList.remove('used');
  gameState.unscrambleChosen.splice(pos, 1);
  updateBridgeDOM();
}

function updateBridgeDOM() {
  const bridge = document.getElementById('bridgeDisplay');
  if (gameState.unscrambleChosen.length === 0) {
    bridge.innerHTML = '<span style="color:#64748b; font-size:13.5px;">在此排列句子...</span>';
    return;
  }
  let html = '';
  gameState.unscrambleChosen.forEach((item, i) => {
    html += `<span class="word-token" style="background:#2563eb; border-color:#60a5fa;" onclick="removeBridgeToken(${i})">${item.word}</span>`;
  });
  bridge.innerHTML = html;
}

function resetUnscramble() {
  gameState.unscrambleChosen.forEach(item => {
    const btn = document.getElementById(`utoken_${item.idx}`);
    if (btn) btn.classList.remove('used');
  });
  gameState.unscrambleChosen = [];
  updateBridgeDOM();
}

function checkUnscramble() {
  const stg = STAGES_DATA[gameState.currentStageIndex];
  const q = stg.layers[gameState.currentLayer][gameState.currentQuestionIndex];
  const userStr = gameState.unscrambleChosen.map(b => b.word).join(' ').trim();
  const isC = (userStr.toLowerCase() === q.target.toLowerCase());

  handleAnswerOutcome(isC, q, q.target + (q.punc || ''));
}

// 題型 4 拼字機
function renderKeypad26() {
  const letters = 'abcdefghijklmnopqrstuvwxyz'.split('');
  return letters.map(ch => {
    const display = gameState.isShiftOn ? ch.toUpperCase() : ch;
    return `<button class="key-pad-btn" onclick="pressSpellKey('${display}')">${display}</button>`;
  }).join('');
}

function toggleShiftKey() {
  gameState.isShiftOn = !gameState.isShiftOn;
  const btn = document.getElementById('shiftBtn');
  if (btn) btn.classList.toggle('shift-on', gameState.isShiftOn);
  const k = document.getElementById('keypad26');
  if (k) k.innerHTML = renderKeypad26();
}

function pressSpellKey(ch) {
  AudioEngine.playTone(800, 'sine', 0.03);
  const stg = STAGES_DATA[gameState.currentStageIndex];
  const q = stg.layers[gameState.currentLayer][gameState.currentQuestionIndex];
  if (gameState.spellingInput.length < q.word.length) {
    gameState.spellingInput += ch;
    updateSpellSlots(q.word.length);
  }
}

function deleteSpellLetter() {
  if (gameState.spellingInput.length > 0) {
    gameState.spellingInput = gameState.spellingInput.slice(0, -1);
    const stg = STAGES_DATA[gameState.currentStageIndex];
    const q = stg.layers[gameState.currentLayer][gameState.currentQuestionIndex];
    updateSpellSlots(q.word.length);
  }
}

function updateSpellSlots(len) {
  for (let i = 0; i < len; i++) {
    const slot = document.getElementById(`sslot_${i}`);
    if (slot) {
      const c = gameState.spellingInput[i] || '';
      slot.innerText = c;
      slot.className = c ? 'spell-slot filled' : 'spell-slot';
    }
  }
}

function submitSpellWord() {
  const stg = STAGES_DATA[gameState.currentStageIndex];
  const q = stg.layers[gameState.currentLayer][gameState.currentQuestionIndex];
  const isC = (gameState.spellingInput.toLowerCase() === q.word.toLowerCase());
  handleAnswerOutcome(isC, q, q.word);
}

// 題型 5 數字鍵盤
function pressNum(n) {
  if (gameState.numpadInput.length < 5) gameState.numpadInput += n;
  document.getElementById('numpadDisplay').innerText = gameState.numpadInput || '___';
}
function clearNum() {
  gameState.numpadInput = '';
  document.getElementById('numpadDisplay').innerText = '___';
}
function submitNum() {
  const stg = STAGES_DATA[gameState.currentStageIndex];
  const q = stg.layers[gameState.currentLayer][gameState.currentQuestionIndex];
  const isC = (gameState.numpadInput.trim() === q.target.trim());
  handleAnswerOutcome(isC, q, q.target);
}

// ==============================================================
// 6. 答題戰鬥與 RPG 傷害反饋處理
// ==============================================================
function handleAnswerOutcome(isCorrect, q, customAnsText) {
  const fb = document.getElementById('feedbackBox');
  const h = document.getElementById('fbTitle');
  const b = document.getElementById('fbBody');

  if (isCorrect) {
    AudioEngine.playCorrect();
    AudioEngine.playAttack();
    AudioEngine.playCoin();

    // 觸發角色攻擊怪獸
    const dmg = 25 + (gameState.level * 5);
    triggerMonsterHit(dmg);

    let coinGain = 10;
    if (gameState.activePet === 'dog') coinGain = Math.round(coinGain * 1.3);
    gameState.coins += coinGain;
    gameState.score += 20;
    renderHUD();

    fb.className = 'feedback-box c';
    h.innerHTML = `<span>🎉</span> <span>回答完全正確！(+${coinGain} 星幣)</span>`;
  } else {
    AudioEngine.playWrong();

    // 寵物技能：水獺母音護盾
    let shieldUsed = false;
    if (gameState.activePet === 'otter' && (q.explain || '').includes('an')) {
      shieldUsed = true;
      alert('🦦 水獺發動【母音護盾】為你抵擋了此次失誤！');
    }

    if (!shieldUsed) {
      if (gameState.lives > 0) gameState.lives--;
      renderHUD();
      if (gameState.lives === 0) {
        alert('💥 生命值耗盡！太空急救站已為你急救復活（補充 3 顆心 ❤️❤️❤️）！');
        gameState.lives = 3;
        renderHUD();
      }
    }

    recordMistake(q.title || q.hint, q.explain || '', q.trap || '');

    fb.className = 'feedback-box w';
    h.innerHTML = `<span>💥</span> <span>答錯踩到陷阱啦！正確答案：【${customAnsText || (q.options ? q.options[q.ans] : '')}】</span>`;
  }

  b.innerHTML = `
    <div>${q.explain || ''}</div>
    ${q.trap ? `<div class="fb-trap-tag">⚠️ 避坑提醒：${q.trap}</div>` : ''}
  `;
  fb.style.display = 'block';
}

function triggerMonsterHit(dmg) {
  const sprite = document.getElementById('monsterSprite');
  if (sprite) {
    sprite.classList.remove('hit');
    void sprite.offsetWidth;
    sprite.classList.add('hit');
  }

  const dt = document.getElementById('damageText');
  if (dt) {
    dt.innerText = `-${dmg}!`;
    dt.style.animation = 'none';
    void dt.offsetWidth;
    dt.style.animation = 'floatUp 0.8s forwards ease-out';
  }

  gameState.monsterCurHp = Math.max(0, gameState.monsterCurHp - dmg);
  updateMonsterHp();

  if (gameState.monsterCurHp === 0) {
    setTimeout(() => {
      AudioEngine.playFanfare();
      alert('🏆 守護怪獸已被擊敗！獲得星際榮譽寶箱！');
      gameState.coins += 50;
      gameState.level++;
      renderHUD();
    }, 400);
  }
}

function updateMonsterHp() {
  const bar = document.getElementById('monsterHpBar');
  if (bar) {
    const pct = Math.round((gameState.monsterCurHp / gameState.monsterMaxHp) * 100);
    bar.style.width = pct + '%';
  }
}

function nextQuestion() {
  gameState.currentQuestionIndex++;
  renderCurrentQuestion();
}

function applyAura(type) {
  AudioEngine.playJump();
  gameState.heroAuraColor = type;
  const filterMap = {
    none: 'none',
    gold: 'sepia(1) hue-rotate(5deg) saturate(2) drop-shadow(0 0 10px #fbbf24)',
    red: 'hue-rotate(300deg) saturate(1.8) drop-shadow(0 0 10px #f43f5e)',
    blue: 'hue-rotate(180deg) saturate(1.8) drop-shadow(0 0 10px #38bdf8)'
  };
  ['previewWarrior','previewMage','previewHealer'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.filter = filterMap[type];
  });
  alert('✨ 出戰隊伍光芒配色切換成功！');
}

function selectPet(key) {
  AudioEngine.playCoin();
  gameState.activePet = key;
  const p = PETS_INFO[key];
  document.getElementById('petThumbImg').src = p.img;
  document.getElementById('petNameTxt').innerText = p.name;
  document.getElementById('petSkillTxt').innerText = p.skill;
  switchMoonTab('pets');
}

function pullGacha() {
  if (gameState.coins < 50) {
    alert('星幣不足喔！抽取扭蛋需要 50 🪙 星幣。');
    return;
  }
  gameState.coins -= 50;
  renderHUD();

  const pod = document.getElementById('gachaPod');
  pod.classList.add('spinning');
  AudioEngine.playTone(300, 'square', 0.4);

  setTimeout(() => {
    pod.classList.remove('spinning');
    AudioEngine.playFanfare();
    const rewards = [
      "🌈 彩虹星河軌跡 (攻擊粒子特效)",
      "⚡ 湛藍雷霆電弧 (物理暴擊特效)",
      "🔥 烈焰隕石火花 (法術轟炸特效)",
      "👾 復古 8-Bit 像素跳字 (傷害字體)",
      "💥 暴烈熱血漫畫跳字 (傷害字體)"
    ];
    const picked = rewards[Math.floor(Math.random() * rewards.length)];
    document.getElementById('gachaResult').innerHTML = `<span style="color:#34d399;">🎊 恭喜抽中：${picked}！</span>`;
  }, 600);
}

  gameState.defenseBlocks = [];
  container.innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
      <span style="font-size:13px; font-weight:600; color:#38bdf8;">全學年單字掉落（方塊在底部堆疊，頂到天花板紅線才失敗！）</span>
      <span style="font-size:12.5px; color:var(--accent-gold);">命中得分：<b id="defScore">0</b></span>
    </div>
    <div class="defense-board" id="defBoard">
      <div class="defense-ceiling-line"></div>
      <div class="defense-ceiling-label">⚠️ 警戒天花板</div>
    </div>
    <div style="display:flex; gap:8px;">
      <input type="text" id="defInput" placeholder="輸入掉落單字按 Enter 擊碎..." style="flex:1; padding:10px 14px; border-radius:10px; border:1px solid #38bdf8; background:#020617; color:#fff; font-size:16px; outline:none;" autocomplete="off">
      <button class="btn-hud" style="background:#10b981; color:#fff;" onclick="fireDefenseLaser()">發射 💥</button>
    </div>
  `;

  const input = document.getElementById('defInput');
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') fireDefenseLaser(); });

  clearInterval(gameState.defenseTimer);
  gameState.defenseTimer = setInterval(() => {
    const board = document.getElementById('defBoard');
    if (!board) { clearInterval(gameState.defenseTimer); return; }

    // 平緩生成方塊
    if (Math.random() < 0.35 && gameState.defenseBlocks.length < 6) {
      const word = WORD_DROP_VOCAB[Math.floor(Math.random() * WORD_DROP_VOCAB.length)];
      const id = 'blk_' + Date.now();
      const left = Math.floor(Math.random() * (board.clientWidth - 100));
      const el = document.createElement('div');
      el.id = id;
      el.className = 'defense-block';
      el.innerText = word;
      el.style.left = left + 'px';
      el.style.top = '0px';
      board.appendChild(el);
      gameState.defenseBlocks.push({ id, word, top: 0, el, settled: false });
    }

    // 更新方塊移動
    for (let i = gameState.defenseBlocks.length - 1; i >= 0; i--) {
      const b = gameState.defenseBlocks[i];
      if (!b.settled) {
        b.top += 1.8; // 平緩下落
        b.el.style.top = b.top + 'px';

        // 碰底堆疊判定 (底部堆疊高度)
        if (b.top >= board.clientHeight - 36) {
          b.settled = true;
          b.el.style.background = '#475569';
          b.el.style.borderColor = '#64748b';
        }
      } else {
        // 如果堆疊頂到警戒線 (55px)
        if (b.top <= 55) {
          AudioEngine.playWrong();
          alert('💥 防禦失守！方塊堆疊頂到警戒天花板！');
          stopDefenseGame();
          switchMoonTab('defense');
          return;
        }
      }
    }
  }, 50);
}

function fireDefenseLaser() {
  const input = document.getElementById('defInput');
  if (!input) return;
  const txt = input.value.trim().toLowerCase();
  if (!txt) return;

  for (let i = 0; i < gameState.defenseBlocks.length; i++) {
    const b = gameState.defenseBlocks[i];
    if (b.word.toLowerCase() === txt) {
      AudioEngine.playJump();
      AudioEngine.playCoin();
      gameState.coins += 5;
      gameState.score += 15;
      renderHUD();

      b.el.style.background = '#10b981';
      setTimeout(() => b.el.remove(), 80);
      gameState.defenseBlocks.splice(i, 1);
      input.value = '';

      const s = document.getElementById('defScore');
      if (s) s.innerText = parseInt(s.innerText || 0) + 15;
      break;
    }
  }
}

function stopDefenseGame() {
  clearInterval(gameState.defenseTimer);
  gameState.defenseBlocks = [];
}

// ==============================================================
// 8. 榮譽獎狀與錯題筆記彈窗
// ==============================================================
function openCertModal() {
  AudioEngine.playFanfare();
  document.getElementById('certCoins').innerText = gameState.coins;
  document.getElementById('certScore').innerText = gameState.score;
  document.getElementById('certModal').style.display = 'flex';
}
function closeCertModal() { document.getElementById('certModal').style.display = 'none'; }

function openNotebookModal() {
  AudioEngine.playTone(350, 'sine', 0.08);
  const container = document.getElementById('notebookContent');
  if (gameState.wrongList.length === 0) {
    container.innerHTML = '<p style="color:#34d399; font-weight:600; font-size:14.5px;">太厲害了！目前完全沒有任何錯題記錄喔！</p>';
  } else {
    container.innerHTML = gameState.wrongList.map((item, idx) => `
      <div style="background:#1e293b; border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin-bottom:8px;">
        <div style="font-size:12px; color:#c084fc; font-weight:600;">錯題 ${idx+1}</div>
        <div style="font-size:14.5px; font-weight:600; margin:3px 0; color:#fff;">${item.title}</div>
        <div style="font-size:12.5px; color:#fca5a5;">📌 核心解析：${item.explain} ${item.trap ? `<br><span style="color:#fbbf24;">⚠️ 避坑提醒：${item.trap}</span>` : ''}</div>
      </div>
    `).join('');
  }
  document.getElementById('notebookModal').style.display = 'flex';
}
function closeNotebookModal() { document.getElementById('notebookModal').style.display = 'none'; }
function clearNotebook() { gameState.wrongList = []; openNotebookModal(); }
function recordMistake(title, explain, trap) {
  if (!gameState.wrongList.some(item => item.title === title)) {
    gameState.wrongList.push({ title, explain, trap });
  }
}

// 語音朗讀
function speakText(text) {
  if (!text) return;
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const clean = text.replace(/[一-龥]/g, '').replace(/[_（）()【】：:?]/g, ' ').trim();
    const u = new SpeechSynthesisUtterance(clean || text);
    u.lang = 'en-US';
    u.rate = 0.88;
    window.speechSynthesis.speak(u);
  }
}

window.onload = init;
</script>
