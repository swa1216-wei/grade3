<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Galaxy English 星際英語特訓系統・國小三年級專屬</title>
<style>
  :root {
    --galaxy-bg: #0b0f19;
    --galaxy-card: #131b2e;
    --galaxy-card-hover: #1c2742;
    --primary: #38bdf8;
    --primary-glow: rgba(56, 189, 248, 0.25);
    --accent-purple: #a855f7;
    --accent-pink: #f43f5e;
    --accent-gold: #fbbf24;
    --success: #10b981;
    --danger: #ef4444;
    --text-main: #f8fafc;
    --text-sub: #94a3b8;
    --border: #243049;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: radial-gradient(circle at 50% 10%, #172554 0%, var(--galaxy-bg) 60%);
    color: var(--text-main);
    margin: 0;
    padding: 12px;
    min-height: 100vh;
  }
  .app-container {
    max-width: 960px;
    margin: 0 auto;
    background: rgba(19, 27, 46, 0.95);
    border: 1px solid rgba(56, 189, 248, 0.25);
    border-radius: 24px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6), 0 0 30px var(--primary-glow);
    overflow: hidden;
    backdrop-filter: blur(16px);
  }
  header {
    background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #1e293b 100%);
    border-bottom: 1px solid var(--border);
    padding: 22px 16px;
    text-align: center;
    position: relative;
  }
  .header-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(56, 189, 248, 0.15);
    color: var(--primary);
    border: 1px solid rgba(56, 189, 248, 0.4);
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 800;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }
  header h1 {
    margin: 0 0 6px 0;
    font-size: 26px;
    font-weight: 900;
    background: linear-gradient(90deg, #38bdf8, #a855f7, #f43f5e);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 1px;
  }
  header p {
    margin: 0;
    font-size: 14px;
    color: var(--text-sub);
  }

  /* 模式選單導航 */
  .mode-nav-bar {
    display: flex;
    background: #0f172a;
    padding: 8px 12px;
    gap: 8px;
    overflow-x: auto;
    border-bottom: 1px solid var(--border);
    align-items: center;
  }
  .nav-btn {
    flex: 1;
    min-width: 120px;
    padding: 12px 10px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: #1e293b;
    color: var(--text-sub);
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    text-align: center;
    white-space: nowrap;
    transition: all 0.2s ease;
  }
  .nav-btn:hover {
    background: var(--galaxy-card-hover);
    color: var(--text-main);
    border-color: var(--primary);
  }
  .nav-btn.active {
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    color: white;
    border-color: #60a5fa;
    box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
  }

  /* 控制列 */
  .sub-control-bar {
    display: flex;
    padding: 12px 18px;
    gap: 10px;
    background: rgba(15, 23, 42, 0.8);
    border-bottom: 1px solid var(--border);
    align-items: center;
    flex-wrap: wrap;
  }
  .lesson-select {
    padding: 8px 14px;
    border-radius: 10px;
    background: #1e293b;
    color: var(--text-main);
    border: 1.5px solid var(--border);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  .action-btn {
    padding: 8px 16px;
    border-radius: 10px;
    background: #1e293b;
    color: var(--primary);
    border: 1.5px solid rgba(56, 189, 248, 0.4);
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .action-btn:hover {
    background: rgba(56, 189, 248, 0.15);
    transform: translateY(-1px);
  }
  .pool-badge {
    margin-left: auto;
    font-size: 12.5px;
    font-weight: 800;
    background: rgba(168, 85, 247, 0.2);
    color: #c084fc;
    border: 1px solid rgba(168, 85, 247, 0.4);
    padding: 4px 12px;
    border-radius: 12px;
  }

  .main-panel {
    padding: 22px;
    min-height: 520px;
  }

  /* 答題卡容器 */
  .quiz-status-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    font-size: 14px;
    font-weight: 800;
  }
  .type-badge {
    background: rgba(56, 189, 248, 0.15);
    color: var(--primary);
    border: 1px solid rgba(56, 189, 248, 0.3);
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 13px;
  }
  .score-badge {
    background: rgba(16, 185, 129, 0.15);
    color: var(--success);
    border: 1px solid rgba(16, 185, 129, 0.4);
    padding: 4px 12px;
    border-radius: 20px;
  }

  .question-card {
    background: var(--galaxy-card);
    border: 1.5px solid var(--border);
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    position: relative;
  }
  .q-audio-btn {
    position: absolute;
    right: 18px;
    top: 18px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid rgba(56, 189, 248, 0.4);
    background: rgba(56, 189, 248, 0.15);
    color: var(--primary);
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .q-audio-btn:hover {
    background: var(--primary);
    color: #0f172a;
    transform: scale(1.08);
  }
  .question-text {
    font-size: 20px;
    font-weight: 800;
    line-height: 1.6;
    margin: 0;
    padding-right: 52px;
    color: #ffffff;
  }
  .question-sub {
    font-size: 14px;
    color: var(--text-sub);
    margin-top: 8px;
  }

  /* 選擇題選項按鈕 */
  .choice-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .choice-btn {
    width: 100%;
    padding: 16px 20px;
    border: 2px solid var(--border);
    border-radius: 16px;
    background: var(--galaxy-card);
    color: var(--text-main);
    text-align: left;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .choice-btn:hover {
    background: var(--galaxy-card-hover);
    border-color: var(--primary);
    transform: translateX(4px);
  }
  .choice-btn.selected-correct {
    border-color: var(--success) !important;
    background: rgba(16, 185, 129, 0.2) !important;
    color: #34d399 !important;
    font-weight: 900 !important;
    box-shadow: 0 0 15px rgba(16, 185, 129, 0.4) !important;
  }
  .choice-btn.selected-wrong {
    border-color: var(--danger) !important;
    background: rgba(239, 68, 68, 0.2) !important;
    color: #f87171 !important;
    font-weight: 900 !important;
    box-shadow: 0 0 15px rgba(239, 68, 68, 0.4) !important;
  }

  /* 是非題按鈕 */
  .tf-group {
    display: flex;
    gap: 16px;
  }
  .tf-btn {
    flex: 1;
    padding: 18px;
    border-radius: 16px;
    border: 2px solid var(--border);
    background: var(--galaxy-card);
    font-size: 22px;
    font-weight: 900;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
  }
  .tf-btn.o { color: #34d399; }
  .tf-btn.x { color: #f87171; }
  .tf-btn:hover {
    background: var(--galaxy-card-hover);
    transform: translateY(-2px);
  }
  .tf-btn.selected-correct {
    border-color: var(--success) !important;
    background: rgba(16, 185, 129, 0.2) !important;
    box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
  }
  .tf-btn.selected-wrong {
    border-color: var(--danger) !important;
    background: rgba(239, 68, 68, 0.2) !important;
    box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
  }

  /* ⌨️ 拼英練習機 (Virtual Keyboard & Spelling Slots) */
  .spell-container {
    background: var(--galaxy-card);
    border: 2px solid var(--border);
    border-radius: 20px;
    padding: 22px;
    text-align: center;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
  }
  .spell-slots {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin: 20px 0;
    min-height: 52px;
  }
  .slot-letter {
    width: 44px;
    height: 52px;
    border: 2px solid rgba(56, 189, 248, 0.4);
    border-radius: 12px;
    background: #0f172a;
    color: var(--primary);
    font-size: 26px;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.5);
  }
  .slot-letter.active {
    border-color: var(--primary);
    box-shadow: 0 0 12px var(--primary-glow);
  }
  .keyboard-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 7px;
    max-width: 580px;
    margin: 0 auto 18px auto;
  }
  .key-btn {
    padding: 13px 0;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    background: #1e293b;
    color: #ffffff;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.1s;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
  }
  .key-btn:active { transform: scale(0.92); }
  .key-btn:hover { background: #334155; border-color: var(--primary); }
  .spell-action-bar {
    display: flex;
    justify-content: center;
    gap: 12px;
    max-width: 580px;
    margin: 0 auto;
  }
  .spell-ctl-btn {
    flex: 1;
    padding: 14px;
    border-radius: 12px;
    border: none;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-backspace {
    background: #dc2626;
    color: white;
  }
  .btn-submit-spell {
    background: #16a34a;
    color: white;
  }

  /* 即時反饋卡 */
  .feedback-box {
    margin-top: 20px;
    padding: 18px 22px;
    border-radius: 18px;
    display: none;
    animation: fadeIn 0.25s ease-in;
  }
  .feedback-box.correct {
    background: rgba(16, 185, 129, 0.15);
    border: 2px solid var(--success);
    color: #ecfdf5;
  }
  .feedback-box.wrong {
    background: rgba(239, 68, 68, 0.15);
    border: 2px solid var(--danger);
    color: #fef2f2;
  }
  .fb-header {
    font-size: 19px;
    font-weight: 900;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .fb-body {
    font-size: 15px;
    line-height: 1.65;
    color: #e2e8f0;
  }
  .fb-trap-tag {
    display: inline-block;
    background: rgba(251, 191, 36, 0.2);
    color: var(--accent-gold);
    border: 1px solid rgba(251, 191, 36, 0.4);
    padding: 2px 8px;
    border-radius: 6px;
    font-weight: 800;
    margin-top: 6px;
  }
  .next-pill-btn {
    display: block;
    width: 100%;
    margin-top: 16px;
    padding: 14px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    color: white;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.15s;
  }
  .next-pill-btn:hover { transform: scale(1.01); filter: brightness(1.1); }

  /* 📜 考卷長卷模式 (期中/期末全卷) */
  .paper-view {
    display: none;
    animation: fadeIn 0.2s ease-in;
  }
  .paper-header-box {
    background: #1e293b;
    border: 2px solid #3b82f6;
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  .paper-sec-title {
    font-size: 18px;
    font-weight: 800;
    color: var(--primary);
    border-left: 4px solid var(--accent-purple);
    padding-left: 10px;
    margin: 24px 0 14px 0;
  }
  .paper-item {
    background: var(--galaxy-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .paper-item-title {
    font-size: 16.5px;
    font-weight: 800;
    margin-bottom: 12px;
    color: #ffffff;
  }
  .paper-explain {
    margin-top: 10px;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 13.5px;
    line-height: 1.5;
    display: none;
  }
  .paper-explain.show { display: block; }
  .paper-explain.c { background: rgba(16, 185, 129, 0.2); border: 1px solid var(--success); color: #6ee7b7; }
  .paper-explain.w { background: rgba(239, 68, 68, 0.2); border: 1px solid var(--danger); color: #fca5a5; }

  .submit-exam-btn {
    display: block;
    width: 260px;
    margin: 30px auto;
    padding: 16px;
    border-radius: 20px;
    border: none;
    background: linear-gradient(135deg, #10b981, #059669);
    color: white;
    font-size: 18px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
    text-align: center;
  }

  /* 錯題筆記本 */
  .notebook-view {
    display: none;
  }
  .nb-card {
    background: var(--galaxy-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="app-container">
  <header>
    <div class="header-badge">🚀 GALAXY ENGLISH 星際美語</div>
    <h1>國小三年級英語・全真期中期末大考特訓系統</h1>
    <p>108課綱對齊 ｜ 實體課本與考卷 ｜ 拼英練習 ｜ 易錯陷阱特訓</p>
  </header>

  <!-- 頂部核心模式切換 -->
  <div class="mode-nav-bar">
    <button class="nav-btn active" onclick="switchNavMode('units')">🪐 單元特訓</button>
    <button class="nav-btn" onclick="switchNavMode('spell')">⌨️ 星際拼字機</button>
    <button class="nav-btn" onclick="switchNavMode('midterm')">📝 期中考模擬卷 (96分真題)</button>
    <button class="nav-btn" onclick="switchNavMode('final')">📜 期末大考全卷 (綜合長卷)</button>
    <button class="nav-btn" onclick="switchNavMode('traps')">⚠️ 常錯陷阱特訓</button>
    <button class="nav-btn" onclick="switchNavMode('notebook')" style="color:#f59e0b;">📓 錯題筆記本</button>
  </div>

  <!-- 單元控制列 -->
  <div class="sub-control-bar" id="subControlBar">
    <label for="lessonSelect" style="font-size:13.5px; font-weight:800; color:var(--text-sub);">選擇單元：</label>
    <select id="lessonSelect" class="lesson-select" onchange="onLessonSelectChange()">
      <option value="all">🔥 英語期末全範圍大考 (Unit 1 ~ 4)</option>
      <option value="e_u1">Unit 1: How Old Are You? (年齡數字 1~10)</option>
      <option value="e_u2">Unit 2: What's This? (文具用品 a / an)</option>
      <option value="e_u3">Unit 3: What Color Is It? (顏色問答句型)</option>
      <option value="e_u4">Unit 4 & 節慶: Halloween (萬聖節與綜合)</option>
      <option value="e_phonics">Phonics: 自然發音字首音與母音</option>
    </select>
    <button class="action-btn" onclick="reloadRandomQuestions()">🎲 換一批新考題</button>
    <span class="pool-badge" id="poolBadge">載入中...</span>
  </div>

  <div class="main-panel">
    <!-- 1. 單題互動答題視窗 (單元 / 陷阱題) -->
    <div id="quizContainer">
      <div class="quiz-status-row">
        <span class="type-badge" id="typeBadge">單元測驗</span>
        <span id="progressText" style="color:var(--text-sub);">第 1 / 10 題</span>
        <span class="score-badge" id="scoreBadge">得分：0</span>
      </div>

      <div class="question-card">
        <button class="q-audio-btn" id="btnAudio" onclick="playVoice()" title="點擊發音朗讀">🔊</button>
        <h2 class="question-text" id="qTitle">題目載入中...</h2>
        <div class="question-sub" id="qSub"></div>
      </div>

      <div id="optionArea"></div>

      <div class="feedback-box" id="feedbackBox">
        <div class="fb-header" id="fbHeader"></div>
        <div class="fb-body" id="fbBody"></div>
        <button class="next-pill-btn" onclick="nextQuestion()">進入下一題 ➔</button>
      </div>
    </div>

    <!-- 2. ⌨️ 星際拼字機全螢幕專區 -->
    <div id="spellContainer" style="display:none;">
      <div class="quiz-status-row">
        <span class="type-badge" style="background:rgba(168,85,247,0.2); color:#c084fc; border-color:#c084fc;">⌨️ 星際單字拼寫機</span>
        <span id="spellProgress" style="color:var(--text-sub);">第 1 / 10 關</span>
        <span class="score-badge" id="spellScore">拼字得分：0</span>
      </div>

      <div class="spell-container">
        <button class="q-audio-btn" style="position:static; margin:0 auto 10px auto;" onclick="playVoice(currentSpellTarget)" title="聆聽單字發音">🔊</button>
        <div style="font-size:20px; font-weight:800;" id="spellPrompt">請拼出英文單字：【直尺】</div>
        <div style="font-size:13px; color:var(--text-sub); margin-top:4px;">點選下方字母鍵盤輸入，完成後送出檢查</div>

        <div class="spell-slots" id="spellSlots"></div>

        <div class="keyboard-grid" id="keyboardGrid"></div>

        <div class="spell-action-bar">
          <button class="spell-ctl-btn btn-backspace" onclick="deleteSpellLetter()">⌫ 刪除 (Delete)</button>
          <button class="spell-ctl-btn btn-submit-spell" onclick="submitSpellAnswer()">✔ 送出檢查 (Submit)</button>
        </div>
      </div>

      <div class="feedback-box" id="spellFeedbackBox">
        <div class="fb-header" id="spellFbHeader"></div>
        <div class="fb-body" id="spellFbBody"></div>
        <button class="next-pill-btn" onclick="nextSpellQuestion()">前往下一個單字 ➔</button>
      </div>
    </div>

    <!-- 3. 📜 考卷長卷模式 (期中考卷 / 期末全卷) -->
    <div class="paper-view" id="paperContainer">
      <div class="paper-header-box">
        <div>
          <div style="font-size:20px; font-weight:900; color:#60a5fa;" id="paperTitle">📜 國小三年級英語科・全真大考試卷</div>
          <div style="font-size:13.5px; color:var(--text-sub); margin-top:4px;" id="paperSubtitle">比照真題段考試卷排版</div>
        </div>
        <div style="display:flex; align-items:center; gap:12px;">
          <span style="font-size:16px; font-weight:900; color:#34d399;" id="paperScoreLive">得分：尚未交卷</span>
          <button class="action-btn" onclick="exitPaperView()">離開試卷</button>
        </div>
      </div>

      <div id="paperBody"></div>

      <button class="submit-exam-btn" id="btnSubmitPaper" onclick="submitPaperExam()">📝 交卷計分 ✔</button>
    </div>

    <!-- 4. 📓 錯題筆記本 -->
    <div class="notebook-view" id="notebookContainer">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h3 style="margin:0; font-size:18px; color:var(--accent-gold);">📓 星際錯題記錄庫</h3>
        <button class="action-btn" onclick="clearWrongQuestions()">清空筆記</button>
      </div>
      <div id="wrongList">目前太棒了，完全沒有錯題！</div>
    </div>
  </div>
</div>

<script>
// ==========================================
// 📚 國小三年級英語全真題庫資料庫 (108課綱康軒/翰林Dino對齊)
// ==========================================
const ENGLISH_DATABASE = [
  // --- Unit 1: How Old Are You? (年齡、數字 1~10、禮貌用語) ---

function init() {
  switchNavMode('units');
}

// ---------------- 頂部主選單切換 ----------------
function switchNavMode(mode) {
  currentNavMode = mode;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  const btn = document.querySelector(`.nav-btn[onclick*="${mode}"]`);
  if (btn) btn.classList.add('active');

  // 控制區顯示
  const ctrlBar = document.getElementById('subControlBar');
  ctrlBar.style.display = (mode === 'units' || mode === 'traps') ? 'flex' : 'none';

  // 視窗切換
  document.getElementById('quizContainer').style.display = 'none';
  document.getElementById('spellContainer').style.display = 'none';
  document.getElementById('paperContainer').style.display = 'none';
  document.getElementById('notebookContainer').style.display = 'none';

  if (mode === 'units') {
    document.getElementById('quizContainer').style.display = 'block';
    loadUnitsQuiz();
  } else if (mode === 'spell') {
    document.getElementById('spellContainer').style.display = 'block';
    startSpellingMode();
  } else if (mode === 'midterm') {
    document.getElementById('paperContainer').style.display = 'block';
    openPaperMode('midterm');
  } else if (mode === 'final') {
    document.getElementById('paperContainer').style.display = 'block';
    openPaperMode('final');
  } else if (mode === 'traps') {
    document.getElementById('quizContainer').style.display = 'block';
    loadTrapsQuiz();
  } else if (mode === 'notebook') {
    document.getElementById('notebookContainer').style.display = 'block';
    renderNotebookView();
  }
}

// ---------------- 單元與隨機題庫 ----------------
function onLessonSelectChange() {
  currentLesson = document.getElementById('lessonSelect').value;
  if (currentNavMode === 'traps') loadTrapsQuiz();
  else loadUnitsQuiz();
}

function reloadRandomQuestions() {
  if (currentNavMode === 'traps') loadTrapsQuiz();
  else loadUnitsQuiz();
}

function loadUnitsQuiz() {
  let pool = [...ENGLISH_DATABASE];
  if (currentLesson !== 'all') {
    pool = pool.filter(q => q.unit === currentLesson);
  }
  // 強制隨機打亂洗牌
  pool.sort(() => Math.random() - 0.5);
  currentQuizList = pool.slice(0, 10);
  currentQuizIndex = 0;
  quizScore = 0;

  document.getElementById('poolBadge').innerText = `題庫共 ${pool.length} 題 (隨機抽選)`;
  document.getElementById('typeBadge').innerText = "單元挑戰";
  renderCurrentQuestion();
}

function loadTrapsQuiz() {
  // 篩選所有帶有 trap 說明的易錯陷阱題
  let pool = ENGLISH_DATABASE.filter(q => q.trap || q.type === 'tf');
  pool.sort(() => Math.random() - 0.5);
  currentQuizList = pool.slice(0, 10);
  currentQuizIndex = 0;
  quizScore = 0;

  document.getElementById('poolBadge').innerText = `易錯陷阱題庫共 ${pool.length} 題`;
  document.getElementById('typeBadge').innerText = "⚠️ 易錯陷阱特訓";
  renderCurrentQuestion();
}

function renderCurrentQuestion() {
  const fb = document.getElementById('feedbackBox');
  fb.style.display = 'none';

  if (currentQuizIndex >= currentQuizList.length) {
    document.getElementById('qTitle').innerText = `🎉 太棒了！本輪特訓完成！總得分：${quizScore} / ${currentQuizList.length * 10} 分`;
    document.getElementById('qSub').innerText = "點選下方按鈕再抽一組全新題目挑戰！";
    document.getElementById('optionArea').innerHTML = `
      <div style="text-align:center; padding:20px;">
        <button class="action-btn" style="padding:14px 28px; font-size:16px;" onclick="reloadRandomQuestions()">🎲 換一套全新考題繼續特訓 ➔</button>
      </div>
    `;
    return;
  }

  const q = currentQuizList[currentQuizIndex];
  document.getElementById('progressText').innerText = `第 ${currentQuizIndex + 1} / ${currentQuizList.length} 題`;
  document.getElementById('scoreBadge').innerText = `得分：${quizScore}`;
  document.getElementById('qTitle').innerText = q.title;
  document.getElementById('qSub').innerText = `單元歸屬：${q.unitName}`;

  const optArea = document.getElementById('optionArea');
  optArea.innerHTML = "";

  if (q.type === 'tf') {
    optArea.innerHTML = `
      <div class="tf-group">
        <button class="tf-btn o" id="btn_tf_0" onclick="chooseAnswer(0)">⭕ 正確 (True)</button>
        <button class="tf-btn x" id="btn_tf_1" onclick="chooseAnswer(1)">❌ 錯誤 (False)</button>
      </div>
    `;
  } else {
    let html = `<div class="choice-list">`;
    const labels = ['A', 'B', 'C', 'D'];
    q.options.forEach((opt, idx) => {
      html += `<button class="choice-btn" id="btn_choice_${idx}" onclick="chooseAnswer(${idx})">
        <b>${labels[idx]}.</b> ${opt}
      </button>`;
    });
    html += `</div>`;
    optArea.innerHTML = html;
  }
}

function chooseAnswer(userChoice) {
  const q = currentQuizList[currentQuizIndex];
  const isCorrect = (userChoice === q.ans);

  // 選項立即變色反饋
  if (q.type === 'tf') {
    const btns = [document.getElementById('btn_tf_0'), document.getElementById('btn_tf_1')];
    btns.forEach((btn, idx) => {
      if (!btn) return;
      btn.disabled = true;
      if (idx === q.ans) {
        btn.classList.add('selected-correct');
        btn.innerHTML = "✅ " + btn.innerHTML;
      } else if (idx === userChoice && !isCorrect) {
        btn.classList.add('selected-wrong');
        btn.innerHTML = "❌ " + btn.innerHTML;
      }
    });
  } else {
    q.options.forEach((opt, idx) => {
      const btn = document.getElementById(`btn_choice_${idx}`);
      if (!btn) return;
      btn.disabled = true;
      if (idx === q.ans) {
        btn.classList.add('selected-correct');
        btn.innerHTML = "✅ " + btn.innerHTML;
      } else if (idx === userChoice && !isCorrect) {
        btn.classList.add('selected-wrong');
        btn.innerHTML = "❌ " + btn.innerHTML;
      }
    });
  }

  if (isCorrect) {
    quizScore += 10;
  } else {
    recordWrongQuestion(q, userChoice);
  }

  document.getElementById('scoreBadge').innerText = `得分：${quizScore}`;

  // 顯示詳細反饋橫幅
  const fb = document.getElementById('feedbackBox');
  const fbHeader = document.getElementById('fbHeader');
  const fbBody = document.getElementById('fbBody');

  if (isCorrect) {
    fb.className = "feedback-box correct";
    fbHeader.innerHTML = `<span>🎉</span> <span>回答完全正確！(+10分)</span>`;
  } else {
    fb.className = "feedback-box wrong";
    const correctText = (q.type === 'tf') ? (q.ans === 0 ? '⭕ 正確' : '❌ 錯誤') : `${['A','B','C','D'][q.ans]}. ${q.options[q.ans]}`;
    fbHeader.innerHTML = `<span>❌</span> <span>答錯了！正確答案是：【${correctText}】</span>`;
  }

  fbBody.innerHTML = `
    <div>📖 <b>解析說明：</b>${q.explain}</div>
    ${q.trap ? `<div class="fb-trap-tag">⚠️ 考卷避坑指南：${q.trap}</div>` : ''}
  `;
  fb.style.display = 'block';
  fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function nextQuestion() {
  currentQuizIndex++;
  renderCurrentQuestion();
}

// ---------------- ⌨️ 星際拼字機邏輯 ----------------
function startSpellingMode() {
  spellList = [...SPELL_WORDS].sort(() => Math.random() - 0.5).slice(0, 10);
  spellIndex = 0;
  spellScore = 0;
  renderSpellQuestion();
}

function renderSpellQuestion() {
  const fb = document.getElementById('spellFeedbackBox');
  fb.style.display = 'none';

  if (spellIndex >= spellList.length) {
    document.getElementById('spellPrompt').innerText = `🏆 星際拼字特訓完成！總得分：${spellScore} / 100 分`;
    document.getElementById('spellSlots').innerHTML = "";
    document.getElementById('keyboardGrid').innerHTML = "";
    document.querySelector('.spell-action-bar').innerHTML = `
      <button class="spell-ctl-btn btn-submit-spell" onclick="startSpellingMode()">🎲 再玩一組全新單字 ➔</button>
    `;
    return;
  }

  const item = spellList[spellIndex];
  currentSpellTarget = item.word.toUpperCase();
  userEnteredLetters = "";

  document.getElementById('spellProgress').innerText = `第 ${spellIndex + 1} / ${spellList.length} 關`;
  document.getElementById('spellScore').innerText = `拼字得分：${spellScore}`;
  document.getElementById('spellPrompt').innerText = `請拼出英文單字：【${item.hint}】`;

  renderSpellSlots();
  renderKeyboardGrid();
}

function renderSpellSlots() {
  const container = document.getElementById('spellSlots');
  let html = "";
  for (let i = 0; i < currentSpellTarget.length; i++) {
    const ch = userEnteredLetters[i] || "";
    const isActive = (i === userEnteredLetters.length) ? "active" : "";
    html += `<div class="slot-letter ${isActive}">${ch}</div>`;
  }
  container.innerHTML = html;
}

function renderKeyboardGrid() {
  const grid = document.getElementById('keyboardGrid');
  const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
  let html = "";
  letters.forEach(letter => {
    html += `<button class="key-btn" onclick="pressSpellKey('${letter}')">${letter}</button>`;
  });
  grid.innerHTML = html;
}

function pressSpellKey(letter) {
  if (userEnteredLetters.length < currentSpellTarget.length) {
    userEnteredLetters += letter;
    renderSpellSlots();
  }
}

function deleteSpellLetter() {
  if (userEnteredLetters.length > 0) {
    userEnteredLetters = userEnteredLetters.slice(0, -1);
    renderSpellSlots();
  }
}

function submitSpellAnswer() {
  if (userEnteredLetters.length < currentSpellTarget.length) {
    alert("請拼完所有字母後再送出！");
    return;
  }

  const isCorrect = (userEnteredLetters === currentSpellTarget);
  const item = spellList[spellIndex];
  const fb = document.getElementById('spellFeedbackBox');
  const h = document.getElementById('spellFbHeader');
  const b = document.getElementById('spellFbBody');

  if (isCorrect) {
    spellScore += 10;
    fb.className = "feedback-box correct";
    h.innerHTML = `<span>🎉</span> <span>太棒了！拼寫完全正確！</span>`;
    playVoice(currentSpellTarget);
  } else {
    fb.className = "feedback-box wrong";
    h.innerHTML = `<span>❌</span> <span>拼錯囉！你拼成【${userEnteredLetters}】，正確是【${currentSpellTarget}】</span>`;
    recordWrongQuestion({
      title: `單字拼寫【${item.hint}】`,
      explain: `正確拼法為：${currentSpellTarget}。${item.detail}`
    }, userEnteredLetters);
  }

  b.innerHTML = `<div>📖 <b>單字記憶解析：</b>${item.detail}</div>`;
  fb.style.display = 'block';

  document.querySelectorAll('.key-btn, .spell-ctl-btn').forEach(btn => btn.disabled = true);
}

function nextSpellQuestion() {
  spellIndex++;
  renderSpellQuestion();
}

// ---------------- 📜 考卷長卷模式 (期中/期末) ----------------
function openPaperMode(examType) {
  paperUserAnswers = {};
  const isMid = (examType === 'midterm');

  document.getElementById('paperTitle').innerText = isMid ? "📜 國小三年級英語科・期中考全真試卷 (96分真題題型)" : "📜 國小三年級英語科・期末考全真模擬試卷 (Unit 1~4 全範圍)";
  document.getElementById('paperSubtitle').innerText = isMid ? "涵蓋：大小寫字母、字首自然發音、看圖選單字、核心對話、借書證閱讀題組" : "涵蓋：年齡、文具冠詞 a/an、顏色問答、萬聖節單字與生活對話";
  document.getElementById('paperScoreLive').innerText = "得分：尚未交卷";
  document.getElementById('btnSubmitPaper').style.display = 'block';

  // 篩選題目
  let pool = isMid 
    ? ENGLISH_DATABASE.filter(q => q.unit === 'e_u1' || q.unit === 'e_u2' || q.unit === 'e_phonics')
    : [...ENGLISH_DATABASE];

  pool.sort(() => Math.random() - 0.5);
  paperExamList = pool.slice(0, 15);

  renderPaperContent();
}

function renderPaperContent() {
  const container = document.getElementById('paperBody');
  let html = "";

  // 分類成是非題與選擇題
  const tfList = paperExamList.filter(q => q.type === 'tf');
  const choiceList = paperExamList.filter(q => q.type !== 'tf');

  if (tfList.length > 0) {
    html += `<div class="paper-sec-title">一、是非題 (對的選 ⭕，錯的選 ❌，共 ${tfList.length} 題)</div>`;
    tfList.forEach((q, idx) => {
      html += `
        <div class="paper-item" id="p_item_${q.id}">
          <div class="paper-item-title">${idx + 1}. ${q.title}</div>
          <div class="tf-group" style="max-width:320px;">
            <button class="tf-btn o" id="p_btn_${q.id}_0" onclick="recordPaperAns('${q.id}', 0)">⭕ 正確</button>
            <button class="tf-btn x" id="p_btn_${q.id}_1" onclick="recordPaperAns('${q.id}', 1)">❌ 錯誤</button>
          </div>
          <div class="paper-explain" id="p_exp_${q.id}"></div>
        </div>
      `;
    });
  }

  if (choiceList.length > 0) {
    html += `<div class="paper-sec-title">二、單一選擇題 (選出最適合的答案，共 ${choiceList.length} 題)</div>`;
    const labels = ['A', 'B', 'C', 'D'];
    choiceList.forEach((q, idx) => {
      html += `
        <div class="paper-item" id="p_item_${q.id}">
          <div class="paper-item-title">${idx + 1}. ${q.title}</div>
          <div class="choice-list">
      `;
      q.options.forEach((opt, optIdx) => {
        html += `
          <button class="choice-btn" id="p_btn_${q.id}_${optIdx}" onclick="recordPaperAns('${q.id}', ${optIdx})">
            <b>${labels[optIdx]}.</b> ${opt}
          </button>
        `;
      });
      html += `
          </div>
          <div class="paper-explain" id="p_exp_${q.id}"></div>
        </div>
      `;
    });
  }

  container.innerHTML = html;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function recordPaperAns(qid, choiceIdx) {
  paperUserAnswers[qid] = choiceIdx;
  const q = paperExamList.find(item => item.id === qid);
  if (!q) return;

  if (q.type === 'tf') {
    [0, 1].forEach(i => {
      const btn = document.getElementById(`p_btn_${qid}_${i}`);
      if (btn) btn.classList.toggle('selected-correct', i === choiceIdx);
    });
  } else {
    q.options.forEach((opt, i) => {
      const btn = document.getElementById(`p_btn_${qid}_${i}`);
      if (btn) btn.classList.toggle('selected-correct', i === choiceIdx);
    });
  }
}

function submitPaperExam() {
  let correct = 0;
  const total = paperExamList.length;

  paperExamList.forEach(q => {
    const userAns = paperUserAnswers[q.id];
    const isCorrect = (userAns === q.ans);
    if (isCorrect) correct++;

    const expBox = document.getElementById(`p_exp_${q.id}`);
    if (expBox) {
      expBox.className = "paper-explain show " + (isCorrect ? "c" : "w");
      const correctTxt = (q.type === 'tf') ? (q.ans === 0 ? '⭕ 正確' : '❌ 錯誤') : `${['A','B','C','D'][q.ans]}. ${q.options[q.ans]}`;
      expBox.innerHTML = `<b>${isCorrect ? "✅ 答對了！" : "❌ 答錯了！"} 正確答案：【${correctTxt}】</b><br>${q.explain} ${q.trap ? `<br>⚠️ 陷阱提示：${q.trap}` : ''}`;
    }

    // 標示選項按鈕
    if (q.type === 'tf') {
      [0, 1].forEach(i => {
        const btn = document.getElementById(`p_btn_${q.id}_${i}`);
        if (!btn) return;
        btn.disabled = true;
        btn.classList.remove('selected-correct', 'selected-wrong');
        if (i === q.ans) btn.classList.add('selected-correct');
        else if (i === userAns && !isCorrect) btn.classList.add('selected-wrong');
      });
    } else {
      q.options.forEach((opt, i) => {
        const btn = document.getElementById(`p_btn_${q.id}_${i}`);
        if (!btn) return;
        btn.disabled = true;
        btn.classList.remove('selected-correct', 'selected-wrong');
        if (i === q.ans) btn.classList.add('selected-correct');
        else if (i === userAns && !isCorrect) btn.classList.add('selected-wrong');
      });
    }

    if (!isCorrect) {
      recordWrongQuestion(q, userAns);
    }
  });

  const finalScore = Math.round((correct / total) * 100);
  document.getElementById('paperScoreLive').innerHTML = `🎉 試卷總分：<span style="font-size:22px; color:#34d399;">${finalScore}</span> / 100 分 (答對 ${correct} / ${total} 題)`;
  document.getElementById('btnSubmitPaper').style.display = 'none';
}

function exitPaperView() {
  switchNavMode('units');
}

// ---------------- 語音朗讀 (Speech Synthesis) ----------------
function playVoice(textToSpeak) {
  let text = textToSpeak;
  if (!text) {
    const q = currentQuizList[currentQuizIndex];
    if (q) text = q.title;
  }
  if (!text) return;

  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    // 過濾中文提示，只朗讀英文句子或單字
    const engText = text.replace(/[一-龥]/g, '').replace(/[_（）()]/g, ' ').trim();
    const u = new SpeechSynthesisUtterance(engText || text);
    u.lang = 'en-US';
    u.rate = 0.9;
    window.speechSynthesis.speak(u);
  }
}

// ---------------- 錯題筆記本 ----------------
function recordWrongQuestion(q, userChoice) {
  const title = q.title || "題目";
  if (!wrongQuestions.some(item => item.title === title)) {
    wrongQuestions.push({
      title: title,
      explain: q.explain || "",
      trap: q.trap || ""
    });
  }
}

function renderNotebookView() {
  const container = document.getElementById('wrongList');
  if (wrongQuestions.length === 0) {
    container.innerHTML = "<p style='color:#34d399; font-weight:800; padding:20px 0;'>太厲害了！目前沒有任何錯題記錄喔！</p>";
    return;
  }

  let html = "";
  wrongQuestions.forEach((item, idx) => {
    html += `
      <div class="nb-card">
        <div style="font-size:13px; color:#c084fc; font-weight:bold;">錯題 ${idx + 1}</div>
        <div style="font-size:16px; font-weight:800; margin:6px 0; color:#ffffff;">${item.title}</div>
        <div style="font-size:13.5px; color:#fca5a5; background:rgba(239,68,68,0.15); padding:8px 12px; border-radius:8px; border:1px solid rgba(239,68,68,0.3);">
          📌 核心考點解析：${item.explain}
          ${item.trap ? `<br>⚠️ 考卷避坑提醒：${item.trap}` : ''}
        </div>
      </div>
    `;
  });
  container.innerHTML = html;
}

function clearWrongQuestions() {
  wrongQuestions = [];
  renderNotebookView();
}

window.onload = init;
</script>
