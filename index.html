<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>國小三年級期末大考・108課綱全真全科模擬試題系統</title>
<style>
  :root {
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --primary-light: #eff6ff;
    --success: #10b981;
    --danger: #ef4444;
    --warning: #f59e0b;
    --text-main: #0f172a;
    --text-sub: #475569;
    --bg-page: #f8fafc;
    --card-bg: #ffffff;
    --border: #cbd5e1;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
    background: var(--bg-page);
    color: var(--text-main);
    margin: 0;
    padding: 12px;
  }
  .app-container {
    max-width: 960px;
    margin: 0 auto;
    background: var(--card-bg);
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.06);
    overflow: hidden;
    border: 1px solid var(--border);
  }
  header {
    background: linear-gradient(135deg, #1e3a8a, #2563eb);
    color: white;
    padding: 22px 20px;
    text-align: center;
  }
  header h1 { margin: 0 0 6px 0; font-size: 22px; font-weight: 800; letter-spacing: 0.5px; }
  header p { margin: 0; font-size: 13.5px; opacity: 0.95; }

  .status-bar {
    background: #0f172a;
    color: #e2e8f0;
    padding: 10px 18px;
    font-size: 13px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  .badge-status {
    background: #059669;
    color: #ecfdf5;
    padding: 4px 10px;
    border-radius: 6px;
    font-weight: 700;
  }

  .subject-nav {
    display: flex;
    background: #e2e8f0;
    padding: 6px;
    gap: 6px;
    overflow-x: auto;
  }
  .sub-btn {
    flex: 1;
    min-width: 95px;
    padding: 12px 6px;
    border: none;
    border-radius: 12px;
    background: transparent;
    color: #475569;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
  }
  .sub-btn.active {
    background: white;
    color: var(--primary-dark);
    box-shadow: 0 4px 10px rgba(37, 99, 235, 0.15);
  }

  .lesson-bar {
    padding: 12px 18px;
    background: var(--primary-light);
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .lesson-bar label { font-size: 14px; font-weight: 700; color: #1e293b; white-space: nowrap; }
  .lesson-select {
    flex: 1;
    min-width: 280px;
    padding: 9px 12px;
    border: 1px solid #94a3b8;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    background: white;
    color: #0f172a;
    outline: none;
  }
  .action-btn {
    padding: 9px 16px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .action-btn:hover { background: var(--primary-dark); }
  .mode-badge {
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12.5px;
    font-weight: 700;
    background: #dbeafe;
    color: #1e40af;
  }

  /* 國語島專屬七大闖關子導航列 */
  .chinese-sub-bar {
    display: flex;
    background: #fdfbf7;
    border-bottom: 2px solid #fed7aa;
    padding: 8px 18px;
    gap: 10px;
    overflow-x: auto;
  }
  .c-sub-btn {
    padding: 8px 14px;
    border: 2px solid #fed7aa;
    border-radius: 10px;
    background: white;
    font-size: 13.5px;
    font-weight: 700;
    color: #9a3412;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .c-sub-btn.active {
    background: #f97316;
    color: white;
    border-color: #ea580c;
  }

  .main-panel { padding: 22px; min-height: 480px; }
  .status-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    font-size: 14px;
    font-weight: 700;
    color: var(--text-sub);
  }
  .q-badge {
    background: #e2e8f0;
    padding: 5px 12px;
    border-radius: 20px;
    color: #1e293b;
    font-size: 13px;
  }
  .score-badge {
    background: #fef3c7;
    color: #92400e;
    padding: 5px 12px;
    border-radius: 20px;
  }
  .q-box {
    background: #fafbfe;
    border: 2px solid #e2e8f0;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .q-title {
    font-size: 18.5px;
    font-weight: 700;
    line-height: 1.65;
    color: #0f172a;
    margin: 0;
  }

  /* 圖形繪製畫布容器 */
  .diagram-container {
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 16px auto;
    background: #ffffff;
    border: 2px solid #cbd5e1;
    border-radius: 14px;
    padding: 12px;
    max-width: 520px;
    min-height: 200px;
  }
  .diagram-container canvas {
    max-width: 100%;
    height: auto;
  }

  /* 選擇題選項卡 */
  .choice-list { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
  .choice-btn {
    width: 100%;
    padding: 15px 20px;
    border: 2px solid #cbd5e1;
    border-radius: 12px;
    background: white;
    text-align: left;
    font-size: 16px;
    font-weight: 600;
    line-height: 1.45;
    cursor: pointer;
    color: #1e293b;
    transition: all 0.15s;
  }
  .choice-btn:hover { border-color: var(--primary); background: #eff6ff; }

  /* 國語島：成語大卡片 */
  .idiom-choice-list {
    display: flex;
    gap: 16px;
    justify-content: center;
    margin-top: 20px;
    flex-wrap: wrap;
  }
  .idiom-btn {
    flex: 1;
    min-width: 160px;
    max-width: 240px;
    padding: 18px 12px;
    border: 2px solid #d97706;
    border-radius: 14px;
    background: #f59e0b;
    color: white;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 2px;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(217, 119, 6, 0.25);
    transition: transform 0.1s, background 0.2s;
  }
  .idiom-btn:active { transform: scale(0.97); }
  .idiom-btn:hover { background: #d97706; }

  /* 國語島：句子重組積木機 */
  .unscramble-target-box {
    min-height: 75px;
    border: 2px dashed #94a3b8;
    border-radius: 14px;
    background: #f8fafc;
    padding: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    margin: 16px 0;
  }
  .unscramble-source-box {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    margin: 18px 0;
  }
  .word-block {
    padding: 12px 18px;
    border: 2px solid #b45309;
    border-radius: 12px;
    background: #fef3c7;
    color: #78350f;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 3px 6px rgba(180, 83, 9, 0.15);
    transition: transform 0.1s, background 0.15s;
    user-select: none;
  }
  .word-block:active { transform: scale(0.95); }
  .word-block.used { opacity: 0.35; pointer-events: none; }
  .unscramble-actions {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-top: 14px;
  }
  .unscramble-btn {
    padding: 10px 22px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    border: 1px solid #cbd5e1;
  }
  .btn-reset-blocks { background: #f1f5f9; color: #475569; }
  .btn-submit-blocks { background: #059669; color: white; border: none; }

  /* 國語島：生字字典寶箱卡 */
  .char-chest-display {
    background: white;
    border: 2px solid #cbd5e1;
    border-radius: 16px;
    padding: 20px;
    display: flex;
    gap: 24px;
    align-items: center;
    margin-bottom: 20px;
  }
  .char-big-font {
    font-size: 68px;
    font-weight: 900;
    color: #1e293b;
    border: 2px solid #cbd5e1;
    border-radius: 12px;
    padding: 6px 18px;
    background: #f8fafc;
  }
  .char-meta-info {
    font-size: 16px;
    line-height: 1.8;
    color: #334155;
  }
  .char-meta-info b { color: #0f172a; }
  .char-tiles-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(75px, 1fr));
    gap: 10px;
    margin-top: 14px;
  }
  .char-tile-btn {
    padding: 12px 6px;
    border: 2px solid #cbd5e1;
    border-radius: 12px;
    background: white;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
  }
  .char-tile-btn.active {
    border-color: #2563eb;
    background: #eff6ff;
    box-shadow: 0 4px 10px rgba(37, 99, 235, 0.15);
  }
  .char-tile-btn .c-main { font-size: 24px; font-weight: 800; color: #0f172a; }
  .char-tile-btn .c-zy { font-size: 12px; color: #64748b; margin-top: 2px; }

  /* 閱讀測驗文章卡片 */
  .reading-passage-card {
    background: #fffbeb;
    border: 2px solid #fde68a;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 4px 12px rgba(245, 158, 11, 0.08);
  }
  .reading-passage-title {
    font-size: 19px;
    font-weight: 800;
    color: #92400e;
    margin-bottom: 12px;
    border-bottom: 2px solid #fcd34d;
    padding-bottom: 8px;
  }
  .reading-passage-text {
    font-size: 17px;
    line-height: 1.85;
    color: #451a03;
    letter-spacing: 0.5px;
    text-align: justify;
    text-indent: 2em;
  }

  /* 數學計算機按鈕機 */
  .math-display-container {
    background: white;
    border: 2px dashed #94a3b8;
    border-radius: 12px;
    padding: 12px;
    min-height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
  }
  .math-display-text {
    font-size: 26px;
    font-weight: 800;
    color: #1e3a8a;
    letter-spacing: 2px;
    min-height: 32px;
  }
  .math-keypad {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    max-width: 520px;
    margin: 0 auto 12px auto;
  }
  .m-key {
    padding: 14px 0;
    font-size: 20px;
    font-weight: 800;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    background: white;
    color: #1e293b;
    cursor: pointer;
    text-align: center;
  }
  .m-key.op { background: #eff6ff; color: #2563eb; border-color: #bfdbfe; }
  .m-key.func { background: #fee2e2; color: #dc2626; border-color: #fca5a5; }
  .m-key.submit { background: #059669; color: white; grid-column: span 2; border: none; }

  /* 英文拼字鍵盤 */
  .spell-display {
    min-height: 52px;
    border: 2px dashed #94a3b8;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 14px;
    background: white;
    padding: 8px;
  }
  .letter-box {
    width: 38px;
    height: 44px;
    border-bottom: 3px solid var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 800;
    color: var(--primary);
    background: #f8fafc;
  }
  .virtual-keyboard {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    margin-bottom: 12px;
  }
  .vk-key {
    padding: 12px 0;
    border: 1px solid #cbd5e1;
    background: white;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 800;
    text-align: center;
    cursor: pointer;
  }
  .spell-actions { display: flex; gap: 10px; }
  .spell-action-btn {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
  }
  .btn-del { background: #fee2e2; color: #b91c1c; }
  .btn-submit { background: var(--primary); color: white; }

  /* 回饋解析卡 */
  .feedback-box {
    margin-top: 18px;
    padding: 16px;
    border-radius: 14px;
    display: none;
  }
  .feedback-box.correct { background: #ecfdf5; border: 2px solid #6ee7b7; color: #065f46; }
  .feedback-box.wrong { background: #fef2f2; border: 2px solid #fca5a5; color: #991b1b; }
  .fb-title { font-size: 16px; font-weight: 800; margin-bottom: 6px; }
  .fb-detail { font-size: 14.5px; line-height: 1.6; }
  .next-btn {
    display: block;
    width: 100%;
    margin-top: 14px;
    padding: 14px;
    background: #0f172a;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 15.5px;
    font-weight: 700;
    cursor: pointer;
  }

  .notebook-view { display: none; padding: 16px; }
  .nb-card {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;
    background: #fff;
  }
</style>
</head>
<body>

<div class="app-container">
  <header>
    <h1>國小三年級期末大考・108課綱全真模擬試題系統</h1>
    <p>📖 國語島冒險(生字寶箱・句子重組・成語・譬喻・閱讀) ｜ 📐 數學實驗室 ｜ 🌱 自然科學 ｜ 🔤 英文闖關</p>
  </header>

  <div class="status-bar">
    <span id="syncStatusText">✨ 官方真題與幾何動態繪圖引擎全部就緒</span>

  <div class="subject-nav">
    <button class="sub-btn active" onclick="switchSubject('chinese')">📖 國語島冒險</button>

    <button class="action-btn" onclick="loadQuestions()">🎲 換一批全新題目</button>

  <!-- 國語島專屬七大闖關子導航列 -->
  <div class="chinese-sub-bar" id="chineseSubBar">
    <button class="c-sub-btn active" onclick="switchChineseMode('chest')">🗃️ 生字學習寶箱</button>
    <button class="c-sub-btn" onclick="switchChineseMode('unscramble')">🧩 句子重組積木機</button>
    <button class="c-sub-btn" onclick="switchChineseMode('idiom')">🎯 成語情境填空</button>
    <button class="c-sub-btn" onclick="switchChineseMode('metaphor')">🪞 譬喻修辭大師</button>
    <button class="c-sub-btn" onclick="switchChineseMode('comprehend')">💡 句意深度理解</button>
    <button class="c-sub-btn" onclick="switchChineseMode('reading')">📜 素養閱讀測驗</button>
    <button class="c-sub-btn" onclick="switchChineseMode('quiz')">📝 課文生字測驗</button>
  </div>

  <div class="main-panel" id="mainPanel">
    <div class="status-row" id="statusRow">
      <span class="q-badge" id="typeBadge">選擇題</span>
      <span id="progressText">第 1 題</span>
      <span class="score-badge" id="scoreText">得分：0</span>

    <div class="q-box" id="qBox">
      <h2 class="q-title" id="qTitle">題目載入中...</h2>

    <div id="optionArea"></div>

    <div class="feedback-box" id="feedbackBox">
      <div class="fb-title" id="fbTitle"></div>

      <button onclick="closeNotebook()" style="padding:6px 14px; border-radius:8px; border:1px solid #cbd5e1; font-weight:700; cursor:pointer;">返回練習</button>
    </div>
    <div id="wrongList">目前沒有錯題，表現優異！</div>
  </div>
</div>

<script>
const SPREADSHEET_ID = "13lCIn_XK-f-PMHsBGJHiW3Wvv6JEeLJQheN-7-08_fM";
const SHEET_NAME = "題庫資料表";
let CLOUD_QUESTIONS = [];

function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function sample(arr) { return arr[rand(0, arr.length - 1)]; }
const NAMES = ["小明", "小華", "小美", "小宇", "晴晴", "安安", "宸宸", "雨彤", "睿睿", "心怡"];

// ==========================================
// 繪圖引擎 (乾淨無洩題標記)
// ==========================================
const DrawEngine = {
  drawAngleParts: function(canvas) {
    const ctx = canvas.getContext('2d');
    const w = canvas.width = 340, h = canvas.height = 200;
    ctx.clearRect(0, 0, w, h);
    const bx = 60, by = 140, px = 240, py = 140, mx = 180, my = 40;
    ctx.lineWidth = 3; ctx.strokeStyle = "#1e293b";
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(px, py); ctx.stroke();
    DrawEngine.drawArrow(ctx, px, py, 0);
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(mx, my); ctx.stroke();
    const rad = Math.atan2(my - by, mx - bx);
    DrawEngine.drawArrow(ctx, mx, my, rad);
    ctx.lineWidth = 2.5; ctx.strokeStyle = "#2563eb";
    ctx.beginPath(); ctx.arc(bx, by, 40, rad, 0); ctx.stroke();
    ctx.font = "bold 16px sans-serif";
    ctx.fillStyle = "#ef4444"; ctx.beginPath(); ctx.arc(bx, by, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillText("ㄅ (頂點)", bx - 50, by + 5);
    ctx.fillStyle = "#2563eb"; ctx.beginPath(); ctx.arc(px, py, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillText("ㄆ", px + 10, py + 5);
    ctx.beginPath(); ctx.arc(mx, my, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillText("ㄇ", mx + 10, my - 5);
  },
  drawCutCorner: function(canvas, cutType) {
    const ctx = canvas.getContext('2d');
    const w = canvas.width = 340, h = canvas.height = 210;
    ctx.clearRect(0, 0, w, h);
    const rx = 50, ry = 40, rw = 220, rh = 130;
    ctx.lineWidth = 2; ctx.strokeStyle = "#94a3b8"; ctx.setLineDash([5, 5]);
    ctx.strokeRect(rx, ry, rw, rh); ctx.setLineDash([]);
    ctx.lineWidth = 3; ctx.strokeStyle = "#1e293b"; ctx.fillStyle = "#e0f2fe";
    ctx.beginPath();
    if (cutType === 5) {
      ctx.moveTo(rx, ry); ctx.lineTo(rx + rw - 60, ry); ctx.lineTo(rx + rw, ry + 60); ctx.lineTo(rx + rw, ry + rh); ctx.lineTo(rx, ry + rh);
    } else {
      ctx.moveTo(rx, ry); ctx.lineTo(rx + rw, ry + rh); ctx.lineTo(rx, ry + rh);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#ef4444"; ctx.font = "bold 14px sans-serif";
    ctx.fillText("✂️ 剪切線", rx + rw - 70, ry + 25);
  },
  drawRulerTest: function(canvas, type) {
    const ctx = canvas.getContext('2d');
    const w = canvas.width = 340, h = canvas.height = 210;
    ctx.clearRect(0, 0, w, h);
    const ox = 70, oy = 160;
    ctx.lineWidth = 4; ctx.strokeStyle = "#ef4444";
    ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ox + 160, oy); ctx.stroke();
    let deg = (type === 'acute') ? 50 : 125;
    const rad = -deg * Math.PI / 180;
    ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ox + 160 * Math.cos(rad), oy + 160 * Math.sin(rad)); ctx.stroke();

    for (let c = 0; c <= cols; c++) { ctx.beginPath(); ctx.moveTo(ox + c * sz, oy); ctx.lineTo(ox + c * sz, oy + rows * sz); ctx.stroke(); }

    ctx.fillStyle = "#38bdf8"; ctx.strokeStyle = "#0284c7"; ctx.lineWidth = 2;

      ctx.fillRect(ox + c * sz, oy + r * sz, sz, sz); ctx.strokeRect(ox + c * sz, oy + r * sz, sz, sz);
    }

      const c = (colored + i) % cols, r = Math.floor((colored + i) / cols);

    }
  },

    const cw = 70, ch = 160;
    ctx.lineWidth = 3; ctx.strokeStyle = "#334155"; ctx.fillStyle = "#f8fafc";
    ctx.strokeRect(x, y, cw, ch);
    const waterH = (ml / 700) * (ch - 20);
    const wy = y + ch - waterH;
    ctx.fillStyle = "rgba(56, 189, 248, 0.45)";
    ctx.fillRect(x + 2, wy, cw - 4, waterH);
    if (hasStone) {
      ctx.fillStyle = "#475569"; ctx.beginPath(); ctx.arc(x + cw / 2, y + ch - 22, 16, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = "#0f172a"; ctx.stroke();
    }

    ctx.fillText(`${ml} mL`, x + cw + 10, wy + 4);
    ctx.fillStyle = "#0f172a"; ctx.font = "bold 14px sans-serif";
    ctx.fillText(label, x + 8, y + ch + 22);
  },
  drawFractionCircle: function(canvas, totalParts, takenParts) {
    const ctx = canvas.getContext('2d');
    const size = canvas.width = canvas.height = 200;
    const cx = size / 2, cy = size / 2, r = 80;
    const sliceRad = (2 * Math.PI) / totalParts;
    ctx.lineWidth = 2.5; ctx.strokeStyle = "#1e293b";
    for (let i = 0; i < totalParts; i++) {
      const sRad = i * sliceRad - Math.PI / 2;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, r, sRad, sRad + sliceRad); ctx.closePath();
      ctx.fillStyle = (i < takenParts) ? "#f59e0b" : "#fef3c7";
      ctx.fill(); ctx.stroke();
    }
  },
  drawArrow: function(ctx, x, y, rad) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rad); ctx.fillStyle = "#1e293b";
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-10, -5); ctx.lineTo(-10, 5); ctx.closePath(); ctx.fill(); ctx.restore();
  }
};

title": "婚禮慶典中，族人佩戴在頭冠上，象徵榮耀、英勇與純潔的花朵是：", "explain": "在魯凱族文化中，百合花具有崇高的神聖地位，象徵女子的純潔品德與男子的英勇狩獵戰功。", "options": ["百合花", "向日葵", "康乃馨", "玫瑰花"], "ans": 0}, {"subject": "chinese", "lesson": "c_l10", "type": "choice", "title": "「新娘身穿色彩絢麗的傳統禮服，上面繡滿精美的百步蛇圖騰。」句中「騰」的部首是：", "explain": "「騰」為馬部，奔騰、飛騰。", "options": ["馬部", "月部", "火部", "朕部"], "ans": 0}, {"subject": "chinese", "lesson": "c_l10", "type": "choice", "title": "「婚禮現場『洋溢』著熱鬧歡騰的歌聲。」句中「洋溢」的意思是：", "explain": "「洋溢」形容歡樂氣氛充沛外顯。", "options": ["某種氣氛充分顯露、充滿四周", "水全部漏光了", "感到非常悲哀", "空氣變冰冷了"], "ans": 0}, {"subject": "chinese", "lesson": "c_l10", "type": "choice", "title": "在傳統盪鞦韆儀式結束時，新郎會做出什麼深具愛意的動作迎接新娘？", "explain": "新郎在鞦韆停下時親自抱下並揹起新娘，象徵承擔責任、共度一生的承諾。", "options": ["在新娘盪回地面時，穩穩地將新娘抱下鞦韆揹在背上", "拿水潑新娘", "自己跳上鞦韆一起盪", "轉身跑回家"], "ans": 0}, {"subject": "chinese", "lesson": "c_l10", "type": "choice", "title": "「『牽』手圍成大圓圈跳舞。」句中「牽」的下半部是什麼部首？", "explain": "「牽」字下方為牛字底，部首為「牛部」。", "options": ["牛部", "手部", "大部", "糸部"], "ans": 0}, {"subject": "chinese", "lesson": "c_l10", "type": "choice", "title": "「這座用堅固竹木搭成的秋千高大挺拔。」句中「挺拔」的意思是：", "explain": "「挺拔」形容樹木或建築直挺聳立、氣勢昂揚。", "options": ["直立高聳、直挺有力的樣子", "彎彎曲曲快要倒塌", "矮小不起眼", "柔軟軟弱"], "ans": 0}, {"subject": "chinese", "lesson": "c_l10", "type": "choice", "title": "下列哪一項物品是台灣南部原住民族傳統服飾與聘禮中的尊貴文化象徵？", "explain": "排灣族與魯凱族傳統三寶：陶壺、琉璃珠、青銅刀。", "options": ["陶壺、琉璃珠與青銅刀", "塑膠手錶", "鋼筆墨水", "橡皮擦"], "ans": 0}, {"subject": "chinese", "lesson": "c_l10", "type": "choice", "title": "下列文句中，何者使用了「視覺摹寫」？", "explain": "形容琉璃珠的顏色與光澤外觀，屬於視覺摹寫。", "options": ["新娘身上紅、黃、藍色相間的琉璃珠項鍊閃閃發亮", "遠處傳來陣陣歡快的歌聲", "微風吹在臉上涼絲絲的", "烤肉的香味好濃郁"], "ans": 0}, {"subject": "chinese", "lesson": "c_l10", "type": "tf", "title": "課文《秋千上的婚禮》引導孩子欣賞並尊重台灣多元的原住民族文化與傳統習俗。", "explain": "多元文化素養能開闊學童視野，學會包容與尊重。", "ans": "O", "options": []}, {"subject": "chinese", "lesson": "c_l10", "type": "tf", "title": "盪鞦韆婚禮是所有人隨便想盪就隨時能盪的遊樂園設施，不需要任何文化儀式規範。", "explain": "在傳統文化中，高架鞦韆需經部落耆老祈福祈禱，是一套神聖莊嚴的文化禮俗。", "ans": "X", "options": []}, {"subject": "chinese", "lesson": "c_l10", "type": "tf", 人修辭", "排比修辭", "設問修辭"], "ans": 0}, {"subject": "chinese", "lesson": "c_l11", "type": "choice", "title": "「汽車在馬路上奔馳，駕駛人應保持安全車距。」句中「馳」的部首是什麼？", "explain": "「馳」為馬部，奔馳、馳騁。", "options": ["馬部", "也部", "車部", "走部"], "ans": 0}, {"subject": "chinese", "lesson": "c_l11", "type": "choice", "title": "「平安是回家唯一的路。」這句話強調的核心觀念是：", "explain": "交通安全宣導的核心在於平安才是最高價值。", "options": ["生命安全重於一切，切勿貪快冒險", "回家的路只有一條小巷子", "不能搭乘大眾運輸", "出門走路一定要戴安全帽"], "ans": 0}, {"subject": "chinese", "lesson": "c_l11", "type": "choice", "title": "「雨天路面濕滑，行走時要格外『謹慎』。」「謹慎」的近義詞是：", "explain": "謹慎即慎重仔細、小心防範危險。", "options": ["小心、審慎", "魯莽", "大意", "粗心"], "ans": 0}, {"subject": "chinese", "lesson": "c_l11", "type": "choice", "title": "下列何組詞語為「相反詞」？", "explain": "平安與危險意思相反。", "options": ["平安／危險", "溫馨／溫暖", "叮嚀／交代", "遵守／遵從"], "ans": 0}, {"subject": "chinese", "lesson": "c_l11", "type": "choice", "title": "「遵守號誌指示過馬路，才能避免發生『意外』。」句中「意外」是指：", "explain": "「意外」在此指突發且非預期的危險災禍。", "options": ["意料之外突發的不幸事故", "預先安排好的旅行", "買彩券中大獎", "準時到學校上課"], "ans": 0}, {"subject": "chinese", "lesson": "c_l11", "type": "choice", "title": "「燈」字的部首是什麼？", "explain": "「燈」由火部衍生，古代燃油燈火，部首為「火部」。", "options": ["火部", "登部", "丁部", "目部"], "ans": 0}, {"subject": "chinese", "lesson": "c_l11", "type": "choice", "title": "下列句子中，哪一句標點符號使用最恰當？", "explain": "引號與對話標點規範以A選項最符合標準語法。", "options": ["「出門要多加小心喔！」出發前，媽媽輕聲對我說。", "「出門要多加小心喔？出發前，媽媽輕聲對我說。", "出門要多加小心喔！出發前媽媽輕聲對我說？", "出門要多加小心喔，出發前、媽媽輕聲對我說！"], "ans": 0}, {"subject": "chinese", "lesson": "c_l11", "type": "tf", "title": "課文《一路平安》傳遞了親情溫暖，並融入日常生活交通安全的生活素養教育。", "explain": "文章結合品德情感與實用生活守則。", "ans": "O", "options": []}, {"subject": "chinese", "lesson": "c_l11", "type": "tf", "title": "搭乘機車時，只要騎得夠慢，就不需要戴合格的安全帽。", "explain": "依法規與生命安全，搭乘機車無論車速快慢均必須全程正確佩戴安全帽。", "ans": "X", "options": []}, {"subject": "chinese", "lesson": "c_l11", "type": "tf", "title": "「叮嚀」是指再三囑咐交代。", "explain": "叮嚀通常指出於關愛與責任的反覆提醒。", "ans": "O", "options": []}, {"subject": "chinese", "lesson": "c_l11", "type": "tf", "title": "「平安」一詞是祝福他人安康無事的美好心願。", "explain": "祝願一路順風、平安抵達。", "ans": "O", "options": []}, {"subject": "chinese", "lesson": "c_l11", "type": "tf", "title": "走路過馬路時只要綠燈亮起，不需要左右查看是否有轉彎車輛，直接閉眼往前衝即可。", "explain": "綠燈通行仍需眼觀四面確認無搶快違規轉彎車，才是防禦過馬路的好習慣。", "ans": "X", "options": []}, {"subject": "chinese", "lesson": "c_l11", "type": "choice", "title": "「夜幕低垂，街燈一一亮起。」句中「低垂」形容：", "explain": "夜幕低垂形容傍晚轉夜、暮色漸深的景象。", "options": ["天色慢慢變暗、夜晚降臨的景況", "頭低低的在哭泣", "燈泡壞掉掉下來", "雨水漏進天花板"], "ans": 0}, {"subject": "chinese", "lesson": "c_l11", "type": "choice", "title": "找出句子中的錯別字：「遵守交通規則，大家都能快快樂樂出門，平平安安回家。」", "explain": "全句文字用詞完全正確無錯字。", "options": ["沒有錯別字", "「遵」寫錯了", "「規」寫錯了", "「則」寫錯了"], "ans": 0}, {"subject": "chinese", "lesson": "c_l11", "type": "choice", "title": "「聽到家人平安抵達的電話，媽媽終於『放下心中的大石頭』。」這句話的意思是：", "explain": "放下心中的大石頭是常用成語比喻，形容心中的焦慮擔憂完全消除。", "options": ["心中不再擔憂牽掛，感到十分踏實安心", "媽媽在搬運大石頭練力氣", "把家裡的石頭搬走", "覺得心情更加沉重"], "ans": 0}, {"subject": "chinese", "lesson": "c_l11", "type": "choice", "title": "下列何者的讀音與「便(ㄅㄧㄢˋ)利」之「便」不同？", "explain": "便宜讀作ㄆㄧㄢˊ，其餘皆讀作ㄅㄧㄢˋ。", "options": ["便宜", "方言便利", "大便小便", "隨便"], "ans": 0}, {"subject": "chinese", "lesson": "c_l11", "type": "choice", "title": "「微風在樹林間穿梭，發出沙沙沙的聲響。」句中「沙沙沙」是哪一種修辭手法？", "explain": "模仿大自然實際聲音的詞彙稱為擬聲詞（摹聲）。", "options": ["摹聲詞", "誇飾法", "設問法", "映襯法"], "ans": 0}, {"subject": "chinese", "lesson": "c_l12", "type": "choice", "title": "在課文《不一樣的團員》中，當團隊裡出現性格或特長與眾不同的夥伴時，最好的相處之道是：", "explain": "文章強調接納多元差異、欣賞每個人特質的團隊合作真諦。", "options": ["互相包容理解，發揮彼此獨特長處，攜手達成共同目標", "聯合同學一起嘲笑排擠他", "逼迫他改變成和自己一模一樣", "大家都不跟他說話"], "ans": 0}, {"subject": "chinese", "lesson": "c_l12", "type": "choice", "title": "「只要大家『同心協力』，就沒有克服不了的難關。」句中「同心協力」的意思是：", "explain": "「同心協力」形容大家一條心、共同努力去完成同一件事。", "options": ["齊心合力、共同努力", "各做各的互相爭奪", "坐在原地等別人做好", "彼此心懷戒心偷懶"], "ans": 0}, {"subject": "chinese", "lesson": "c_l12", "type": "choice", "title": "「每個人都是世界上獨一無二的個體。」句中「獨一無二」的意思是：", "explain": "「獨一無二」指獨特珍貴，世上絕無僅有。", "options": ["極其特別，沒有第二個可以相比", "數量只有少數兩個", "隨處可見一點也不稀奇", "個性非常孤僻怪異"], "ans": 0}, {"subject": "chinese", "lesson": "c_l12", "type": "choice", "title": "「『協』調彼此的時間。」句中「協」的部首是什麼？", "explain": "「協」字的部首是左側的「十部」。", "options": ["十部", "力部", "辦部", "三部"], "ans": 0}, {"subject": "chinese", "lesson": "c_l12", "type": "choice", "title": "合唱團在舞台上能唱出和諧動聽的音樂，關鍵原因在於：", "explain": "和諧來自不同聲部的互相聆聽與平衡融合。", "options": ["各部聲調雖然不同，但彼此傾聽配合，融合成優美旋律", "每個人都用最大聲吼叫蓋過別人", "只有主唱一個人唱，其他人都不要出聲", "音響開到最大聲把耳朵震聾"], "ans": 0}, {"subject": "chinese", "lesson": "c_l12", "type": "choice", "title": "「團結就是力量。」這句名言告訴我們：", "explain": "團結合作能化弱為強、克服艱難考驗。", "options": ["凝聚眾人智慧與能力，能發揮遠大於個人的成果", "一個人單打獨鬥速度最快", "越多人在一起越容易吵架", "大家一起睡覺能睡得更香"], "ans": 0}, {"subject": "chinese", "lesson": "c_l12", "type": "choice", "title": "「大家為了共同的目標而『奮鬥』。」句中「奮」的部首是什麼？", "explain": "「奮」字的部首是上方的「大部」。", "options": ["大部", "田部", "隹部", "十部"], "ans": 0}, {"subject": "chinese", "lesson": "c_l12", "type": "choice", "title": "下列哪一組詞語是「近義詞」的關係？", "explain": "和諧與融洽皆形容人際關係或事物協調美好。", "options": ["和諧／融洽", "排擠／接納", "團結／分裂", "特別／普通"], "ans": 0}, {"subject": "chinese", "lesson": "c_l12", "type": "choice", "title": "「看見新同學孤零零坐在一旁，小華主動走上前邀請他加入遊戲。」小華表現出了什麼良好品德？", "explain": "主動關懷新同學是極具同理心與友善包容的表現。", "options": ["友善同理與熱情接納他人", "愛炫耀自己朋友很多", "喜歡命令別人做事", "貪圖別人的玩具"], "ans": 0}, {"subject": "chinese", "lesson": "c_l12", "type": "choice", "title": "下列何句是完整的「因果關係」句子？", "explain": "A選項「因為……所以……」因果推論邏輯最嚴密合宜。", "options": ["因為大家彼此包容體諒，所以演出獲得全場觀眾熱烈掌聲", "雖然今天天氣晴朗，但是大家在操場運動", "如果明天不下雨，我們昨天就去公園玩", "只要努力讀書，明天就會立刻長高十公分"], "ans": 0}, {"subject": "chinese", "lesson": "c_l12", "type": "tf", "title": "課文《不一樣的團員》傳遞的核心品格是：學會欣賞他人優點，擁抱與自己不同的人。", "explain": "多元共榮與包容是現代社會公民的重要價值觀。", "ans": "O", "options": []}, {"subject": "chinese", "lesson": "c_l12", "type": "tf", "title": "在一個優秀的團隊裡，所有隊員的才能與個性必須完全一模一樣，絕對不能有任何不同。", "explain": "多元互補的特長（例如有人擅長領導、有人擅長策劃、有人擅長執行）才能激發最佳團隊戰力。", "ans": "X", "options": []}, {"subject": "chinese", "lesson": "c_l12", "type": "tf", "title": "「掌聲如雷鳴般響起」使用了「譬喻修辭」。", "explain": "以打雷聲比喻掌聲熱烈，為譬喻手法。", "ans": "O", "options": []}, {"subject": "chinese", "lesson": "c_l12", "type": "tf", "title": "「不一樣」並不代表不好，換個角度看可能正是最珍貴的獨特優勢。", "explain": "天生我材必有用，各展所長。", "ans": "O", "options": []}, {"subject": "chinese", "lesson": "c_l12", "type": "tf", "title": "在團體活動中，只要自己表現優秀就好，其他隊員遇到困難不需要理會。", "explain": "團隊強調互相扶持救援，榮譽屬於大家共同所有。", "ans": "X", "options": []}, {"subject": "chinese", "lesson": "c_l12", "type": "choice", "title": "「經過多次排練，大家的動作終於達到『整齊劃一』的境界。」句中「整齊劃一」形容：", "explain": "「整齊劃一」形容團隊紀律嚴整、步伐整齊一致。", "options": ["步調、動作極為齊整一致", "隊伍排得歪七扭八", "動作各做各的毫不相干", "服裝穿得花花綠綠各不相同"], "ans": 0}, {"subject": "chinese", "lesson": "c_l12", "type": "choice", "title": "找出句子中的錯別字：「大家互相包容，共同努力，終於完成了這項堅難的任務。」", "explain": "艱難、艱苦應為部首「又」之「艱」，非堅強之堅。", "options": ["「堅」應改為「艱」", "「容」應改為「榮」", "「終」應改為「中」", "「任」應改為「仁」"], "ans": 0}, {"subject": "chinese", "lesson": "c_l12", "type": "choice", "title": "「舞台上的燈光聚集在主角身上，他顯得格外『耀眼』。」「耀眼」的近義詞是：", "explain": "耀眼（光芒光亮奪目）與光彩奪目近義。", "options": ["奪目", "昏暗", "黯淡", "平庸"], "ans": 0}, {"subject": "chinese", "lesson": "c_l12", "type": "choice", "title": "「『奏』出動人的樂章。」句中「奏」的部首是什麼？", "explain": "「奏」字的部首是上方的「大部」。", "options": ["大部", "天部", "日部", "春部"], "ans": 0}, {"subject": "chinese", "lesson": "c_l12", "type": "choice", "title": "「雖然遇到了挫折，但他們依然『百折不撓』，堅持到底。」句中「百折不撓」比喻：", "explain": "「百折不撓」形容不畏挫折、堅持不懈的英勇精神。", "options": ["意志堅定，即使遭遇無數失敗也絕不屈服退縮", "骨頭很容易骨折折斷", "做事情只要失敗一次就放棄", "個性非常固執聽不進別人的話"], "ans": 0}, {"subject": "nature", "lesson": "n_air", "type": "tf", "title": "將塞有乾衛生紙的杯子「垂直倒扣」壓入水槽底，衛生紙不會濕，是因為杯裡的空氣佔據了空間。", "explain": "空氣佔據空間，把水擋在外面。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_air", "type": "tf", "title": "把杯子傾斜放入水中，水會跑進杯子裡，同時會看到冒出氣泡，那是空氣跑出來了。", "explain": "空氣冒出來騰出空間，水才跑進去。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_air", "type": "tf", "title": "注射筒抽滿空氣堵住出口，用力往前推活塞，活塞可以前進，證明空氣是可以被壓縮的。", "explain": "氣體分子間隙大，受壓時體積變小。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_air", "type": "tf", "title": "注射筒抽滿水並堵住出口，活塞可以像抽滿空氣一樣，輕易被往前壓縮一大段距離。", "explain": "水（液體）幾乎無法被壓縮。", "ans": "X", "options": []}, {"subject": "nature", "lesson": "n_air", "type": "tf", "title": "空氣是完全沒有重量的，就算把充氣飽滿的球拿去電子秤秤重，也和沒充氣時完全一樣重。", "explain": "空氣有微小的重量，充氣球會比扁球稍重。", "ans": "X", "options": []}, {"subject": "nature", "lesson": "n_air", "type": "tf", "title": "空氣沒有固定的形狀，裝進圓形氣球是圓形，裝進心形氣球就是心形。", "explain": "氣體沒有固定形狀，形狀隨容器改變。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_air", "type": "tf", "title": "將漏斗插在塑膠瓶口並用油土將縫隙完全密封，這時把水倒入漏斗，水會非常順暢快速地流入瓶中。", "explain": "瓶內空氣排不出來佔據空間，水流不進去。", "ans": "X", "options": []}, {"subject": "nature", "lesson": "n_air", "type": "tf", "title": "平溪天燈會慢慢往天空升起，是因為熱空氣比冷空氣輕。", "explain": "空氣受熱膨脹變輕，產生向上浮力。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_air", "type": "tf", "title": "我們日常生活中看似空無一物的空紙箱、空杯子，其實裡面都已經裝滿了空氣。", "explain": "空氣無所不在，佔據所有空間。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_air", "type": "tf", "title": "把籃球充飽氣，在地上拍打能彈很高，是因為球內的空氣受壓縮具有彈性。", "explain": "壓縮空氣具有彈力恢復性。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_air", "type": "tf", "title": "充氣的救生圈丟進水裡會浮在水面上，是因為裡面的空氣比水輕很多。", "explain": "空氣密度遠小於水，能提供巨大浮力。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_air", "type": "tf", "title": "把塞有衛生紙的杯子「斜斜的」壓進水裡，杯底的衛生紙也絕對不會濕掉。", "explain": "傾斜入水空氣會漏出，水跑進去衛生紙就會濕掉。", "ans": "X", "options": []}, {"subject": "nature", "lesson": "n_air", "type": "tf", "title": "燃燒線香時，香煙通常會隨著上升的熱空氣一起往上方飄動。", "explain": "熱空氣上升帶動煙霧向上。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_air", "type": "tf", "title": "吹泡泡時泡泡大多呈現圓球形，是因為內部的空氣均勻地向四周推開泡泡薄膜。", "explain": "氣體向各個方向均勻施壓。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_air", "type": "tf", "title": "冬天開暖氣時，暖氣出風口朝向天花板吹，整個房間會暖得最快最均勻。", "explain": "熱空氣本來就往上升，暖氣出風口應朝下吹，房間對流才均勻。", "ans": "X", "options": []}, {"subject": "nature", "lesson": "n_air", "type": "tf", "title": "兩個密封的氣球，一個充滿空氣，一個抽成真空，充滿空氣的氣球在精密秤上比較重。", "explain": "空氣具有重量。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_air", "type": "tf", "title": "把充飽氣的塑膠袋綁緊放在太陽下曝曬，塑膠袋會變得更加膨脹緊繃。", "explain": "空氣受熱會膨脹（熱脹冷縮）。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_air", "type": "tf", "title": "用吸管吸飲料時，是因為嘴巴把飲料直接吸進去，跟周遭空氣壓力完全無關。", "explain": "嘴巴抽走吸管內空氣，是大氣壓力把飲料推上來的。", "ans": "X", "options": []}, {"subject": "nature", "lesson": "n_air", "type": "tf", "title": "寶特瓶蓋緊後放進冰箱冷凍庫，過一段時間拿出來會發現瓶身變凹了，是因為瓶內空氣遇冷收縮。", "explain": "空氣遇冷體積收縮，內部氣壓變小。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_air", "type": "tf", "title": "空氣雖然摸不到，但當我們快跑或揮手時，臉上感受到的涼風就是空氣在流動。", "explain": "空氣流動形成風，肌膚能感覺到。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_air", "type": "tf", "title": "太空人去月球漫步不需要穿太空衣戴氧氣罩，因為太空中到處都是新鮮空氣。", "explain": "太空中是真空狀態，沒有空氣，必須自備氧氣設備。", "ans": "X", "options": []}, {"subject": "nature", "lesson": "n_air", "type": "tf", "title": "腳踏車輪胎如果充氣太飽，在大太陽底下長時間曝曬，可能會因為空氣膨脹而爆胎。", "explain": "氣體受熱膨脹壓力激增，可能引發爆胎。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_air", "type": "tf", "title": "把扁平的氣球套在寶特瓶口，將寶特瓶泡進熱水裡，氣球會慢慢自己鼓起來。", "explain": "瓶內空氣受熱膨脹，跑進氣球裡。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_air", "type": "tf", "title": "潛水員在水底吐出的氣泡會沉入水底，不會往水面上升。", "explain": "氣泡內的氣體比水輕，一定會向上浮出水面。", "ans": "X", "options": []}, {"subject": "nature", "lesson": "n_air", "type": "tf", "title": "將吸盤掛鉤壓在光滑玻璃上，把裡面的空氣擠出來後能牢牢吸住，是大氣壓力的作用。", "explain": "外界大氣壓力把吸盤緊緊壓在玻璃上。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_air", "type": "choice", "title": "把空注射筒抽滿空氣並堵住出口，用力往前推活塞，活塞可以前進一段。這證明空氣：", "explain": "活塞前進體積變小，證明空氣能被壓縮。", "options": ["有重量", "可以被壓縮", "會助燃", "容易燃燒"], "ans": 1}, {"subject": "nature", "lesson": "n_air", "type": "choice", "title": "在水裡將裝滿水的量筒倒立，拿吸管對著量筒口吹氣，量筒內的水位會：", "explain": "吹入的空氣佔據量筒上方空間，將水向下排擠。", "options": ["往上升", "往下降", "完全不變", "結冰"], "ans": 1}, {"subject": "nature", "lesson": "n_air", "type": "choice", "title": "在密封寶特瓶蓋上插兩根吸管，一根吹氣一根接水，吹氣時水會噴出，是利用什麼原理？", "explain": "吹入空氣增加空間壓力，將水擠壓噴出。", "options": ["空氣佔據空間產生推力", "水受熱膨脹", "水自己逃跑", "重力消失"], "ans": 0}, {"subject": "nature", "lesson": "n_air", "type": "choice", "title": "熱氣球和天燈能夠飛上天空，主要利用空氣的哪種自然特性？", "explain": "空氣受熱膨脹密度變小，熱空氣向上飄升。", "options": ["冷空氣下降", "熱空氣比冷空氣輕會上升", "空氣具有磁性", "空氣沒有重量"], "ans": 1}, {"subject": "nature", "lesson": "n_air", "type": "choice", "title": "下列哪一項「不是」空氣的自然特徵？", "explain": "氣體沒有固定的形狀。", "options": ["無色透明", "沒有氣味", "有固定的形狀", "會佔據空間"], "ans": 2}, {"subject": "nature", "lesson": "n_air", "type": "choice", "title": "把吹飽氣的氣球鬆開吹氣口，氣球會往反方向衝出去，這是利用：", "explain": "氣體噴出產生反作用推力。", "options": ["噴氣的反作用力", "磁力推動", "空氣變熱", "重力吸引"], "ans": 0}, {"subject": "nature", "lesson": "n_air", "type": "choice", "title": "用充氣幫浦給腳踏車輪胎打氣時，輪胎變硬且富有彈性，是因為：", "explain": "充入大量壓縮空氣，向外支撐胎壁。", "options": ["打入大量壓縮空氣產生支撐彈性", "輪胎變重了", "橡膠融化", "打入水分"], "ans": 0}, {"subject": "nature", "lesson": "n_air", "type": "choice", "title": "下列何者能直接證明「空氣佔據空間」？", "explain": "水進不去杯子是因為空氣佔據了空間。", "options": ["倒扣塞衛生紙的杯子垂直入水，紙不濕", "風吹動樹葉", "呼吸需要氧氣", "風箏在天空飛"], "ans": 0}, {"subject": "nature", "lesson": "n_air", "type": "choice", "title": "把空瓶子垂直壓入水中再傾斜，水面冒出的氣泡是：", "explain": "傾斜時水跑進去，將瓶內空氣擠壓成氣泡冒出。", "options": ["水蒸氣", "瓶內的空氣", "水底的泥土", "純氧氣"], "ans": 1}, {"subject": "nature", "lesson": "n_air", "type": "choice", "title": "充飽氣的皮球和排空空氣的扁皮球放在精密天平兩端，天平會：", "explain": "空氣有重量，充氣的皮球較重。", "options": ["充氣的一端下沉", "扁球的一端下沉", "完全平衡不動", "無法預測"], "ans": 0}, {"subject": "nature", "lesson": "n_air", "type": "choice", "title": "保鮮盒蓋緊微波後放涼，蓋子變得很難打開，是因為盒內空氣：", "explain": "空氣冷卻收縮使內部壓力小於外界大氣壓力。", "options": ["冷卻收縮氣壓降低", "被食物吃掉", "完全消失", "變成冰塊"], "ans": 0}, {"subject": "nature", "lesson": "n_air", "type": "choice", "title": "用吸管喝果汁時，能把果汁吸進嘴裡，主要是依靠：", "explain": "嘴巴減小吸管內壓力，外界大氣壓力將液體推進嘴裡。", "options": ["大氣壓力的推擠", "果汁自己往上跳", "吸管具有磁力", "地心引力"], "ans": 0}, {"subject": "nature", "lesson": "n_air", "type": "choice", "title": "下列哪種交通工具運行時「不需要」依靠空氣環境？", "explain": "太空中接近真空沒有空氣，衛星靠慣性與引力運行。", "options": ["民航飛機", "直升機", "熱氣球", "太空中運行的人造衛星"], "ans": 3}, {"subject": "nature", "lesson": "n_air", "type": "choice", "title": "給籃球打氣時越打越費力，是因為球內的空氣：", "explain": "球內壓縮空氣的反抗彈力增強。", "options": ["壓力越來越大", "溫度變冰冷", "體積自動變小", "跑出來了"], "ans": 0}, {"subject": "nature", "lesson": "n_air", "type": "choice", "title": "兩個倒立懸掛的紙杯，拿吹風機往中間空隙吹風，兩個紙杯會：", "explain": "中間空氣流速快氣壓降低，外側大氣壓力推擠使其靠攏。", "options": ["向中間靠攏", "向兩側分開", "往下掉落", "向上飛走"], "ans": 0}, {"subject": "nature", "lesson": "n_air", "type": "choice", "title": "吹氣球時，氣球會漸漸鼓起變大，這說明空氣具有什麼特性？", "explain": "氣球膨脹代表空氣進入並佔據了內部空間。", "options": ["會佔據空間", "有特殊的甜味", "會燃燒", "顏色是白色的"], "ans": 0}, {"subject": "nature", "lesson": "n_air", "type": "choice", "title": "將點燃的蠟燭用透明玻璃杯完全蓋住，過一會兒蠟燭熄滅，是因為：", "explain": "燃燒需要空氣中的氧氣，耗盡即熄滅。", "options": ["杯內助燃的氧氣消耗完畢", "風太大吹熄了", "杯子太冷了", "蠟燭融化光了"], "ans": 0}, {"subject": "nature", "lesson": "n_air", "type": "choice", "title": "將注射筒抽滿空氣堵住前端，用力推活塞後再「鬆開手」，活塞會：", "explain": "被壓縮的空氣具有向外彈開的恢復力。", "options": ["自動往後彈回一段", "繼續往前衝", "停在最前面不動", "粉碎破裂"], "ans": 0}, {"subject": "nature", "lesson": "n_air", "type": "choice", "title": "把氣球吹大綁緊，放進裝有冰塊的冰水盆中，氣球會：", "explain": "氣體遇冷體積收縮（熱脹冷縮）。", "options": ["稍微縮小變皺", "變得更膨脹", "立刻爆破", "完全沒有任何改變"], "ans": 0}, {"subject": "nature", "lesson": "n_air", "type": "choice", "title": "夏天在密閉的冷氣房裡，冷氣吹出來的冷空氣通常會：", "explain": "冷空氣比熱空氣重，會向下沉降。", "options": ["向下沉降", "向上飄到天花板", "停在原地不動", "變成白霧消失"], "ans": 0}, {"subject": "nature", "lesson": "n_air", "type": "choice", "title": "水槍能把水噴得又高又遠，通常是利用槍身內部的什麼力量？", "explain": "打氣加壓使內部空氣壓縮，扣板機時壓縮空氣釋放推擠水柱。", "options": ["壓縮空氣產生的推力", "電池的電力", "磁鐵的排斥力", "齒輪轉動"], "ans": 0}, {"subject": "nature", "lesson": "n_air", "type": "choice", "title": "在裝滿水的寶特瓶底戳一個小洞，蓋緊瓶蓋時水不太會流出來，打開瓶蓋水立刻噴出，是因為：", "explain": "開蓋後空氣進入上方產生壓力，水便在重力與氣壓下流出。", "options": ["打開瓶蓋後上方空氣進去產生壓力", "水變重了", "瓶底的洞變大了", "水被嚇到了"], "ans": 0}, {"subject": "nature", "lesson": "n_air", "type": "choice", "title": "在廚房煮開水時，看到壺嘴上方冒出白煙，而且白煙一直往上飄，這是因為：", "explain": "熱水蒸氣上升帶動周遭氣流向上。", "options": ["熱氣流往上升", "冷氣流往下降", "空氣有重量", "空氣被壓縮"], "ans": 0}, {"subject": "nature", "lesson": "n_air", "type": "choice", "title": "下列哪一個物品裡面「沒有」充滿空氣？", "explain": "裝滿開水的地方已經被水佔據，沒有空氣空間。", "options": ["裝滿開水的玻璃杯", "空鉛筆盒", "空書包", "空的餅乾鐵盒"], "ans": 0}, {"subject": "nature", "lesson": "n_air", "type": "choice", "title": "用洗手乳按壓瓶擠出洗手乳時，鬆開壓頭後壓頭會自己彈回來，主要是依靠內部的彈簧和：", "explain": "大氣壓力與機械彈簧協同運作。", "options": ["氣壓平衡與液體回填", "水變輕了", "馬達轉動", "磁力吸引"], "ans": 0}, {"subject": "nature", "lesson": "n_wind", "type": "tf", "title": "大自然中空氣產生流動，就會形成我們感受到的風。", "explain": "空氣流動即為風。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_wind", "type": "tf", "title": "操場上的風向袋如果完全垂直下垂動也不動，代表目前處於無風狀態。", "explain": "風力極小或無風時風向袋下垂。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_wind", "type": "tf", "title": "觀測風向與風力時，應該站在高大建築物密集的狹窄走廊測量最客觀準確。", "explain": "應在空曠平坦無障礙處觀測。", "ans": "X", "options": []}, {"subject": "nature", "lesson": "n_wind", "type": "tf", "title": "操場上的風向袋正向著北方水平展開，代表此時吹的是北風。", "explain": "飄向北方代表風從南方吹來，吹的是南風。", "ans": "X", "options": []}, {"subject": "nature", "lesson": "n_wind", "type": "tf", "title": "蒲福風級表中，數字級數越大代表風力越強烈。", "explain": "0級無風，級數越高風力越強。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_wind", "type": "tf", "title": "風箏是靠著迎風面受到氣流向上托起的力量而飛上天空的。", "explain": "迎角受相對氣流托起升空。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_wind", "type": "tf", "title": "氣象預報中的風向指針，指向哪裡就代表風吹往哪裡。", "explain": "氣象上的風向永遠是指「風吹來的方向」。", "ans": "X", "options": []}, {"subject": "nature", "lesson": "n_wind", "type": "tf", "title": "夏天海邊白天吹海風（海吹向陸地），晚上吹陸風（陸地吹向海）。", "explain": "陸地吸熱散熱比海水快，產生晝夜溫差氣壓流動。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_wind", "type": "tf", "title": "風向袋通常漆成鮮豔的橘白相間顏色，是為了讓觀測者在遠處更容易看清風向與風力。", "explain": "高對比警示色便於目視觀察。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_wind", "type": "tf", "title": "風向計前端箭頭指的方向，就是風吹過來的方向。", "explain": "箭頭迎著風吹來的方向。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_wind", "type": "tf", "title": "如果今天吹的是「西北風」，代表地面上的落葉會被風吹向東南方。", "explain": "風從西北吹來，將物品推向對面的東南方。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_wind", "type": "tf", "title": "在室內吹電風扇時，電風扇吹出來的風不是空氣流動產生的。", "explain": "扇葉轉動推動周遭空氣，流動形成人工風。", "ans": "X", "options": []}, {"subject": "nature", "lesson": "n_wind", "type": "tf", "title": "風力太強時（如颱風天），戶外活動容易發生路樹倒塌與招牌掉落危險。", "explain": "強風具有巨大的破壞力。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_wind", "type": "tf", "title": "風向計的後端尾翼面積通常做得比前端箭頭大很多。", "explain": "大尾翼受風推向順風處，箭頭便指出來風方向。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_wind", "type": "tf", "title": "使用指北針測量方位時，指北針的指針靜止時會指向正北方。", "explain": "受地磁吸引指針指南北方向。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_wind", "type": "tf", "title": "微風吹動時，池塘水面會泛起層層漣漪波紋。", "explain": "空氣流動帶動水表層波動。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_wind", "type": "tf", "title": "冬天台灣北部經常吹寒冷的西南季風。", "explain": "冬季台灣盛行東北季風。", "ans": "X", "options": []}, {"subject": "nature", "lesson": "n_wind", "type": "tf", "title": "帆船在大海中航行，只要沒有風也能全速向前衝。", "explain": "傳統帆船完全依靠風力推動船帆前進。", "ans": "X", "options": []}, {"subject": "nature", "lesson": "n_wind", "type": "tf", "title": "風力發電是利用風力吹動巨大葉片轉動發電機，屬於乾淨的綠色再生能源。", "explain": "風能轉為電能無碳排放。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_wind", "type": "tf", "title": "拿紙板對著臉用力搧動，臉上感覺涼涼的，是因為搧動產生了氣流。", "explain": "人為帶動空氣流動形成風。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_wind", "type": "tf", "title": "樹葉輕微搖動時，在蒲福風級中大約屬於 8 級大風。", "explain": "樹葉微動僅為 1~2 級輕風。", "ans": "X", "options": []}, {"subject": "nature", "lesson": "n_wind", "type": "tf", "title": "風向袋被風吹得完全水平筆直展開，代表此時風力相當強勁。", "explain": "風力越強，風向袋被托起得越平直。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_wind", "type": "tf", "title": "氣象站觀測風向時，通常會搭配風速計精確測量每秒風速。", "explain": "風向計定方向，風速測定速度。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_wind", "type": "tf", "title": "在山谷中露營，白天和夜晚因為山坡冷熱變化，常會吹谷風與山風。", "explain": "地形溫差形成規律局部風。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_wind", "type": "tf", "title": "放風箏時如果完全沒有任何風，不管怎麼逆風快跑，風箏都絕對不可能飛起來。", "explain": "人快跑時會創造相對氣流，風箏仍可短暫升空。", "ans": "X", "options": []}, {"subject": "nature", "lesson": "n_wind", "type": "choice", "title": "操場上的風向袋正向著「西南方」水平飄展，請問此時吹的是什麼風？", "explain": "風向是風吹來的方向！吹向西南代表風從東北來，為東北風。", "options": ["西南風", "東北風", "西北風", "東南風"], "ans": 1}, {"subject": "nature", "lesson": "n_wind", "type": "choice", "title": "風向計前端的「箭頭」正指向正南方，請問此時吹什麼風？", "explain": "風向計箭頭指的方向就是來風的方向，指南方即為南風。", "options": ["南風", "北風", "東風", "西風"], "ans": 0}, {"subject": "nature", "lesson": "n_wind", "type": "choice", "title": "氣象報告說今天吹「北風」，代表風是從哪裡吹向哪裡？", "explain": "北風就是從北方吹向南方的風。", "options": ["從北向南吹", "從南向北吹", "從東向西吹", "從西向東吹"], "ans": 0}, {"subject": "nature", "lesson": "n_wind", "type": "choice", "title": "下列哪種校園現象代表風力最強？", "explain": "大樹劇晃傘翻代表強風。", "options": ["煙囪的煙垂直上升", "樹葉微動", "國旗輕飄", "大樹劇烈搖晃且雨傘被吹翻"], "ans": 3}, {"subject": "nature", "lesson": "n_wind", "type": "choice", "title": "利用指北針配合風向計時，指北針的指針會指向哪個方位？", "explain": "地磁指北針指針指向北方。", "options": ["東方", "南方", "西方", "北方"], "ans": 3}, {"subject": "nature", "lesson": "n_wind", "type": "choice", "title": "走到戶外放風箏，想要風箏順利升空，放風箏的人應該：", "explain": "逆風跑能增加相對風速，使風箏產生上升力。", "options": ["順著風跑", "逆著風跑", "站著不動", "轉圈跑"], "ans": 1}, {"subject": "nature", "lesson": "n_wind", "type": "choice", "title": "下列哪項「不是」利用風力的生活實例？", "explain": "電梯靠馬達與鋼索運作，不靠風力。", "options": ["風力發電風車", "帆船在海面航行", "公園放風箏", "電梯上下移動"], "ans": 3}, {"subject": "nature", "lesson": "n_wind", "type": "choice", "title": "風向計尾翼面積比箭頭大，其力學作用是：", "explain": "大尾翼受風推向順風處，箭頭便指出來風方向。", "options": ["受風吹推到後方，使箭頭迎向來風", "美觀好看", "讓風向計轉更快", "增加重量"], "ans": 0}, {"subject": "nature", "lesson": "n_wind", "type": "choice", "title": "在操場自製簡易風向觀測工具，何者最靈敏實用？", "explain": "重量輕且受風面積大的紙條最容易隨風飄動。", "options": ["細長輕薄彩帶紙條", "大石頭", "厚鐵尺", "厚字典"], "ans": 0}, {"subject": "nature", "lesson": "n_wind", "type": "choice", "title": "看見學校國旗飄向「西北方」，此時地面吹的風向是：", "explain": "國旗被吹向西北，代表風是從對面的「東南方」吹來的，為東南風。", "options": ["西北風", "東南風", "東北風", "西南風"], "ans": 1}, {"subject": "nature", "lesson": "n_wind", "type": "choice", "title": "颱風來襲時路樹被連根拔起、招牌吹落，這大約相當於幾級以上的風力？", "explain": "10級以上強風能吹倒樹木、毀壞房屋。", "options": ["2級", "5級", "10級以上", "0級"], "ans": 2}, {"subject": "nature", "lesson": "n_wind", "type": "choice", "title": "冬季台灣各地常感受到的季節風主要是：", "explain": "冬季大陸冷高壓南下，台灣盛行東北季風。", "options": ["東北季風", "西南季風", "東南季風", "正南季風"], "ans": 0}, {"subject": "nature", "lesson": "n_wind", "type": "choice", "title": "如果看見炊煙垂直向上升起，幾乎沒有傾斜，代表當時風力約為：", "explain": "0級無風時煙直上。", "options": ["0級", "3級", "6級", "10級"], "ans": 0}, {"subject": "nature", "lesson": "n_wind", "type": "choice", "title": "下列何處「最不適合」設置風力發電廠？", "explain": "都會區大樓阻擋風勢且有噪音干擾。", "options": ["風力強勁的濱海地區", "開闊平坦的沿海空地", "高樓大廈密集的市中心住宅區", "風勢穩定的空曠山脊"], "ans": 2}, {"subject": "nature", "lesson": "n_wind", "type": "choice", "title": "觀測風向時，拿著紙條高舉，發現紙條飄向「東方」，吹的是什麼風？", "explain": "紙條飄向東，風是從西方吹來的，故為西風。", "options": ["東風", "西風", "南風", "北風"], "ans": 1}, {"subject": "nature", "lesson": "n_wind", "type": "choice", "title": "大自然中產生風的主要根本原因是：", "explain": "日照不均產生溫差與氣壓差，引發空氣對流。", "options": ["太陽照射使各地受熱不均，冷熱空氣流動", "地球自轉把水攪動", "植物吐出大量氧氣", "海浪拍打岸邊"], "ans": 0}, {"subject": "nature", "lesson": "n_wind", "type": "choice", "title": "騎腳踏車逆風前進時，會感到：", "explain": "迎面而來的強風會產生空氣阻力。", "options": ["非常輕鬆省力", "阻力很大比較費力", "速度自動變快", "完全沒感覺"], "ans": 1}, {"subject": "nature", "lesson": "n_wind", "type": "choice", "title": "下列哪一種工具是專門用來測量「風吹的速度快慢」的？", "explain": "風速計專門測量風速。", "options": ["風向袋", "風速計", "溫度計", "雨量筒"], "ans": 1}, {"subject": "nature", "lesson": "n_wind", "type": "choice", "title": "風向袋通常設置在機場或港口，主要目的是提供什麼即時資訊？", "explain": "提供飛機起降與船隻進出港時的風向風力參考。", "options": ["氣溫與濕度", "風向與風力強弱", "飛機航班時間", "海浪高度"], "ans": 1}, {"subject": "nature", "lesson": "n_wind", "type": "choice", "title": "夏天在操場運動，突然吹來一陣涼風，感覺舒服，這時風力大約是：", "explain": "吹在臉上微涼舒服為輕微風級。", "options": ["1~2級輕風微風", "7~8級大風", "12級狂風", "0級無風"], "ans": 0}, {"subject": "nature", "lesson": "n_wind", "type": "choice", "title": "下列哪一種現象表示「風力比微風更強」？", "explain": "樹枝搖晃、紙片吹起代表風力達到4級和風等級。", "options": ["炊煙輕微晃動", "樹葉飄落", "樹枝整枝搖晃且灰塵紙片飛揚", "水面平靜如鏡"], "ans": 2}, {"subject": "nature", "lesson": "n_wind", "type": "choice", "title": "如果風向計的箭頭指向「東北方」，此時國旗會飄向哪一方？", "explain": "吹東北風，旗幟順著風吹往相反的西南方。", "options": ["東北方", "西南方", "東南方", "西北方"], "ans": 1}, {"subject": "nature", "lesson": "n_wind", "type": "choice", "title": "古時候鄭和下西洋或是哥倫布航海，主要依靠大洋上的什麼前進？", "explain": "古代航海全憑季風與行星風系揚帆。", "options": ["定期盛行的信風季風", "船底的水流推動", "船長施展法術", "蒸汽機推動"], "ans": 0}, {"subject": "nature", "lesson": "n_wind", "type": "choice", "title": "下列關於「風」的敘述何者正確？", "explain": "風向是指風吹來的出發方向。", "options": ["眼睛可以直接看見風的顏色", "風是完全靜止不動的空氣", "風的流動方向就是風向定義的起點", "風不會受到建築物阻擋"], "ans": 2}, {"subject": "nature", "lesson": "n_wind", "type": "choice", "title": "在校園操場做風向實驗，全班測量結果最可能一致的前提是：", "explain": "同時間空曠地點能確保數據客觀準確。", "options": ["在同一時間、同一個空曠開闊地點觀測", "每個人躲在不同教室走廊", "閉上眼睛用手摸泥土", "看教室黑板"], "ans": 0}, {"subject": "nature", "lesson": "n_powder", "type": "tf", "title": "在科學實驗室中，絕對不可以隨意用舌頭舔嚐未知的白色粉末。", "explain": "實驗室安全第一守則：嚴禁以口嚐藥品。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_powder", "type": "tf", "title": "太白粉加進冷水攪拌均勻後，會形成完全清澈透明的溶液且永不沉澱。", "explain": "太白粉不溶於冷水，呈白濁狀，靜置會沉澱。", "ans": "X", "options": []}, {"subject": "nature", "lesson": "n_powder", "type": "tf", "title": "食鹽加入白醋中，會像小蘇打粉一樣劇烈冒出大量二氧化碳氣泡。", "explain": "食鹽與醋不會劇烈產生氣體。", "ans": "X", "options": []}, {"subject": "nature", "lesson": "n_powder", "type": "tf", "title": "棕褐色的碘液遇到太白粉時，會立刻產生深藍紫色的顏色變化。", "explain": "澱粉遇碘產生深藍紫色特徵反應。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_powder", "type": "tf", "title": "白糖加入水裡完全攪拌後，整杯水會維持清澈透明無色。", "explain": "糖完全溶解於水形成真溶液。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_powder", "type": "tf", "title": "手指摸摸看粗鹽結晶，摸起來有明顯硬硬粗粗的顆粒感。", "explain": "粗鹽為顆粒結晶體。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_powder", "type": "tf", "title": "做鬆餅蛋糕時加入小蘇打粉，加熱後會產生二氧化碳使糕點蓬鬆柔軟。", "explain": "小蘇打遇熱分解產生二氧化碳氣孔。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_powder", "type": "tf", "title": "太白粉通常是從馬鈴薯或樹薯等植物中提煉出來的澱粉。", "explain": "太白粉屬於食用澱粉類。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_powder", "type": "tf", "title": "用手直接大把抓取化學藥品是標準且安全的實驗操作動作。", "explain": "應使用藥匙或量匙取用藥品，避免腐蝕或污染。", "ans": "X", "options": []}, {"subject": "nature", "lesson": "n_powder", "type": "tf", "title": "觀察粉末氣味時，應該把鼻子湊近瓶口用力深吸一口氣。", "explain": "應使用搧氣入鼻法輕輕聞。", "ans": "X", "options": []}, {"subject": "nature", "lesson": "n_powder", "type": "tf", "title": "食鹽水溶液是弱酸性，滴在舌頭上感覺酸酸的。", "explain": "食鹽水為中性，味道是鹹的。", "ans": "X", "options": []}, {"subject": "nature", "lesson": "n_powder", "type": "tf", "title": "麵粉也是一種含有豐富澱粉的粉末，滴上碘液也會變成深藍紫色。", "explain": "麵粉含豐富澱粉遇碘變深藍紫。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_powder", "type": "tf", "title": "白糖與食鹽外觀非常相似，放在放大鏡下觀察，食鹽結晶多呈現立方體形狀。", "explain": "食鹽（氯化鈉）晶體為標準立方晶系。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_powder", "type": "tf", "title": "小蘇打粉加水後，可以用來清洗廚房抽油煙機上的油垢，具有清潔效果。", "explain": "弱鹼性小蘇打能乳化油脂助清潔。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_powder", "type": "tf", "title": "所有的白色調味粉末加進水裡，攪拌後都一定能完全溶解消失。", "explain": "太白粉、麵粉、滑石粉等皆不溶於水。", "ans": "X", "options": []}, {"subject": "nature", "lesson": "n_powder", "type": "tf", "title": "碘液原本的顏色是深綠色的液體。", "explain": "碘液為棕褐色或黃褐色。", "ans": "X", "options": []}, {"subject": "nature", "lesson": "n_powder", "type": "tf", "title": "白糖滴入碘液之後，也會變成深藍紫色。", "explain": "糖類不是澱粉，遇碘液不變藍紫色。", "ans": "X", "options": []}, {"subject": "nature", "lesson": "n_powder", "type": "tf", "title": "小蘇打粉遇到酸性液體（如檸檬汁、白醋）會產生劇烈氣泡反應。", "explain": "酸鹼中和產生碳酸釋放二氧化碳氣體。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_powder", "type": "tf", "title": "用手摸太白粉時，會感覺非常滑順細膩，像摸滑石粉一樣。", "explain": "太白粉粉末顆粒極細滑。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_powder", "type": "tf", "title": "把食鹽加熱炒過之後，食鹽會融化變成甜甜的麥芽糖。", "explain": "食鹽熔點高達800℃以上，乾炒不變糖。", "ans": "X", "options": []}, {"subject": "nature", "lesson": "n_powder", "type": "tf", "title": "在廚房裡，如果白糖罐與食鹽罐標籤掉了，在安全衛生的廚房可以透過嚐味道來分辨。", "explain": "廚房確定為食品級調味料可嚐，實驗室則嚴禁。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_powder", "type": "tf", "title": "太白粉加水勾芡煮湯時，加熱後會變黏稠透明，這叫澱粉糊化現象。", "explain": "澱粉加熱吸水膨脹糊化變稠。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_powder", "type": "tf", "title": "食鹽在常溫下完全燃燒會散發濃烈爆米花香味。", "explain": "食鹽不可燃。", "ans": "X", "options": []}, {"subject": "nature", "lesson": "n_powder", "type": "tf", "title": "小蘇打粉加白醋冒出的氣體是氧氣，把點燃的線香放進去會燃燒得更劇烈。", "explain": "產生的是二氧化碳，二氧化碳不助燃，會使線香熄滅。", "ans": "X", "options": []}, {"subject": "nature", "lesson": "n_powder", "type": "tf", "title": "利用碘液反應可以檢驗食物中是否含有澱粉成分。", "explain": "碘液檢驗法是生物化學標準澱粉鑑定法。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_powder", "type": "choice", "title": "廚房四種白色粉末：白糖、食鹽、太白粉、小蘇打。滴入棕褐色碘液後，哪種會變深藍紫色？", "explain": "太白粉含澱粉，遇碘呈藍紫色反應。", "options": ["食鹽", "白糖", "太白粉", "小蘇打"], "ans": 2}, {"subject": "nature", "lesson": "n_powder", "type": "choice", "title": "小蘇打粉加入白醋後會劇烈冒泡，冒出的氣體是：", "explain": "酸鹼反應釋放二氧化碳氣體。", "options": ["氧氣", "二氧化碳", "水蒸氣", "氫氣"], "ans": 1}, {"subject": "nature", "lesson": "n_powder", "type": "choice", "title": "手指觸摸下列白色粉末，何者顆粒感最明顯、最粗硬？", "explain": "粗鹽為顆粒結晶，觸感粗糙硬實。", "options": ["粗鹽結晶", "太白粉", "麵粉", "奶粉"], "ans": 0}, {"subject": "nature", "lesson": "n_powder", "type": "choice", "title": "想辨別杯中白色粉末是小蘇打還是太白粉，滴入哪種液體最適合快速判別？", "explain": "太白粉遇碘變藍紫，小蘇打遇醋劇烈冒泡。", "options": ["白醋或碘液", "沙拉油", "純酒精", "醬油"], "ans": 0}, {"subject": "nature", "lesson": "n_powder", "type": "choice", "title": "實驗室中聞未知氣味的正確安全操作方式是：", "explain": "搧氣入鼻法是標準安全操作。", "options": ["鼻子湊近深吸", "用手在容器上方輕輕搧聞", "大口吸氣", "用吸管吸入"], "ans": 1}, {"subject": "nature", "lesson": "n_powder", "type": "choice", "title": "做鬆餅蛋糕加入小蘇打粉的主要目的是：", "explain": "受熱產生二氧化碳氣孔讓口感鬆軟。", "options": ["產生二氧化碳使糕點蓬鬆柔軟", "增加甜味", "防發霉", "染成雪白"], "ans": 0}, {"subject": "nature", "lesson": "n_powder", "type": "choice", "title": "下列哪一種粉末摸起來最滑膩細柔？", "explain": "太白粉為極細澱粉顆粒，觸感極滑。", "options": ["粗鹽", "太白粉", "冰糖粒", "晶冰糖"], "ans": 1}, {"subject": "nature", "lesson": "n_powder", "type": "choice", "title": "白糖加水完全溶解後，整杯水呈現：", "explain": "糖完全溶解形成透明水溶液。", "options": ["混濁白色", "透明無色清澈", "淡藍色", "結凍硬化"], "ans": 1}, {"subject": "nature", "lesson": "n_powder", "type": "choice", "title": "下列哪一種調味粉末加白醋「會」產生大量冒泡反應？", "explain": "小蘇打遇酸反應產生二氧化碳。", "options": ["食鹽", "白糖", "小蘇打粉", "麵粉"], "ans": 2}, {"subject": "nature", "lesson": "n_powder", "type": "choice", "title": "在熟米飯、白吐司上滴加棕褐色碘液，顏色會：", "explain": "米飯吐司皆富含澱粉，遇碘呈藍紫色。", "options": ["變深藍紫色", "變亮黃色", "完全沒變色", "變綠色"], "ans": 0}, {"subject": "nature", "lesson": "n_powder", "type": "choice", "title": "太白粉倒入冷水中攪拌後靜置十分鐘，杯底會出現：", "explain": "太白粉不溶於冷水，靜置會沉澱於底。", "options": ["白色沉澱物", "氣泡全部浮出", "金黃色結晶", "冰塊"], "ans": 0}, {"subject": "nature", "lesson": "n_powder", "type": "choice", "title": "將小蘇打加醋產生的氣體導入澄清石灰水中，澄清石灰水會：", "explain": "二氧化碳與石灰水反應生成碳酸鈣白色沉澱。", "options": ["變成白濁色", "變成鮮紅色", "完全透明不變", "結成冰塊"], "ans": 0}, {"subject": "nature", "lesson": "n_powder", "type": "choice", "title": "下列哪一種食材滴入碘液「不會」變成深藍紫色？", "explain": "肥肉主要成分是油脂，不含澱粉。", "options": ["白蘿蔔片", "馬鈴薯片", "肥豬肉片", "煮熟的麵條"], "ans": 2}, {"subject": "nature", "lesson": "n_powder", "type": "choice", "title": "利用放大鏡觀察食鹽，會發現它的顆粒形狀大多是：", "explain": "食鹽為立方體結晶。", "options": ["細長針狀", "扁平圓形", "立方體結晶", "五角星形"], "ans": 2}, {"subject": "nature", "lesson": "n_powder", "type": "choice", "title": "料理煮酸辣湯時想讓湯汁變得濃稠滑順，通常會加入哪種粉調水勾芡？", "explain": "太白粉水加熱糊化具有增稠勾芡效果。", "options": ["太白粉水", "食鹽水", "小蘇打水", "砂糖水"], "ans": 0}, {"subject": "nature", "lesson": "n_powder", "type": "choice", "title": "烘焙麵包時，為了讓麵糰發酵膨脹，除了小蘇打有時還會加入：", "explain": "酵母菌發酵產生二氧化碳使麵糰膨起。", "options": ["酵母菌", "粗鹽", "醬油", "太白粉"], "ans": 0}, {"subject": "nature", "lesson": "n_powder", "type": "choice", "title": "小蘇打加白醋產生的氣體，拿燃燒的線香靠近檢驗，線香會：", "explain": "二氧化碳不助燃亦不可燃，使火焰熄滅。", "options": ["燃燒得更旺盛", "立刻熄滅", "發出藍色火花", "爆炸"], "ans": 1}, {"subject": "nature", "lesson": "n_powder", "type": "choice", "title": "下列何者是食鹽在生活中的主要用途？", "explain": "食鹽是重要調味料且能高滲透壓抑菌防腐。", "options": ["調味增鮮與醃製防腐", "當作洗髮精", "製造氣球", "當水泥蓋房子"], "ans": 0}, {"subject": "nature", "lesson": "n_powder", "type": "choice", "title": "取用粉末藥品時，下列何種工具最適當？", "explain": "乾淨乾燥藥匙避免污染或受潮。", "options": ["乾淨乾燥的小藥匙", "剛洗過濕漉漉的雙手", "鉛筆筆尖", "橡皮擦"], "ans": 0}, {"subject": "nature", "lesson": "n_powder", "type": "choice", "title": "小蘇打水溶液用紅色石蕊試紙測試，試紙會變成：", "explain": "小蘇打呈弱鹼性，使紅試紙變藍。", "options": ["藍色", "紅色", "綠色", "黑色"], "ans": 0}, {"subject": "nature", "lesson": "n_powder", "type": "choice", "title": "白糖加水溶解後，如果喝一小口，味道是：", "explain": "白糖溶解後具蔗糖特有甜味。", "options": ["甜甜的", "鹹鹹的", "酸酸的", "苦澀的"], "ans": 0}, {"subject": "nature", "lesson": "n_powder", "type": "choice", "title": "如果不小心把大量食鹽灑到地板上，最衛生的處理方法是：", "explain": "掉地上受污染食品應丟棄不可再食用。", "options": ["用掃把掃起丟進垃圾桶", "抓起來放回鹽罐煮湯", "用水沖進客廳地毯", "用吹風機吹跑"], "ans": 0}, {"subject": "nature", "lesson": "n_powder", "type": "choice", "title": "下列哪一種調味料在高溫加熱乾燒時，最容易燒焦發黑並發出焦糖香？", "explain": "糖受熱脫水焦糖化變黑。", "options": ["砂糖", "食鹽", "小蘇打", "太白粉"], "ans": 0}, {"subject": "nature", "lesson": "n_powder", "type": "choice", "title": "為了防止廚房裡的調味粉受潮結塊，保存時應該放在：", "explain": "密封防潮保持乾燥是最佳保存法。", "options": ["陰涼乾燥密封處", "水龍頭正下方", "大太陽下曝曬", "冰箱冷凍庫敞開"], "ans": 0}, {"subject": "nature", "lesson": "n_powder", "type": "choice", "title": "在「粉末溶解與辨識」實驗結束後，桌面上的殘留藥品與廢液應該：", "explain": "妥善清理與廢液分類是良好實驗習慣。", "options": ["依老師指示分類倒入廢液桶，並清洗乾淨收拾", "全部抹在隔壁同學衣服上", "偷偷倒在書包裡", "不用管它直接下課"], "ans": 0}, {"subject": "nature", "lesson": "n_dissolve", "type": "tf", "title": "固定量的水中，食鹽可以無限量地完全溶化不見。", "explain": "固定水量的溶解量有上限，達飽和即不再溶解。", "ans": "X", "options": []}, {"subject": "nature", "lesson": "n_dissolve", "type": "tf", "title": "把冰糖敲碎能加快溶解速度，是因為顆粒變小，與水接觸的表面積變大了。", "explain": "接觸面積越大，溶解擴散速度越快。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_dissolve", "type": "tf", "title": "飽和食鹽水放在平盤上曬乾，水分蒸發後，原本溶在水裡的食鹽結晶會重新出現。", "explain": "水分蒸發後溶質結晶析出。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_dissolve", "type": "tf", "title": "把沙子倒進水裡用力攪拌，靜置後沙子沉在杯底，這算是沙子溶解在水中。", "explain": "混濁沉澱非溶解，溶解需均勻透明且不沉澱。", "ans": "X", "options": []}, {"subject": "nature", "lesson": "n_dissolve", "type": "tf", "title": "大部分固體溶質在水溫升高時，能溶解的總量通常會增加。", "explain": "多數固體在熱水中的溶解度大於冷水。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_dissolve", "type": "tf", "title": "完全溶解的食鹽水，如果放在密閉瓶中放三天，食鹽會自己慢慢沉澱回瓶底。", "explain": "真溶液在密閉或水未蒸發時極為穩定，不會自行沉澱。", "ans": "X", "options": []}, {"subject": "nature", "lesson": "n_dissolve", "type": "tf", "title": "「溶解」是指溶質顆粒均勻分散在溶劑中，肉眼看不到顆粒且清澈透明。", "explain": "此為科學上溶解之標準定義。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_dissolve", "type": "tf", "title": "將 5g 食鹽溶於 100g 水中，食鹽水總重量剛好是 105g，符合質量守恆。", "explain": "溶質重 + 溶劑重 = 溶液總重。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_dissolve", "type": "tf", "title": "在進行溶解快慢對比實驗時，只能有一個條件不一樣，其餘條件必須完全相同。", "explain": "控制變因科學方法的核心原則。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_dissolve", "type": "tf", "title": "用熱水泡奶粉通常比用冰水泡奶粉溶解得更快且更不易結塊。", "explain": "溫度高分子運動劇烈加速溶解。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_dissolve", "type": "tf", "title": "杯底已經出現沉澱鹽粒的飽和食鹽水，只要再加水攪拌，沉澱的鹽就可以繼續溶解。", "explain": "增加溶劑量能提高可容納溶質量。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_dissolve", "type": "tf", "title": "攪拌只能加快溶解速度，不能改變該溫度下這杯水能溶解的最大總量。", "explain": "攪拌只改變速率，不改變飽和溶解度。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_dissolve", "type": "tf", "title": "把糖倒入水中不攪拌，糖就永遠絕對不可能在水中溶解。", "explain": "分子自然擴散仍會慢慢溶解，只是速度極慢。", "ans": "X", "options": []}, {"subject": "nature", "lesson": "n_dissolve", "type": "tf", "title": "在比較不同水溫溶解量的實驗中，水量的多寡屬於必須嚴格相同的「控制變因」。", "explain": "水量必須維持一致才能公平比較。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_dissolve", "type": "tf", "title": "飽和食鹽水喝起來的鹹度，已經達到該水溫下的最鹹極限濃度。", "explain": "達到最大飽和濃度。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_dissolve", "type": "tf", "title": "不管加多少水，一顆大冰糖都絕對不可能在水中完全溶化。", "explain": "只要水量足夠，大冰糖也能完全溶解。", "ans": "X", "options": []}, {"subject": "nature", "lesson": "n_dissolve", "type": "tf", "title": "用量匙取鹽做比較實驗時，每匙都必須用刮板刮平（平匙），確保每次加入量相同。", "explain": "維持添加份量一致的標準操作。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_dissolve", "type": "tf", "title": "喝熱咖啡加方糖，拿湯匙攪拌可以讓方糖更快溶化消失。", "explain": "攪拌帶動液體對流加速溶解。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_dissolve", "type": "tf", "title": "海水之所以鹹鹹的，是因為海水中溶解了大量的食鹽等礦物質鹽類。", "explain": "天然海水為多種鹽類之水溶液。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_dissolve", "type": "tf", "title": "把飽和糖水放進冰箱冷卻，原本溶在裡面的糖可能會因為溫度降低而沉澱析出。", "explain": "降溫溶解度降低，多餘溶質析出結晶。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_dissolve", "type": "tf", "title": "將胡椒粉撒入熱湯中攪拌，整碗湯變濁，代表胡椒粉完全溶解在湯裡。", "explain": "胡椒為植物顆粒不溶於水，沉澱懸浮非溶解。", "ans": "X", "options": []}, {"subject": "nature", "lesson": "n_dissolve", "type": "tf", "title": "在實驗中，被水溶解的物質（如糖、鹽）稱為「溶質」，水稱為「溶劑」。", "explain": "化學專有名詞定義。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_dissolve", "type": "tf", "title": "冰水裡溶解食鹽的速度通常比溫熱水慢很多。", "explain": "低溫分子動能小擴散慢。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_dissolve", "type": "tf", "title": "洗衣服時洗衣粉如果倒太多水太少，衣服洗完可能會殘留未溶解的洗衣粉顆粒。", "explain": "超過飽和量無法完全溶解。", "ans": "O", "options": []}, {"subject": "nature", "lesson": "n_dissolve", "type": "tf", "title": "糖完全溶解在水裡後，拿濾紙過濾，所有的糖都會被濾紙攔截下來留給我們。", "explain": "溶解的分子極細小，能穿透濾紙孔隙。", "ans": "X", "options": []}, {"subject": "nature", "lesson": "n_dissolve", "type": "choice", "title": "想讓大冰糖在水裡加速溶解，下列何者「完全沒有幫助」？", "explain": "加熱、攪拌、磨碎是三大法寶，加鹽無效。", "options": ["用熱水代替冷水", "拿湯匙快速攪拌", "將冰糖敲成細碎末", "在水裡加一大匙食鹽"], "ans": 3}, {"subject": "nature", "lesson": "n_dissolve", "type": "choice", "title": "想研究「水溫對溶解快慢的影響」，實驗時哪項條件必須保持「不一樣」？", "explain": "實驗目的為操縱變因，測水溫則只有水溫不同。", "options": ["兩杯水的水溫", "兩杯水的水量", "加入的糖量", "攪拌的速度"], "ans": 0}, {"subject": "nature", "lesson": const CHINESE_READINGS = {"c_l7": [{"passageTitle": "【閱讀素養題組】：尋找大自然的風鈴", "passage": "清晨，晨曦穿透薄霧灑在綠油油的稻浪上。小宇跟著外公漫步在鄉間田埂旁，迎面吹來一陣陣帶著微甜稻香的涼風。外公笑著問：「小宇，你有聽見大自然的風鈴在響嗎？」小宇閉上眼睛，靜靜聆聽。果然，微風拂過結實纍纍的稻穗，發出沙沙沙的輕柔細語；樹梢上的麻雀也跟著輕快啼鳴，宛如一場熱鬧的大自然交響樂。這時，小宇深吸了一口氣，空氣中除了稻香，還夾雜著泥土經朝露潤澤後的芬芳芬多精。原來，只要放下匆忙的腳步、打開心靈的窗戶，摸不著的風也能帶來最動人的詩篇。", "questions": [{"q": "文章中，外公所說的「大自然的風鈴聲」實際上是指什麼聲音？", "options": ["微風吹過稻穗時發出的沙沙細語聲與鳥鳴", "真正的金屬金屬門鈴聲", "遠處工廠火車發出的汽笛聲", "大雨打在鐵皮屋上的轟隆聲"], "ans": 0, "exp": "從文章中「微風拂過結實纍纍的稻穗，發出沙沙沙的輕柔細語」可明確得知。"}, {"q": "小宇透過閉上眼睛與深呼吸，主要運用了哪兩種感官來體會大自然的美好？", "options": ["聽覺與嗅覺", "視覺與觸覺", "味覺與視覺", "只有嗅覺"], "ans": 0, "exp": "小宇「靜靜聆聽（聽覺）」風鈴鳥鳴，並「深吸一口氣聞到稻香與泥土芳香（嗅覺）」。"}, {"q": "讀完這篇短文，作者最想要告訴讀者的核心啟示是什麼？", "options": ["放慢腳步用心體會，就能在大自然中獲得豐盛的心靈感動", "稻穗成熟時必須趕快採收防麻雀偷吃", "清晨的鄉下非常危險不要隨便散步", "金黃色的稻米煮成飯最美味"], "ans": 0, "exp": "文章末段點出主旨：放慢腳步、打開心靈窗戶，就能感受生活周遭的大自然美好。"}]}], "c_l8": [{"passageTitle": "【閱讀素養題組】：海灘上的小房客", "passage": "夏天熱鬧的墾丁海灘上，遊客們享受著陽光與浪花。在岩石縫隙中，一隻小寄居蟹正急促地爬行著。牠原本居住的螺殼因為身體長大而顯得緊繃侷促，柔軟的腹部甚至露在殼外，隨時有被天敵海鳥啄食的危險。然而，牠在炙熱的沙灘上找了大半天，卻一顆天然海螺殼也找不到，因為美麗的貝殼早已被來往的遊客拾撿一空。最後，小寄居蟹只能無奈地鑽進一個破碎的黃色塑膠瓶蓋裡。瓶蓋邊緣銳利，不但無法隔絕烈日高溫，還不時刮傷牠幼嫩的腹部。海風吹拂著沙灘，似乎也在為這隻找不到真正家園的小生物嘆息。", "questions": [{"q": "小寄居蟹為什麼必須在沙灘上急切尋找新螺殼？", "options": ["因為身體長大原本螺殼太小，柔軟腹部露在外面有生存危險", "因為舊外殼顏色不好看想換新衣服", "因為牠想把貝殼拿去市場賣錢", "為了儲存過冬的食物"], "ans": 0, "exp": "文章第二句提及：原本螺殼因長大而緊繃侷促，腹部外露面臨被天敵啄食的威脅。"}, {"q": "沙灘上的寄居蟹之所以「無殼可換」，根本原因是什麼？", "options": ["遊客過度撿拾沙灘上的貝殼帶回家", "海浪把貝殼全部溶化成海水", "海鳥把所有的螺殼全部吃光了", "寄居蟹不喜歡天然的螺殼"], "ans": 0, "exp": "文章明確指出：「因為美麗的貝殼早已被來往的遊客拾撿一空」。"}, {"q": "這篇文章帶給我們最重要的環境保育行動省思是：", "options": ["到海邊旅遊時，帶走垃圾、留下貝殼，讓自然資源回歸生態", "把海邊的寄居蟹全部抓回家養在玻璃箱中", "在沙灘上丟棄更多塑膠瓶蓋幫助寄居蟹蓋房子", "禁止所有人靠近大海"], "ans": 0, "exp": "愛護海洋生態的核心原則是留下自然之物、帶走人造垃圾，守護生物棲地。"}]}], "c_l9": [{"passageTitle": "【閱讀素養題組】：走進千古傳唱的阿塱壹", "passage": "阿塱壹古道橫跨屏東牡丹旭海與台東達仁南田之間，是台灣少數未開闢環島公路的原始海岸秘境。走在圓潤光滑的南田石礫灘上，耳邊不斷傳來陣陣清脆的「唰啦、唰啦」聲響，那是潮水拍岸退去時，成千上萬顆南田石相互滾動撞擊合奏出的自然樂章。沿途山海交錯、懸崖峭壁高聳入雲，登山者必須抓緊繩索攀爬高繞，每一步都踏穩踩實，展現對大自然的敬畏。如今，這裡劃設為旭海觀音鼻自然保留區，每天實施入山總量管制，讓綠蠵龜、椰子蟹與珍貴海岸植被得以在不受干擾的淨土中世代繁衍。", "questions": [{"q": "阿塱壹海岸上著名的「唰啦 場響起了長達數分鐘雷鳴般的掌聲與喝采。", "questions": [{"q": "合唱團剛開始排練不順利、氣氛糟糕的主因是什麼？", "options": ["團員們只看見彼此聲音的缺點，互相抱怨排擠", "指揮老師完全不會看樂譜", "大家都不想參加音樂會", "森林突然下起暴風雨把舞台吹垮"], "ans": 0, "exp": "第一段指出：團員互相抱怨指責聲音刺耳或笨重，缺乏包容合作。"}, {"q": "貓頭鷹指揮所說的「世界上沒有完全相同的樹葉」，意思是：", "options": ["每個人都是獨特的個體，擁抱多元差異才能融合成最美成果", "樹葉生病了需要澆水施肥", "合唱團應該改去收集樹葉比賽", "唱歌跟樹葉沒有任何關係"], "ans": 0, "exp": "比喻多元共榮：接納每個人天生的獨特性，透過調和互補展現團結力量。"}]}]};

let currentLesson = 'c_l7';
let currentChineseMode = 'chest';

let score = 0;

function init() {
  switchSubject('chinese');
  fetchCloudSheet();
}

function switchSubject(sub) {
  currentSubject = sub;
  closeNotebook();
  document.querySelectorAll('.sub-btn').forEach(btn => btn.classList.remove('active'));
  const map = { chinese:0, math:1, nature:2, english:3 };
  if (document.querySelectorAll('.sub-btn')[map[sub]]) {
    document.querySelectorAll('.sub-btn')[map[sub]].classList.add('active');
  }

  const cSubBar = document.getElementById('chineseSubBar');
  cSubBar.style.display = (sub === 'chinese') ? 'flex' : 'none';

  const select = document.getElementById('lessonSelect');
  select.innerHTML = "";
  LESSON_CATALOG[sub].forEach(l => {
    const opt = document.createElement('option');
    opt.value = l.id;
    opt.innerText = l.name;
    select.appendChild(opt);
  });
  currentLesson = LESSON_CATALOG[sub][0].id;
  select.value = currentLesson;

  loadQuestions();
}

function onLessonChange() {
  currentLesson = document.getElementById('lessonSelect').value;
  loadQuestions();
}

function switchChineseMode(mode) {
  currentChineseMode = mode;
  document.querySelectorAll('.c-sub-btn').forEach(b => b.classList.remove('active'));
  const modes = ['chest', 'unscramble', 'idiom', 'metaphor', 'comprehend', 'reading', 'quiz'];
  const idx = modes.indexOf(mode);
  if (idx !== -1 && document.querySelectorAll('.c-sub-btn')[idx]) {
    document.querySelectorAll('.c-sub-btn')[idx].classList.add('active');
  }
  loadQuestions();
}

function loadQuestions() {
  const fb = document.getElementById('feedbackBox');
  fb.style.display = 'none';
  currentIndex = 0;
  score = 0;
  currentQuestions = [];
  document.getElementById('diagramArea').innerHTML = "";

  const lKey = currentLesson === 'all' ? 'c_l7' : currentLesson;

  if (currentSubject === 'chinese') {
    handleChineseLoad(lKey);
  } else if (currentSubject === 'math') {
    handleMathLoad();
  } else if (currentSubject === 'nature') {
    handleNatureLoad();
  } else if (currentSubject === 'english') {
    handleEnglishLoad();
  }
}

// ---------------- 國語島全能架構 ----------------
function handleChineseLoad(lKey) {
  document.getElementById('diagramArea').innerHTML = "";

  if (currentChineseMode === 'chest') {
    document.getElementById('statusRow').style.display = 'none';
    document.getElementById('poolBadge').innerText = "生字學習寶箱";
    currentChestCharIndex = 0;
    renderChineseChest(lKey);
  } else if (currentChineseMode === 'unscramble') {
    document.getElementById('statusRow').style.display = 'flex';
    document.getElementById('typeBadge').innerText = "句子重組積木";
    const sList = CHINESE_SENTENCES[lKey] || CHINESE_SENTENCES['c_l7'];
    currentQuestions = [...sList].sort(() => Math.random() - 0.5);
    document.getElementById('poolBadge').innerText = "句子重組：共 " + currentQuestions.length + " 關挑戰！";
    renderUnscrambleQuestion();
  } else if (currentChineseMode === 'idiom') {
    document.getElementById('statusRow').style.display = 'flex';
    document.getElementById('typeBadge').innerText = "成語情境運用";
    const iList = CHINESE_IDIOMS[lKey] || CHINESE_IDIOMS['c_l7'];
    currentQuestions = [...iList].sort(() => Math.random() - 0.5);
    document.getElementById('poolBadge').innerText = "成語闖關：共 " + currentQuestions.length + " 關挑戰！";
    renderIdiomQuestion();
  } else if (currentChineseMode === 'metaphor') {
    document.getElementById('statusRow').style.display = 'flex';
    document.getElementById('typeBadge').innerText = "譬喻修辭大師";
    const mList = CHINESE_METAPHORS[lKey] || CHINESE_METAPHORS['c_l7'];
    currentQuestions = [...mList].sort(() => Math.random() - 0.5);
    document.getElementById('poolBadge').innerText = "譬喻修辭：共 " + currentQuestions.length + " 題挑戰！";
    renderGeneralChoiceQuestion();
  } else if (currentChineseMode === 'comprehend') {
    document.getElementById('statusRow').style.display = 'flex';
    document.getElementById('typeBadge').innerText = "句意深度理解";
    const uList = CHINESE_SENTENCE_UNDERSTANDING[lKey] || CHINESE_SENTENCE_UNDERSTANDING['c_l7'];
    currentQuestions = [...uList].sort(() => Math.random() - 0.5);
    document.getElementById('poolBadge').innerText = "句意理解：共 " + currentQuestions.length + " 題挑戰！";
    renderGeneralChoiceQuestion();
  } else if (currentChineseMode === 'reading') {
    document.getElementById('statusRow').style.display = 'flex';
    document.getElementById('typeBadge').innerText = "素養閱讀測驗";
    const rList = CHINESE_READINGS[lKey] || CHINESE_READINGS['c_l7'];
    const selectedGroup = sample(rList);
    currentQuestions = selectedGroup.questions.map(q => ({
      ...q,
      passageTitle: selectedGroup.passageTitle,
      passage: selectedGroup.passage
    }));
    document.getElementById('poolBadge').innerText = "篇章閱讀：" + selectedGroup.passageTitle + " (共 " + currentQuestions.length + " 題)";
    renderReadingQuestion();
  } else if (currentChineseMode === 'quiz') {
    document.getElementById('statusRow').style.display = 'flex';
    document.getElementById('typeBadge').innerText = "課文生字測驗";
    let pool = STATIC_DATABASE.filter(q => q.subject === 'chinese');
    if (CLOUD_QUESTIONS.length > 0) {
      const cloudP = CLOUD_QUESTIONS.filter(q => q.subject.includes("國語"));
      if (cloudP.length > 0) pool = cloudP;
    }
    if (currentLesson !== 'all') {
      pool = pool.filter(q => q.lesson === currentLesson);
    }
    const shuffled = [...pool].sort(() => Math.random() - 0.5);
    currentQuestions = shuffled.slice(0, Math.min(shuffled.length, 10));
    document.getElementById('poolBadge').innerText = "可用真題：" + pool.length + " 題 (每次隨機抽10題)";
    renderStandardQuiz();
  }
}

// 2. 句子重組積木機渲染
function renderUnscrambleQuestion() {
  const fb = document.getElementById('feedbackBox');
  fb.style.display = 'none';

  if (currentIndex >= currentQuestions.length) {
    document.getElementById('qTitle').innerText = "🎉 太棒了！你完成了本課所有句子重組積木挑戰！總得分：" + score + " 分";
    document.getElementById('optionArea').innerHTML = '<div style="text-align:center; padding:20px;">' +
        '<button class="next-btn" onclick="switchChineseMode('idiom')">進入下一個成語填空挑戰 ➔</button>' +
      '</div>';
    return;
  }

  unscrambleCurrent = currentQuestions[currentIndex];
  document.getElementById('progressText').innerText = "第 " + (currentIndex + 1) + " / " + currentQuestions.length + " 關";
  document.getElementById('scoreText').innerText = "得分：" + score;
  document.getElementById('qTitle').innerText = "把積木排成通順的句子！";

  unscrambleUserBlocks = [];
  unscrambleAvailableBlocks = [...unscrambleCurrent.blocks].sort(() => Math.random() - 0.5);

  renderUnscrambleDOM();
}

function renderUnscrambleDOM() {
  let targetHTML = '<div class="unscramble-target-box">';
  if (unscrambleUserBlocks.length === 0) {
    targetHTML += '<span style="color:#94a3b8; font-weight:700; font-size:15px; margin:auto;">點下方的積木放到這裡</span>';
  } else {
    unscrambleUserBlocks.forEach((text, idx) => {
      targetHTML += '<div class="word-block" onclick="removeUnscrambleBlock(' + idx + ')">' + text + '</div>';
    });
  }
  targetHTML += '</div>';

  let sourceHTML = '<div class="unscramble-source-box">';
  unscrambleAvailableBlocks.forEach((text) => {
    const isUsed = unscrambleUserBlocks.includes(text) ? "used" : "";
    sourceHTML += '<div class="word-block ' + isUsed + '" onclick="addUnscrambleBlock('' + text + '')">' + text + '</div>';
  });
  sourceHTML += '</div>';

  let actionsHTML = '<div class="unscramble-actions">' +
      '<button class="unscramble-btn btn-reset-blocks" onclick="resetUnscrambleBlocks()">全部退回 ↺</button>' +
      '<button class="unscramble-btn btn-submit-blocks" onclick="submitUnscramble()">送出檢查 ✔</button>' +
    '</div>';

  document.getElementById('optionArea').innerHTML = targetHTML + sourceHTML + actionsHTML;
}

function addUnscrambleBlock(text) {
  if (!unscrambleUserBlocks.includes(text)) {
    unscrambleUserBlocks.push(text);
    renderUnscrambleDOM();
  }
}

function removeUnscrambleBlock(idx) {
  unscrambleUserBlocks.splice(idx, 1);
  renderUnscrambleDOM();
}

function resetUnscrambleBlocks() {
  unscrambleUserBlocks = [];
  renderUnscrambleDOM();
}

function submitUnscramble() {
  const userSentence = unscrambleUserBlocks.join("");
  const target = unscrambleCurrent.target.replace(/\s+/g, '');
  const isCorrect = (userSentence === target);

  const fb = document.getElementById('feedbackBox');
  const fbTitle = document.getElementById('fbTitle');
  const fbDetail = document.getElementById('fbDetail');

  if (isCorrect) {
    score += 10;
    fb.className = "feedback-box correct";
    fbTitle.innerText = "🎯 太厲害了！句子完全通順正確！";
    fbDetail.innerText = "完整句子：" + unscrambleCurrent.target;
  } else {
    fb.className = "feedback-box wrong";
    fbTitle.innerText = "💡 讀起來好像不太通順喔！再試一次看看：";
    fbDetail.innerText = "正確通順句子應該是：【" + unscrambleCurrent.target + "】";
    recordWrong({ title: "句子重組：" + unscrambleCurrent.target, explain: unscrambleCurrent.target });
  }

  fb.style.display = 'block';
  document.querySelectorAll('.word-block, .unscramble-btn').forEach(b => b.style.pointerEvents = 'none');
}

    shuffled.forEach((item, idx) => {

      html += '<button class="choice-btn" onclick="checkChoice('' + labels[idx] + '', decodeURIComponent('' + safeText + ''), decodeURIComponent('' + safeCorrect + ''))">' + labels[idx] + '. ' + item.text + '</button>';
    });
    html += '</div>';
    optArea.innerHTML = html;
  }
}

// ---------------- 數學、自然、英文處理邏輯 ----------------

  if (currentLesson === 'm_angle') {
    const shuffled = [...AngleQuizGenerators].sort(() => Math.random() - 0.5);
    for (let i = 0; i < Math.min(TOTAL_COUNT, shuffled.length); i++) currentQuestions.push(shuffled[i]());
    document.getElementById('poolBadge').innerText = "角單元：16 種題型・10 題保證完全不同！";
  } else if (currentLesson === 'all') {
    const allGenList = [
      ...AngleQuizGenerators,
      OtherMathGenerators.m_formula,
      OtherMathGenerators.m_div_ceil,
      OtherMathGenerators.m_div_floor,
      OtherMathGenerators.m_area_grid,
      OtherMathGenerators.m_capacity_displace,
      OtherMathGenerators.m_fraction_visual
    ];
    const shuffledAll = [...allGenList].sort(() => Math.random() - 0.5);
    for (let i = 0; i < TOTAL_COUNT; i++) currentQuestions.push(shuffledAll[i]());
    document.getElementById('poolBadge').innerText = "數學全範圍：全圖解動態出題・題目無限";
  } else if (currentLesson === 'm_formula') {
    for (let i = 0; i < TOTAL_COUNT; i++) currentQuestions.push(OtherMathGenerators.m_formula());
    document.getElementById('poolBadge').innerText = "除法算式按鈕機：數字每次隨機重算";
  } else if (currentLesson === 'm_div') {
    for (let i = 0; i < TOTAL_COUNT; i++) {
      const fn = rand(0, 1) === 0 ? OtherMathGenerators.m_div_ceil : OtherMathGenerators.m_div_floor;
      currentQuestions.push(fn());
    }
    document.getElementById('poolBadge').innerText = "除法生活應用：進一法與捨去法";
  } else if (currentLesson === 'm_area') {
    for (let i = 0; i < TOTAL_COUNT; i++) currentQuestions.push(OtherMathGenerators.m_area_grid());
    document.getElementById('poolBadge').innerText = "面積單元：方格即時繪圖出題";
  } else if (currentLesson === 'm_capacity') {
    for (let i = 0; i < TOTAL_COUNT; i++) currentQuestions.push(OtherMathGenerators.m_capacity_displace());
    document.getElementById('poolBadge').innerText = "容量單元：量筒排水法動態實驗圖";
  } else if (currentLesson === 'm_fraction') {
    for (let i = 0; i < TOTAL_COUNT; i++) currentQuestions.push(OtherMathGenerators.m_fraction_visual());
    document.getElementById('poolBadge').innerText = "分數單元：圓餅披薩切塊動態繪圖";
  }
  renderMathOrGenericQuestion();
}

function renderMathOrGenericQuestion() {
  const fb = document.getElementById('feedbackBox');
  fb.style.display = 'none';

  if (currentIndex >= currentQuestions.length) {
    document.getElementById('qTitle').innerText = "🎉 恭喜完成本組挑戰！總得分：" + score + " / " + (currentQuestions.length * 10) + " 分";
    document.getElementById('diagramArea').innerHTML = "";
    document.getElementById('optionArea').innerHTML = '<div style="text-align:center; padding:20px;">' +
        '<button class="next-btn" onclick="loadQuestions()">🎲 換一套全新考題繼續練習</button>' +
      '</div>';
    return;
  }

  const q = currentQuestions[currentIndex];
  document.getElementById('progressText').innerText = "第 " + (currentIndex + 1) + " / " + currentQuestions.length + " 題";
  document.getElementById('scoreText').innerText = "得分：" + score;
  document.getElementById('qTitle').innerText = q.title;

  const diagArea = document.getElementById('diagramArea');
  diagArea.innerHTML = "";
  if (q.draw && typeof q.draw === 'function') {
    const container = document.createElement('div');
    container.className = 'diagram-container';
    const canvas = document.createElement('canvas');
    container.appendChild(canvas);
    diagArea.appendChild(container);
    q.draw(canvas);
  }

  const optArea = document.getElementById('optionArea');
  optArea.innerHTML = "";

  if (q.type === 'formula') {
    document.getElementById('typeBadge').innerText = "🔢 算式按鈕機";
    userEquation = "";
    renderFormulaKeypad();
  } else if (q.type === 'spell') {
    document.getElementById('typeBadge').innerText = "🔤 字母拼字機";
    userSpelling = "";
    renderSpellBoard(q);
  } else {
    document.getElementById('typeBadge').innerText = "選擇題";
    const correctIdx = q.ans !== undefined ? (typeof q.ans === 'number' ? q.ans : (q.ans.charCodeAt(0) - 65)) : 0;
    const correctText = q.options[correctIdx] || q.options[0];
    const shuffled = q.options.map(opt => ({ text: opt, isCorrect: (opt === correctText) }));
    shuffled.sort(() => Math.random() - 0.5);

    let html = '<div class="choice-list">';
    const labels = ['A', 'B', 'C', 'D'];
    shuffled.forEach((item, idx) => {
      const safeText = encodeURIComponent(item.text);
      const safeCorrect = encodeURIComponent(correctText);
      html += '<button class="choice-btn" onclick="checkChoice('' + labels[idx] + '', decodeURIComponent('' + safeText + ''), decodeURIComponent('' + safeCorrect + ''))">' + labels[idx] + '. ' + item.text + '</button>';
    });
    html += '</div>';
    optArea.innerHTML = html;
  }
}

// 算式按鍵機
function renderFormulaKeypad() {
  const optArea = document.getElementById('optionArea');
  optArea.innerHTML = '<div class="math-display-container">' +
      '<div class="math-display-text" id="mDisplay">' + (userEquation || "（請點選下方按鈕輸入算式）") + '</div>' +
    '</div>' +
    '<div class="math-keypad">' +
      '<button class="m-key" onclick="pressMathKey('7')">7</button>' +
      '<button class="m-key" onclick="pressMathKey('8')">8</button>' +
      '<button class="m-key" onclick="pressMathKey('9')">9</button>' +
      '<button class="m-key op" onclick="pressMathKey('÷')">÷</button>' +
      '<button class="m-key func" onclick="deleteMathKey()">⌫</button>' +
      '<button class="m-key" onclick="pressMathKey('4')">4</button>' +
      '<button class="m-key" onclick="pressMathKey('5')">5</button>' +
      '<button class="m-key" onclick="pressMathKey('6')">6</button>' +
      '<button class="m-key op" onclick="pressMathKey('×')">×</button>' +
      '<button class="m-key func" onclick="clearMathKey()">C</button>' +

      '<button class="m-key" onclick="pressMathKey('3')">3</button>' +
      '<button class="m-key op" onclick="pressMathKey('＝')">＝</button>' +
      '<button class="m-key op" onclick="pressMathKey('⋯')">⋯(餘)</button>' +

      '<button class="m-key op" onclick="pressMathKey('＋')">＋</button>' +
