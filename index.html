<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Galaxy Mario Odyssey・星際英語大冒險 (國小三年級專屬)</title>
<style>
  :root {
    --bg-space: #070a13;
    --card-bg: rgba(19, 27, 46, 0.95);
    --primary: #38bdf8;
    --primary-glow: rgba(56, 189, 248, 0.35);
    --accent-gold: #fbbf24;
    --accent-purple: #a855f7;
    --accent-red: #f43f5e;
    --accent-green: #10b981;
    --text-main: #f8fafc;
    --text-sub: #94a3b8;
    --border: #243049;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: radial-gradient(circle at 50% 15%, #1e1b4b 0%, #0f172a 45%, var(--bg-space) 85%);
    color: var(--text-main);
    margin: 0;
    padding: 10px;
    min-height: 100vh;
    overflow-x: hidden;
  }
  .game-container {
    max-width: 960px;
    margin: 0 auto;
    background: var(--card-bg);
    border: 2px solid rgba(56, 189, 248, 0.3);
    border-radius: 28px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 35px var(--primary-glow);
    overflow: hidden;
    backdrop-filter: blur(16px);
    position: relative;
  }

  /* 頂部遊戲狀態列 (Game Status Bar) */
  .game-header {
    background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid var(--border);
    flex-wrap: wrap;
    gap: 10px;
  }
  .hud-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 15px;
    font-weight: 900;
  }
  .hud-hearts { color: #f43f5e; letter-spacing: 2px; font-size: 18px; }
  .hud-coins { color: var(--accent-gold); background: rgba(251, 191, 36, 0.15); border: 1px solid rgba(251, 191, 36, 0.4); padding: 4px 12px; border-radius: 20px; }
  .hud-score { color: var(--primary); background: rgba(56, 189, 248, 0.15); border: 1px solid rgba(56, 189, 248, 0.4); padding: 4px 12px; border-radius: 20px; }
  .btn-hud {
    padding: 6px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: #1e293b;
    color: var(--text-main);
    font-size: 13.5px;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-hud:hover { background: #334155; transform: translateY(-1px); }

  /* 🌌 星際大地圖 (Galaxy World Map View) */
  .map-view {
    padding: 24px 16px;
    min-height: 580px;
    position: relative;
    background: radial-gradient(circle at 50% 50%, rgba(30, 27, 75, 0.4) 0%, transparent 80%);
  }
  .map-title-banner {
    text-align: center;
    margin-bottom: 28px;
  }
  .map-title-banner h2 {
    margin: 0 0 6px 0;
    font-size: 26px;
    font-weight: 900;
    background: linear-gradient(90deg, #38bdf8, #c084fc, #fbbf24);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .map-title-banner p { margin: 0; font-size: 13.5px; color: var(--text-sub); }

  /* 星系軌道 (Planet Track) */
  .planet-track {
    display: flex;
    flex-direction: column;
    gap: 20px;
    max-width: 680px;
    margin: 0 auto;
    position: relative;
  }
  .planet-node {
    display: flex;
    align-items: center;
    gap: 18px;
    background: rgba(30, 41, 59, 0.7);
    border: 2px solid var(--border);
    border-radius: 24px;
    padding: 16px 20px;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
  }
  .planet-node:hover {
    transform: scale(1.03) translateX(6px);
    border-color: var(--primary);
    background: rgba(30, 41, 59, 0.95);
    box-shadow: 0 0 25px var(--primary-glow);
  }
  .planet-orb {
    width: 64px;
    height: 64px;
    min-width: 64px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.6), inset 0 -4px 8px rgba(0, 0, 0, 0.5);
    border: 2px solid rgba(255, 255, 255, 0.4);
  }
  .planet-info { flex: 1; }
  .planet-tag {
    font-size: 12px;
    font-weight: 900;
    padding: 2px 8px;
    border-radius: 6px;
    display: inline-block;
    margin-bottom: 4px;
  }
  .planet-name { font-size: 19px; font-weight: 900; margin: 0 0 4px 0; color: #fff; }
  .planet-desc { font-size: 13px; color: var(--text-sub); line-height: 1.4; margin: 0; }
  .planet-badge {
    font-size: 13px;
    font-weight: 900;
    color: var(--accent-gold);
    display: flex;
    align-items: center;
    gap: 4px;
  }

  /* 👾 太空馬力歐小英雄頭像 (Hero Avatar) */
  .hero-avatar {
    width: 44px;
    height: 44px;
    position: absolute;
    right: -20px;
    top: -12px;
    background: #f43f5e;
    border: 3px solid #fff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    box-shadow: 0 0 16px rgba(244, 63, 94, 0.8);
    animation: bounceHero 0.8s infinite alternate ease-in-out;
    z-index: 10;
  }
  @keyframes bounceHero {
    from { transform: translateY(0); }
    to { transform: translateY(-8px); }
  }

  /* 🚀 星球任務大廳 (Planet Mission Stage) */
  .mission-view {
    display: none;
    padding: 20px;
    animation: fadeIn 0.25s ease-in;
  }
  .mission-header-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .mission-nav-tabs {
    display: flex;
    gap: 8px;
    background: #0f172a;
    padding: 6px;
    border-radius: 16px;
    border: 1px solid var(--border);
    overflow-x: auto;
  }
  .m-tab-btn {
    padding: 10px 16px;
    border-radius: 12px;
    border: none;
    background: transparent;
    color: var(--text-sub);
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .m-tab-btn.active {
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    color: white;
    box-shadow: 0 2px 10px rgba(59, 130, 246, 0.4);
  }

  /* 關卡卡片 (Level Card) */
  .q-stage-card {
    background: #131b2e;
    border: 2px solid var(--border);
    border-radius: 24px;
    padding: 24px;
    margin-bottom: 20px;
    box-shadow: 0 6px 25px rgba(0, 0, 0, 0.4);
    position: relative;
  }
  .q-title-text {
    font-size: 21px;
    font-weight: 900;
    line-height: 1.6;
    margin: 0 0 10px 0;
    padding-right: 50px;
    color: #ffffff;
    white-space: pre-line;
  }
  .q-audio-float {
    position: absolute;
    right: 18px;
    top: 18px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid rgba(56, 189, 248, 0.5);
    background: rgba(56, 189, 248, 0.2);
    color: var(--primary);
    font-size: 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .q-audio-float:hover { background: var(--primary); color: #0f172a; transform: scale(1.1); }

  /* 選擇題選項卡 */
  .choice-stack { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
  .choice-card-btn {
    padding: 16px 20px;
    border: 2px solid var(--border);
    border-radius: 16px;
    background: #1e293b;
    color: var(--text-main);
    text-align: left;
    font-size: 17.5px;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.15s;
  }
  .choice-card-btn:hover { background: #334155; border-color: var(--primary); transform: translateX(4px); }
  .choice-card-btn.selected-correct {
    border-color: var(--accent-green) !important;
    background: rgba(16, 185, 129, 0.25) !important;
    color: #6ee7b7 !important;
    font-weight: 900 !important;
    box-shadow: 0 0 16px rgba(16, 185, 129, 0.5) !important;
  }
  .choice-card-btn.selected-wrong {
    border-color: var(--danger) !important;
    background: rgba(239, 68, 68, 0.25) !important;
    color: #fca5a5 !important;
    font-weight: 900 !important;
    box-shadow: 0 0 16px rgba(239, 68, 68, 0.5) !important;
  }

  /* 是非題按鈕 */
  .tf-duo-box { display: flex; gap: 16px; margin-top: 16px; }
  .tf-duo-btn {
    flex: 1;
    padding: 18px;
    border-radius: 18px;
    border: 2px solid var(--border);
    background: #1e293b;
    font-size: 22px;
    font-weight: 900;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
  }
  .tf-duo-btn.o { color: #34d399; }
  .tf-duo-btn.x { color: #f87171; }
  .tf-duo-btn:hover { background: #334155; transform: translateY(-2px); }
  .tf-duo-btn.selected-correct {
    border-color: var(--accent-green) !important;
    background: rgba(16, 185, 129, 0.25) !important;
  }
  .tf-duo-btn.selected-wrong {
    border-color: var(--danger) !important;
    background: rgba(239, 68, 68, 0.25) !important;
  }

  /* 🧩 句子積木架橋 (Sentence Unscramble Bridge) */
  .bridge-container {
    background: #0f172a;
    border: 2px dashed rgba(56, 189, 248, 0.4);
    border-radius: 20px;
    padding: 18px;
    margin: 18px 0;
    min-height: 80px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    justify-content: center;
  }
  .word-block {
    padding: 12px 18px;
    border-radius: 14px;
    border: 2px solid #38bdf8;
    background: linear-gradient(135deg, #1e293b, #334155);
    color: #ffffff;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    transition: all 0.15s;
  }
  .word-block:hover { transform: scale(1.05); border-color: var(--accent-gold); }
  .word-block.used { opacity: 0.3; pointer-events: none; border-color: #64748b; }
  .block-rack {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    margin: 16px 0;
  }

  /* ⌨️ 星際拼字機 (26-Key Speller Pod) */
  .spell-pod {
    background: #0f172a;
    border: 2px solid var(--border);
    border-radius: 22px;
    padding: 22px;
    text-align: center;
  }
  .spell-slots-row {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin: 18px 0;
    min-height: 52px;
    flex-wrap: wrap;
  }
  .slot-box {
    width: 44px;
    height: 52px;
    border: 2px solid rgba(56, 189, 248, 0.5);
    border-radius: 12px;
    background: #1e293b;
    color: var(--primary);
    font-size: 26px;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.5);
  }
  .slot-box.filled { border-color: #38bdf8; background: #0f172a; color: #fff; }
  .keypad-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 7px;
    max-width: 560px;
    margin: 0 auto 16px auto;
  }
  .key-pad-btn {
    padding: 13px 0;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    background: #1e293b;
    color: #ffffff;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.1s;
  }
  .key-pad-btn:active { transform: scale(0.92); }
  .key-pad-btn:hover { background: #334155; border-color: var(--primary); }

  /* 詳解橫幅 (Feedback Banner) */
  .feedback-banner {
    margin-top: 18px;
    padding: 18px 22px;
    border-radius: 18px;
    display: none;
    animation: fadeIn 0.25s ease-in;
  }
  .feedback-banner.correct {
    background: rgba(16, 185, 129, 0.18);
    border: 2px solid var(--accent-green);
    color: #ecfdf5;
  }
  .feedback-banner.wrong {
    background: rgba(239, 68, 68, 0.18);
    border: 2px solid var(--danger);
    color: #fef2f2;
  }
  .fb-head { font-size: 19px; font-weight: 900; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  .fb-text { font-size: 15px; line-height: 1.65; color: #e2e8f0; }
  .fb-trap-pill {
    display: inline-block;
    background: rgba(251, 191, 36, 0.2);
    color: var(--accent-gold);
    border: 1px solid rgba(251, 191, 36, 0.4);
    padding: 4px 10px;
    border-radius: 8px;
    font-weight: 800;
    margin-top: 8px;
  }
  .btn-continue {
    display: block;
    width: 100%;
    margin-top: 16px;
    padding: 14px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    color: white;
    font-size: 17px;
    font-weight: 900;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-continue:hover { transform: scale(1.01); filter: brightness(1.1); }

  /* 📜 黑洞終極考驗長卷模式 (Final Boss Test Paper View) */
  .paper-view { display: none; padding: 20px; animation: fadeIn 0.2s ease-in; }
  .paper-head {
    background: #1e293b;
    border: 2px solid #f43f5e;
    border-radius: 20px;
    padding: 18px 22px;
    margin-bottom: 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  .paper-q-card {
    background: #131b2e;
    border: 1.5px solid var(--border);
    border-radius: 18px;
    padding: 18px 20px;
    margin-bottom: 14px;
  }
  .paper-q-title { font-size: 17px; font-weight: 800; color: #fff; margin-bottom: 12px; white-space: pre-line; line-height: 1.5; }
  .paper-fb-box {
    margin-top: 10px;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 13.5px;
    line-height: 1.5;
    display: none;
  }
  .paper-fb-box.show { display: block; }
  .paper-fb-box.c { background: rgba(16, 185, 129, 0.2); border: 1px solid var(--accent-green); color: #6ee7b7; }
  .paper-fb-box.w { background: rgba(239, 68, 68, 0.2); border: 1px solid var(--danger); color: #fca5a5; }

  /* 錯題筆記本 */
  .notebook-view { display: none; padding: 20px; }
  .nb-card {
    background: #1e293b;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="game-container">
  <!-- 頂部 HUD (Heads-Up Display) -->
  <div class="game-header">
    <div class="hud-item">
      <span>冒險者生命：</span>
      <span class="hud-hearts" id="hudHearts">❤️❤️❤️</span>
    </div>
    <div class="hud-item hud-coins">
      <span>🪙 星際金幣：</span>
      <span id="hudCoins">0</span>
    </div>
    <div class="hud-item hud-score">
      <span>⭐ 總探索分：</span>
      <span id="hudScore">0</span>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="btn-hud" onclick="openNotebook()">📓 錯題筆記</button>
      <button class="btn-hud" style="color:#38bdf8;" onclick="returnToMap()">🌌 星際地圖</button>
    </div>
  </div>

  <!-- 🌌 1. 星際大地圖視窗 (Galaxy Mario World Map) -->
  <div class="map-view" id="mapView">
    <div class="map-title-banner">
      <h2>🚀 星際馬力歐・英語大冒險</h2>
      <p>點擊下方星球跳躍啟航！每顆星球具備【避坑掃雷】、【積木架橋】與【專屬拼字機】三段挑戰！</p>
    </div>

    <div class="planet-track" id="planetTrack"></div>
  </div>

  <!-- 🚀 2. 星球任務大廳視窗 (Planet Mission View) -->
  <div class="mission-view" id="missionView">
    <div class="mission-header-bar">
      <div>
        <span class="planet-tag" id="currentPlanetTag">Planet</span>
        <h2 style="margin:2px 0; font-size:24px;" id="currentPlanetName">星球名稱</h2>
      </div>
      <div class="mission-nav-tabs">
        <button class="m-tab-btn active" id="tab_traps" onclick="switchMissionTab('traps')">⚡ 避坑掃雷</button>
        <button class="m-tab-btn" id="tab_unscramble" onclick="switchMissionTab('unscramble')">🧩 積木架橋</button>
        <button class="m-tab-btn" id="tab_spelling" onclick="switchMissionTab('spelling')">⌨️ 專屬拼字機</button>
      </div>
    </div>

    <!-- 任務關卡本體 -->
    <div id="missionStageArea"></div>
  </div>

  <!-- 📜 3. 黑洞大魔王大考長卷視窗 (Final Boss Paper View) -->
  <div class="paper-view" id="paperView">
    <div class="paper-head">
      <div>
        <h3 style="margin:0; font-size:21px; color:#f43f5e;">👾 黑洞終極考驗・信義國小全真段考大考卷 (96分真題)</h3>
        <div style="font-size:13.5px; color:var(--text-sub); margin-top:4px;">字母接龍、字首自然發音、借書證閱讀、售票亭跨學科計算、文法綜合</div>
      </div>
      <div style="display:flex; align-items:center; gap:12px;">
        <span style="font-size:16.5px; font-weight:900; color:#34d399;" id="paperScoreLive">尚未交卷</span>
        <button class="btn-hud" onclick="returnToMap()">返回地圖</button>
      </div>
    </div>

    <div id="paperQuestionsContainer"></div>
    <button class="btn-continue" style="background:#10b981; max-width:320px; margin:24px auto;" id="btnSubmitPaper" onclick="submitPaperExam()">📝 交卷計分 ✔</button>
  </div>

  <!-- 📓 4. 錯題筆記本視窗 -->
  <div class="notebook-view" id="notebookView">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
      <h3 style="margin:0; font-size:20px; color:var(--accent-gold);">📓 星際冒險錯題記錄庫</h3>
      <button class="btn-hud" onclick="clearNotebook()">清空筆記</button>
    </div>
    <div id="notebookContent">目前太厲害了，完全沒有錯題記錄！</div>
  </div>
</div>

<script>
// ==============================================================
// 1. 純 Web Audio API 8-Bit 遊戲音效引擎 (零外部依賴，保證離線可播)
// ==============================================================
const AudioEngine = {
  ctx: null,
  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
  },
  playTone(freq, type, duration) {
    try {
      this.init();
      if (!this.ctx) return;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
      gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + duration);
    } catch (e) {}
  },
  playJump() {
    try {
      this.init();
      if (!this.ctx) return;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(160, this.ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(480, this.ctx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.15);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.15);
    } catch (e) {}
  },
  playCoin() {
    this.playTone(987.77, 'sine', 0.08);
    setTimeout(() => this.playTone(1318.51, 'sine', 0.2), 80);
  },
  playCorrect() {
    this.playTone(523.25, 'triangle', 0.1);
    setTimeout(() => this.playTone(659.25, 'triangle', 0.1), 90);

// ==============================================================
// 4. 初始化與大地圖渲染 (World Map)
// ==============================================================
function init() {
  renderHUD();
  renderWorldMap();
}

function renderHUD() {
  let heartsStr = '';
  for (let i = 0; i < 3; i++) {
    heartsStr += (i < gameState.lives) ? '❤️' : '🖤';
  }
  document.getElementById('hudHearts').innerText = heartsStr;
  document.getElementById('hudCoins').innerText = gameState.coins;
  document.getElementById('hudScore').innerText = gameState.score;
}

function renderWorldMap() {
  const container = document.getElementById('planetTrack');
  let html = '';

  PLANETS_DATA.forEach((planet, idx) => {
    const isHeroHere = (idx === gameState.currentPlanetIndex);
    html += `
      <div class="planet-node" onclick="jumpToPlanet(${idx})">
        ${isHeroHere ? '<div class="hero-avatar">🧑‍🚀</div>' : ''}
        <div class="planet-orb" style="background:${planet.themeColor}; border-color:${planet.themeColor};">
          ${planet.icon}
        </div>
        <div class="planet-info">
          <span class="planet-tag" style="background:${planet.themeColor}33; color:${planet.themeColor}; border:1px solid ${planet.themeColor}66;">
            ${planet.num}
          </span>
          <h3 class="planet-name">${planet.name} · ${planet.unitName}</h3>
          <p class="planet-desc">${planet.desc}</p>
        </div>
        <div class="planet-badge">⭐ 3 任務</div>
      </div>
    `;
  });

  // 加上終極大魔王黑洞節點
  html += `
    <div class="planet-node" style="border-color:#f43f5e; background:rgba(244,63,94,0.15);" onclick="openFinalBoss()">
      <div class="planet-orb" style="background:#f43f5e; border-color:#fda4af;">👾</div>
      <div class="planet-info">
        <span class="planet-tag" style="background:#f43f5e33; color:#f43f5e; border:1px solid #f43f5e;">終極大魔王</span>
        <h3 class="planet-name" style="color:#f43f5e;">黑洞終極考驗 · 信義國小全真段考大考卷</h3>
        <p class="planet-desc">真實96分考卷完整移植！挑戰售票亭票價算術、借書證判讀、字母接龍與語意理解。</p>
      </div>
      <div class="planet-badge" style="color:#f43f5e;">🔥 段考長卷</div>
    </div>
  `;

  container.innerHTML = html;
}

function jumpToPlanet(idx) {
  AudioEngine.playJump();
  gameState.currentPlanetIndex = idx;
  renderWorldMap();

  setTimeout(() => {
    document.getElementById('mapView').style.display = 'none';
    document.getElementById('paperView').style.display = 'none';
    document.getElementById('notebookView').style.display = 'none';
    document.getElementById('missionView').style.display = 'block';

    const p = PLANETS_DATA[idx];
    document.getElementById('currentPlanetTag').innerText = p.num;
    document.getElementById('currentPlanetTag').style.background = p.themeColor + '33';
    document.getElementById('currentPlanetTag').style.color = p.themeColor;
    document.getElementById('currentPlanetName').innerText = `${p.icon} ${p.name} · ${p.unitName}`;

    switchMissionTab('traps');
  }, 220);
}

function returnToMap() {
  AudioEngine.playJump();
  document.getElementById('missionView').style.display = 'none';
  document.getElementById('paperView').style.display = 'none';
  document.getElementById('notebookView').style.display = 'none';
  document.getElementById('mapView').style.display = 'block';
  renderWorldMap();
}

// ==============================================================
// 5. 任務子標籤切換 (避坑掃雷 / 積木架橋 / 專屬拼字)
// ==============================================================
function switchMissionTab(tabName) {
  AudioEngine.playTone(400, 'sine', 0.05);
  gameState.currentTab = tabName;
  document.querySelectorAll('.m-tab-btn').forEach(btn => btn.classList.remove('active'));
  const activeBtn = document.getElementById(`tab_${tabName}`);
  if (activeBtn) activeBtn.classList.add('active');

  const p = PLANETS_DATA[gameState.currentPlanetIndex];

  if (tabName === 'traps') {
    gameState.trapsIndex = 0;
    renderTrapsMission();
  } else if (tabName === 'unscramble') {
    gameState.unscrambleIndex = 0;
    renderUnscrambleMission();
  } else if (tabName === 'spelling') {
    gameState.spellingIndex = 0;
    renderSpellingMission();
  }
}

// --- Mission 1: 避坑掃雷 (Tricky Traps) ---
function renderTrapsMission() {
  const p = PLANETS_DATA[gameState.currentPlanetIndex];
  const container = document.getElementById('missionStageArea');
  const qList = p.traps;

  if (gameState.trapsIndex >= qList.length) {
    AudioEngine.playFanfare();
    container.innerHTML = `
      <div class="q-stage-card" style="text-align:center; padding:36px;">
        <h2 style="color:#34d399; font-size:26px;">🎉 恭喜通過【${p.name}】避坑掃雷任務！</h2>
        <p style="color:var(--text-sub);">成功獲得 🪙 +50 星際金幣，現在前往下一項任務吧！</p>
        <button class="btn-continue" onclick="switchMissionTab('unscramble')">前往【🧩 積木架橋】任務 ➔</button>
      </div>
    `;
    return;
  }

  const q = qList[gameState.trapsIndex];
  let optionsHTML = '';

  if (q.type === 'tf') {
    optionsHTML = `
      <div class="tf-duo-box">
        <button class="tf-duo-btn o" id="trap_tf_0" onclick="checkTrapAnswer(0)">⭕ 正確 (True)</button>
        <button class="tf-duo-btn x" id="trap_tf_1" onclick="checkTrapAnswer(1)">❌ 錯誤 (False)</button>
      </div>
    `;
  } else {
    optionsHTML = '<div class="choice-stack">';
    const labels = ['A', 'B', 'C', 'D'];
    q.options.forEach((opt, idx) => {
      optionsHTML += `
        <button class="choice-card-btn" id="trap_choice_${idx}" onclick="checkTrapAnswer(${idx})">
          <b>${labels[idx]}.</b> ${opt}
        </button>
      `;
    });
    optionsHTML += '</div>';
  }

  container.innerHTML = `
    <div style="display:flex; justify-content:space-between; margin-bottom:12px; font-weight:900; font-size:14px;">
      <span style="color:var(--primary);">⚡ 避坑掃雷關卡 第 ${gameState.trapsIndex + 1} / ${qList.length} 關</span>
      <span style="color:var(--accent-gold);">通關獎勵：🪙 10 金幣</span>
    </div>

    <div class="q-stage-card">
      <button class="q-audio-float" onclick="speakText('${q.title.replace(/'/g, "'")}')" title="點擊發音">🔊</button>
      <h3 class="q-title-text">${q.title}</h3>
      ${optionsHTML}

      <div class="feedback-banner" id="trapFeedback">
        <div class="fb-head" id="trapFbHead"></div>
        <div class="fb-text" id="trapFbText"></div>
        <button class="btn-continue" onclick="nextTrapQuestion()">挑戰下一題 ➔</button>
      </div>
    </div>
  `;
}

function checkTrapAnswer(userChoice) {
  const p = PLANETS_DATA[gameState.currentPlanetIndex];
  const q = p.traps[gameState.trapsIndex];
  const isCorrect = (userChoice === q.ans);

  if (q.type === 'tf') {
    [0, 1].forEach(i => {
      const b = document.getElementById(`trap_tf_${i}`);
      if (!b) return;
      b.disabled = true;
      if (i === q.ans) b.classList.add('selected-correct');
      else if (i === userChoice && !isCorrect) b.classList.add('selected-wrong');
    });
  } else {
    q.options.forEach((opt, i) => {
      const b = document.getElementById(`trap_choice_${i}`);
      if (!b) return;
      b.disabled = true;
      if (i === q.ans) b.classList.add('selected-correct');
      else if (i === userChoice && !isCorrect) b.classList.add('selected-wrong');
    });
  }

  const fb = document.getElementById('trapFeedback');
  const h = document.getElementById('trapFbHead');
  const t = document.getElementById('trapFbText');

  if (isCorrect) {
    AudioEngine.playCorrect();
    AudioEngine.playCoin();
    gameState.coins += 10;
    gameState.score += 20;
    renderHUD();

    fb.className = 'feedback-banner correct';
    h.innerHTML = `<span>🎉</span> <span>太神了！完全避開陷阱！(+10 金幣)</span>`;
  } else {
    AudioEngine.playWrong();
    handleLifeLost();
    recordMistake(q.title, q.explain, q.trap);

    fb.className = 'feedback-banner wrong';
    const correctStr = (q.type === 'tf') ? (q.ans === 0 ? '⭕ 正確' : '❌ 錯誤') : `${['A','B','C','D'][q.ans]}. ${q.options[q.ans]}`;
    h.innerHTML = `<span>💥</span> <span>踩到陷阱啦！正確答案是：【${correctStr}】</span>`;
  }

  t.innerHTML = `
    <div>📖 <b>解析核心：</b>${q.explain}</div>
    ${q.trap ? `<div class="fb-trap-pill">⚠️ 避坑提醒：${q.trap}</div>` : ''}
  `;
  fb.style.display = 'block';
  fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function nextTrapQuestion() {
  gameState.trapsIndex++;
  renderTrapsMission();
}

  const item = list[gameState.unscrambleIndex];
  gameState.unscrambleCurrentBlocks = [];

  // 打亂詞塊
  const shuffled = [...item.blocks].sort(() => Math.random() - 0.5);

  let rackHTML = '';
  shuffled.forEach((word, idx) => {
    rackHTML += `<button class="word-block" id="w_block_${idx}" onclick="pickWordBlock('${word.replace(/'/g, "'")}', ${idx})">${word}</button>`;
  });

  container.innerHTML = `
    <div style="display:flex; justify-content:space-between; margin-bottom:12px; font-weight:900; font-size:14px;">
      <span style="color:#c084fc;">🧩 積木架橋 第 ${gameState.unscrambleIndex + 1} / ${list.length} 關</span>
      <span style="color:var(--text-sub);">中文句意：【${item.trans}】</span>
    </div>

    <div class="q-stage-card">
      <div style="font-size:15px; color:var(--text-sub); text-align:center;">
        請依序點選下方積木，將句子通順排列在橋樑上：
      </div>

      <div class="bridge-container" id="bridgeTrack">
        <span style="color:#64748b; font-size:14px;">點擊下方單字積木放到這裡...</span>
      </div>

      <div class="block-rack" id="blockRack">
        ${rackHTML}
      </div>

      <div style="display:flex; justify-content:center; gap:12px; margin-top:16px;">
        <button class="btn-hud" onclick="resetUnscramble()">🔄 全部重排</button>
        <button class="btn-hud" style="background:#10b981; border-color:#10b981; color:#fff;" onclick="verifyBridge()">✔ 驗證架橋</button>
      </div>

      <div class="feedback-banner" id="bridgeFeedback">
        <div class="fb-head" id="bridgeFbHead"></div>
        <div class="fb-text" id="bridgeFbText"></div>
        <button class="btn-continue" onclick="nextUnscrambleQuestion()">前進下一座橋 ➔</button>
      </div>
    </div>
  `;
}

function pickWordBlock(word, idx) {
  AudioEngine.playTone(600, 'square', 0.05);
  const btn = document.getElementById(`w_block_${idx}`);
  if (btn) btn.classList.add('used');

  gameState.unscrambleCurrentBlocks.push({ word, idx });
  updateBridgeDisplay();
}

function updateBridgeDisplay() {
  const bridge = document.getElementById('bridgeTrack');
  if (gameState.unscrambleCurrentBlocks.length === 0) {
    bridge.innerHTML = '<span style="color:#64748b; font-size:14px;">點擊下方單字積木放到這裡...</span>';
    return;
  }
  let html = '';
  gameState.unscrambleCurrentBlocks.forEach(item => {
    html += `<span class="word-block" style="background:#2563eb; border-color:#60a5fa;">${item.word}</span>`;
  });
  bridge.innerHTML = html;
}

function resetUnscramble() {
  AudioEngine.playTone(300, 'sine', 0.08);
  gameState.unscrambleCurrentBlocks.forEach(item => {
    const btn = document.getElementById(`w_block_${item.idx}`);
    if (btn) btn.classList.remove('used');
  });
  gameState.unscrambleCurrentBlocks = [];
  updateBridgeDisplay();
}

function verifyBridge() {
  const p = PLANETS_DATA[gameState.currentPlanetIndex];
  const item = p.unscramble[gameState.unscrambleIndex];
  const userSentence = gameState.unscrambleCurrentBlocks.map(b => b.word).join(' ').trim();
  const isCorrect = (userSentence.toLowerCase() === item.target.toLowerCase());

  const fb = document.getElementById('bridgeFeedback');
  const h = document.getElementById('bridgeFbHead');
  const t = document.getElementById('bridgeFbText');

  if (isCorrect) {
    AudioEngine.playJump();
    AudioEngine.playCoin();
    gameState.coins += 15;
    gameState.score += 25;
    renderHUD();

    fb.className = 'feedback-banner correct';
    h.innerHTML = `<span>🎉</span> <span>架橋成功！小太空人順利跳躍過關！(+15 金幣)</span>`;
    t.innerHTML = `<div>📖 <b>標準句子：</b>${item.target}</div><div style="color:#94a3b8; font-size:13px; margin-top:4px;">中文：${item.trans}</div>`;
    speakText(item.target);
  } else {
    AudioEngine.playWrong();
    handleLifeLost();
    recordMistake(`句子重組【${item.trans}】`, `正確句子是：${item.target}`);

    fb.className = 'feedback-banner wrong';
    h.innerHTML = `<span>💥</span> <span>橋樑崩塌啦！句子順序有誤喔！</span>`;
    t.innerHTML = `<div>👉 <b>正確排列：</b>${item.target}</div><div style="color:#94a3b8; font-size:13px; margin-top:4px;">中文：${item.trans}</div>`;
  }

  fb.style.display = 'block';
  fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function nextUnscrambleQuestion() {
  gameState.unscrambleIndex++;
  renderUnscrambleMission();
}

// --- Mission 3: 星球密碼拼字機 (Spelling Pod) ---
function renderSpellingMission() {
  const p = PLANETS_DATA[gameState.currentPlanetIndex];
  const container = document.getElementById('missionStageArea');
  const list = p.spelling;

  if (gameState.spellingIndex >= list.length) {
    AudioEngine.playFanfare();
    container.innerHTML = `
      <div class="q-stage-card" style="text-align:center; padding:36px;">
        <h2 style="color:#fbbf24; font-size:26px;">🏆 恭喜破譯【${p.name}】所有單字密碼！</h2>
        <p style="color:var(--text-sub);">解鎖全星球獎勵 🪙 +100 金幣！小太空人獲得全新星際徽章！</p>
        <button class="btn-continue" onclick="returnToMap()">返回星際地圖 ➔</button>
      </div>
    `;
    return;
  }

  const item = list[gameState.spellingIndex];
  const targetWord = item.word.toUpperCase();
  gameState.spellingInput = '';

  let slotsHTML = '';
  for (let i = 0; i < targetWord.length; i++) {
    slotsHTML += `<div class="slot-box" id="s_slot_${i}"></div>`;
  }

  const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  let keypadHTML = '';
  alphabet.forEach(letter => {
    keypadHTML += `<button class="key-pad-btn" onclick="pressSpellingLetter('${letter}')">${letter}</button>`;
  });

  container.innerHTML = `
    <div style="display:flex; justify-content:space-between; margin-bottom:12px; font-weight:900; font-size:14px;">
      <span style="color:#38bdf8;">⌨️ 專屬拼字機 第 ${gameState.spellingIndex + 1} / ${list.length} 關</span>
      <span style="color:var(--accent-gold);">解鎖密碼：【${item.hint}】</span>
    </div>

    <div class="spell-pod">
      <button class="q-audio-float" style="position:static; margin:0 auto 10px auto;" onclick="speakText('${item.word}')" title="聆聽發音">🔊</button>
      <div style="font-size:20px; font-weight:900;" id="spellingHint">請拼出單字：【${item.hint}】</div>
      <div style="font-size:13px; color:var(--text-sub); margin-top:4px;">點選下方 26 鍵字母鍵盤輸入：</div>

      <div class="spell-slots-row" id="slotsRow">
        ${slotsHTML}
      </div>

      <div class="keypad-grid">
        ${keypadHTML}
      </div>

      <div style="display:flex; justify-content:center; gap:12px;">
        <button class="btn-hud" style="background:#dc2626; color:#fff;" onclick="deleteSpellingLetter()">⌫ 刪除</button>
        <button class="btn-hud" style="background:#16a34a; color:#fff;" onclick="submitSpellingWord()">✔ 送出檢查</button>
      </div>

      <div class="feedback-banner" id="spellingFeedback">
        <div class="fb-head" id="spellFbHead"></div>
        <div class="fb-text" id="spellFbText"></div>
        <button class="btn-continue" onclick="nextSpellingQuestion()">挑戰下一個單字 ➔</button>
      </div>
    </div>
  `;
}

function pressSpellingLetter(letter) {
  AudioEngine.playTone(800, 'sine', 0.04);
  const p = PLANETS_DATA[gameState.currentPlanetIndex];
  const item = p.spelling[gameState.spellingIndex];
  const maxLen = item.word.length;

  if (gameState.spellingInput.length < maxLen) {
    gameState.spellingInput += letter;
    updateSpellingSlots(maxLen);
  }
}

function deleteSpellingLetter() {
  AudioEngine.playTone(300, 'sine', 0.05);
  if (gameState.spellingInput.length > 0) {
    gameState.spellingInput = gameState.spellingInput.slice(0, -1);
    const p = PLANETS_DATA[gameState.currentPlanetIndex];
    const item = p.spelling[gameState.spellingIndex];
    updateSpellingSlots(item.word.length);
  }
}

function updateSpellingSlots(maxLen) {
  for (let i = 0; i < maxLen; i++) {
    const slot = document.getElementById(`s_slot_${i}`);
    if (slot) {
      const ch = gameState.spellingInput[i] || '';
      slot.innerText = ch;
      slot.className = ch ? 'slot-box filled' : 'slot-box';
    }
  }
}

function submitSpellingWord() {
  const p = PLANETS_DATA[gameState.currentPlanetIndex];
  const item = p.spelling[gameState.spellingIndex];
  const target = item.word.toUpperCase();

  if (gameState.spellingInput.length < target.length) {
    alert('請將單字字母填滿後再送出檢查喔！');
    return;
  }

  const isCorrect = (gameState.spellingInput === target);
  const fb = document.getElementById('spellingFeedback');
  const h = document.getElementById('spellFbHead');
  const t = document.getElementById('spellFbText');

  if (isCorrect) {
    AudioEngine.playCorrect();
    AudioEngine.playCoin();
    gameState.coins += 20;
    gameState.score += 30;
    renderHUD();

    fb.className = 'feedback-banner correct';
    h.innerHTML = `<span>🎉</span> <span>拼寫完全正確！破譯密碼！(+20 金幣)</span>`;
    speakText(target);
  } else {
    AudioEngine.playWrong();
    handleLifeLost();
    recordMistake(`單字拼寫【${item.hint}】`, `正確拼法為：${target}。${item.detail}`);

    fb.className = 'feedback-banner wrong';
    h.innerHTML = `<span>💥</span> <span>密碼錯誤！你輸入的是【${gameState.spellingInput}】</span>`;
  }

  t.innerHTML = `
    <div>📖 <b>標準單字：</b><span style="font-size:20px; font-weight:900; color:#38bdf8;">${target}</span></div>
    <div style="margin-top:4px; font-size:13.5px; color:#cbd5e1;">${item.detail}</div>
  `;
  fb.style.display = 'block';

  document.querySelectorAll('.key-pad-btn').forEach(b => b.disabled = true);
}

function nextSpellingQuestion() {
  gameState.spellingIndex++;
  renderSpellingMission();
}

// ==============================================================
// 6. 黑洞大魔王大考長卷模式 (Final Boss Test Paper)
// ==============================================================
function openFinalBoss() {
  AudioEngine.playTone(220, 'sawtooth', 0.25);
  document.getElementById('mapView').style.display = 'none';
  document.getElementById('missionView').style.display = 'none';
  document.getElementById('notebookView').style.display = 'none';
  document.getElementById('paperView').style.display = 'block';

  gameState.paperAnswers = {};
  document.getElementById('paperScoreLive').innerText = '尚未交卷';
  document.getElementById('btnSubmitPaper').style.display = 'block';

  renderPaperQuestions();
}

function renderPaperQuestions() {
  const container = document.getElementById('paperQuestionsContainer');
  let html = '';

  MIDTERM_EXAM_PAPER.forEach((q, idx) => {
    let optsHTML = '';
    if (q.type === 'tf') {
      optsHTML = `
        <div class="tf-duo-box" style="max-width:320px;">
          <button class="tf-duo-btn o" id="p_btn_${q.id}_0" onclick="choosePaperOption('${q.id}', 0)">⭕ 正確</button>
          <button class="tf-duo-btn x" id="p_btn_${q.id}_1" onclick="choosePaperOption('${q.id}', 1)">❌ 錯誤</button>
        </div>
      `;
    } else {
      optsHTML = '<div class="choice-stack">';
      const labels = ['A', 'B', 'C', 'D'];
      q.options.forEach((opt, optIdx) => {
        optsHTML += `
          <button class="choice-card-btn" id="p_btn_${q.id}_${optIdx}" onclick="choosePaperOption('${q.id}', ${optIdx})">
            <b>${labels[optIdx]}.</b> ${opt}
          </button>
        `;
      });
      optsHTML += '</div>';
    }

    html += `
      <div class="paper-q-card" id="p_card_${q.id}">
        <div class="paper-q-title">${idx + 1}. ${q.title}</div>
        ${optsHTML}
        <div class="paper-fb-box" id="p_fb_${q.id}"></div>
      </div>
    `;
  });

  container.innerHTML = html;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function choosePaperOption(qid, choiceIdx) {
  AudioEngine.playTone(500, 'sine', 0.04);
  gameState.paperAnswers[qid] = choiceIdx;
  const q = MIDTERM_EXAM_PAPER.find(item => item.id === qid);
  if (!q) return;

  if (q.type === 'tf') {
    [0, 1].forEach(i => {
      const b = document.getElementById(`p_btn_${qid}_${i}`);
      if (b) b.classList.toggle('selected-correct', i === choiceIdx);
    });
  } else {
    q.options.forEach((opt, i) => {
      const b = document.getElementById(`p_btn_${qid}_${i}`);
      if (b) b.classList.toggle('selected-correct', i === choiceIdx);
    });
  }
}

function submitPaperExam() {
  let correct = 0;
  const total = MIDTERM_EXAM_PAPER.length;

  MIDTERM_EXAM_PAPER.forEach(q => {
    const userAns = gameState.paperAnswers[q.id];
    const isCorrect = (userAns === q.ans);
    if (isCorrect) correct++;

    const fbBox = document.getElementById(`p_fb_${q.id}`);
    if (fbBox) {
      fbBox.className = 'paper-fb-box show ' + (isCorrect ? 'c' : 'w');
      const correctText = (q.type === 'tf') ? (q.ans === 0 ? '⭕ 正確' : '❌ 錯誤') : `${['A','B','C','D'][q.ans]}. ${q.options[q.ans]}`;
      fbBox.innerHTML = `
        <b>${isCorrect ? '✅ 答對了！' : '❌ 答錯了！'} 正確答案：【${correctText}】</b><br>
        ${q.explain}
        ${q.trap ? `<br><span style="color:#fbbf24;">⚠️ 避坑提醒：${q.trap}</span>` : ''}
      `;
    }

    if (q.type === 'tf') {
      [0, 1].forEach(i => {
        const b = document.getElementById(`p_btn_${q.id}_${i}`);
        if (!b) return;
        b.disabled = true;
        b.classList.remove('selected-correct', 'selected-wrong');
        if (i === q.ans) b.classList.add('selected-correct');
        else if (i === userAns && !isCorrect) b.classList.add('selected-wrong');
      });
    } else {
      q.options.forEach((opt, i) => {
        const b = document.getElementById(`p_btn_${q.id}_${i}`);
        if (!b) return;
        b.disabled = true;
        b.classList.remove('selected-correct', 'selected-wrong');
        if (i === q.ans) b.classList.add('selected-correct');
        else if (i === userAns && !isCorrect) b.classList.add('selected-wrong');
      });
    }

    if (!isCorrect) {
      recordMistake(q.title, q.explain, q.trap);
    }
  });

  const finalScore = Math.round((correct / total) * 100);
  if (finalScore >= 80) AudioEngine.playFanfare();
  else AudioEngine.playWrong();

  document.getElementById('paperScoreLive').innerHTML = `🎉 總分：<span style="font-size:22px; color:#34d399;">${finalScore}</span> 分 (答對 ${correct} / ${total} 題)`;
  document.getElementById('btnSubmitPaper').style.display = 'none';
}

// ==============================================================
// 7. 生命值扣減與錯題筆記系統
// ==============================================================
function handleLifeLost() {
  if (gameState.lives > 0) gameState.lives--;
  renderHUD();
  if (gameState.lives === 0) {
    setTimeout(() => {
      alert('💥 生命值耗盡啦！太空醫護站已為你急救復活（補充3顆心 ❤️❤️❤️），繼續加油！');
      gameState.lives = 3;
      renderHUD();
    }, 400);
  }
}

function recordMistake(title, explain, trap) {
  if (!gameState.wrongList.some(item => item.title === title)) {
    gameState.wrongList.push({ title, explain, trap: trap || '' });
  }
}

function openNotebook() {
  AudioEngine.playTone(350, 'sine', 0.08);
  document.getElementById('mapView').style.display = 'none';
  document.getElementById('missionView').style.display = 'none';
  document.getElementById('paperView').style.display = 'none';
  document.getElementById('notebookView').style.display = 'block';

  renderNotebookContent();
}

function renderNotebookContent() {
  const container = document.getElementById('notebookContent');
  if (gameState.wrongList.length === 0) {
    container.innerHTML = '<p style="color:#34d399; font-weight:900; font-size:16px;">太厲害了！目前完全沒有任何錯題記錄喔！</p>';
    return;
  }

  let html = '';
  gameState.wrongList.forEach((item, idx) => {
    html += `
      <div class="nb-card">
        <div style="font-size:13px; color:#c084fc; font-weight:bold;">錯題 ${idx + 1}</div>
        <div style="font-size:16.5px; font-weight:800; margin:6px 0; color:#fff; white-space:pre-line;">${item.title}</div>
        <div style="font-size:14px; color:#fca5a5; background:rgba(239,68,68,0.15); padding:10px 14px; border-radius:10px; border:1px solid rgba(239,68,68,0.3);">
          📌 核心考點解析：${item.explain}
          ${item.trap ? `<br><span style="color:#fbbf24;">⚠️ 避坑指南：${item.trap}</span>` : ''}
        </div>
      </div>
    `;
  });
  container.innerHTML = html;
}

function clearNotebook() {
  gameState.wrongList = [];
  renderNotebookContent();
}

// ==============================================================
// 8. 語音朗讀 (Speech Synthesis)
// ==============================================================
function speakText(text) {
  if (!text) return;
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const clean = text.replace(/[一-龥]/g, '').replace(/[_（）()【】：:?]/g, ' ').trim();
    const u = new SpeechSynthesisUtterance(clean || text);
    u.lang = 'en-US';
    u.rate = 0.88;
    window.speechSynthesis.speak(u);
  }
}

window.onload = init;
</script>
